name: Production release

# Publishing a GitHub Release (tag vX.Y.Z) builds every micro-frontend at the
# release commit, pushes each image under the immutable version tag, and pins
# production to it. Rolling back is re-running deploy-release.sh with an older
# version whose images still exist (see k8s/helm/deploy-release.sh).

on:
  release:
    types: [published]

jobs:
  production-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      GH_TOKEN: ${{ github.token }}
      PORTFOLIO_DOCKER_REGISTRY: ghcr.io/ichirokuxvi
      PORTFOLIO_DOCKER_SKIP_LOGIN: true
      # Where the shell loads its remotes from in production.
      PROD_MFE_BASE_URL: https://mfe.ichirokuxvi.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release version
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Could not resolve a release version from the tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Nx version
        id: nx-version
        run: echo "NX_VERSION=$(npm pkg get devDependencies.nx | tr -d '\"')" >> $GITHUB_ENV

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: nx-${{ runner.os }}-${{ env.NX_VERSION }}

      - name: Install Nx
        run: npm install nx@$NX_VERSION

      - name: Set lowercase repo
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWERCASE=$REPO_LC" >> $GITHUB_ENV

      - name: Restore Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-buildx-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build docker builder
        run: npx nx build docker/builder --configuration=production

      # Infrastructure images (local http server base, reverse proxy, certbot).
      - name: Build static docker apps
        run: |
          static_apps=$(npx nx show projects --type "app" --projects tag:type:static-docker | paste -sd, -)
          npx nx run-many -t build --configuration production --projects name:$static_apps

      - name: Test all apps
        run: |
          testable_apps=$(npx nx show projects --with-target test | paste -sd, -)
          docker run \
            --rm "ghcr.io/${{ env.REPO_LOWERCASE }}/builder:latest" \
            npx nx run-many -t test --projects $testable_apps

      # Build & push every micro-frontend under the immutable version tag, with the
      # production MFE base URL baked into the shell.
      # Tag each image with the immutable version (used for pinning/rollback) and
      # also move `latest`, which keeps values.yaml's default meaningful.
      - name: Build & push production images
        env:
          PORTFOLIO_IMAGE_TAG: ${{ steps.version.outputs.version }},latest
          MFE_BASE_URL: ${{ env.PROD_MFE_BASE_URL }}
        run: |
          apps_tobuild=$(npx nx show projects --type "app" --with-target build:docker | paste -sd, -)
          npx nx run-many -t build:docker --configuration production --projects $apps_tobuild

      - name: Save Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-buildx-release-${{ github.sha }}

      - name: Set up SSH for deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Sync chart and deploy production release
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./k8s/ ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }}:/root/k8s/

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash /root/k8s/helm/deploy-release.sh '${{ steps.version.outputs.version }}'"
