name: Production release

# Publishing a GitHub Release (tag vX.Y.Z) builds every micro-frontend at the
# release commit, pushes each image under the immutable version tag, and pins
# production to it. Rolling back is re-running deploy-release.sh with an older
# version whose images still exist (see k8s/helm/deploy-release.sh).
#
# Four jobs rather than one (k8s/plans/0007). The deploy is its own leaf job, which
# matters more here than on staging: GitHub's "Re-run failed jobs" re-runs only what
# failed, so re-running this job is "deploy this exact version again", with no
# rebuild. That is the operation you most want to be cheap and boring on the
# environment where things go wrong at the worst time.
#
# Nothing compiles on the runner. Every `nx build` runs inside BUILD_IMAGE, a digest
# pinned node:24-slim, and the image builds pass --exclude-task-dependencies so they
# cannot quietly recompile outside it.

on:
  release:
    types: [published]

# Serialize releases: only one production release runs at a time. If two releases are
# published close together, the second waits for the first to finish rather than
# running two builds/pushes and two `helm upgrade`s at once. cancel-in-progress is
# false so a release in flight is never killed mid-deploy. This is a property of the
# Helm release, so it stays at workflow level and covers every job below.
concurrency:
  group: production-release
  cancel-in-progress: false

env:
  # The one place the build environment is defined, for every job in this file.
  # Bump deliberately, in a commit, with:
  #   docker buildx imagetools inspect node:24-slim --format '{{println .Manifest.Digest}}'
  # Keep it equal to docker-ci.yml's and to the seven Luna Dockerfiles'. This file's
  # own project listing needs no git, unlike the staging one: it lists everything at
  # the release commit rather than what a diff touched.
  BUILD_IMAGE: node:24-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
  DOCKER_REGISTRY: ghcr.io/ichirokuxvi
  DOCKER_SKIP_LOGIN: true
  DOCKER_BUILD_CACHE: gha
  DOCKER_BUILD_CACHE_MODE: min
  # Where the shell loads its remotes from in production. Baked into the bundle by
  # the `nx build`, not by a docker build arg, since the compilation no longer
  # happens inside the image.
  PROD_MFE_BASE_URL: https://mfe.ichirokuxvi.com
  # ...and the remotes that are not on that host. velista is served from its own
  # origin (plan 0013), which no base URL can produce, so it names itself here and
  # overrides the base derived tuple. Per remote overrides win over the base, so
  # the other three are unaffected and stay unlisted.
  # That origin is velista.app now, a domain of its own rather than a label under
  # the portfolio's. `ichirokuxvi.com/velista` keeps working unchanged: the shell
  # still mounts the remote at that path, it just fetches remoteEntry.mjs from
  # here. The chart has to agree (k8s/helm/values.production.yaml, hostOverrides).
  PROD_MFE_REMOTE_URLS: velista=https://velista.app
  # Which backend the production velista image talks to (velista plan 0014).
  # Ignored by every app except velista, exactly as MFE_BASE_URL is ignored by
  # every app except the shell. Note `rt.` for realtime: the chart routes it on
  # its own host, and environment.prod.ts used to name `api.` for both. Both
  # moved to velista.app with the app they serve.
  PROD_LUNA_GATEWAY_URL: https://api.velista.app
  PROD_LUNA_REALTIME_URL: https://rt.velista.app
  # Options for every SSH in this file, rsync's transport included.
  #
  # ServerAliveInterval is not a nicety. GitHub hosted runners reach the VPS
  # through Azure's outbound SNAT, which drops a flow that has carried no packets
  # for 4 minutes, and `helm --wait` prints nothing at all while it waits. The
  # v0.2.1 deploy died at 4m24s with `client_loop: send disconnect: Broken pipe`,
  # and the diagnose step reconnected to the same host 2 seconds later: the host
  # was fine, the idle flow was not. A keepalive every 30 seconds keeps packets on
  # it; CountMax 10 still gives up after five minutes, so a genuinely unreachable
  # host is still a failed step rather than a hang.
  SSH_OPTS: '-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10'

jobs:
  # ---------------------------------------------------------------------------
  # The version, and what there is to build. No `affected` here: a release builds
  # everything at the release commit, by design.
  #
  # These are job outputs rather than step outputs so the deploy job can read the
  # version without depending on any other job's internals, which is what makes it
  # re-runnable on its own.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      static_apps: ${{ steps.lists.outputs.static_apps }}
      testable: ${{ steps.lists.outputs.testable }}
      apps_tobuild: ${{ steps.lists.outputs.apps_tobuild }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release version
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Could not resolve a release version from the tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      - name: List the projects to build
        id: lists
        run: |
          # Nx runs in the pinned image here too, so this job needs no Node on the
          # runner and reads the same project graph the build will. CI=true is not
          # decoration: the container does not inherit the runner's environment, and
          # without it Nx starts its file watching daemon inside a container that is
          # about to be thrown away.
          #
          # --json everywhere: `nx show projects` prints a JSON array when stdout is
          # not a TTY and one name per line when it is, and parsing the pretty form
          # silently finds nothing.
          list() {
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD":/w -w /w \
              -e CI=true -e HOME=/tmp -e npm_config_cache=/w/.npm \
              "$BUILD_IMAGE" \
              npx nx show projects "$@" --json \
              | jq -r 'join(",")'
          }

          {
            echo "static_apps=$(list --type app --projects tag:type:static-docker)"
            echo "testable=$(list --with-target test)"
            echo "apps_tobuild=$(list --type app --with-target build:docker)"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # A release re-runs the full suite on the release commit, so production is gated
  # independently of what ran on the PR or the staging deploy. It hangs off `setup`
  # alone and runs beside the build.
  # ---------------------------------------------------------------------------
  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      - name: Lint & test everything
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/w -w /w \
            -e CI=true -e HOME=/tmp -e npm_config_cache=/w/.npm \
            "$BUILD_IMAGE" \
            npx nx run-many -t lint test --projects "${{ needs.setup.outputs.testable }}"

  # ---------------------------------------------------------------------------
  # Build & push every micro-frontend under the immutable version tag, with the
  # production URLs baked into the bundles that need them.
  #
  # Each image is tagged with the immutable version (used for pinning and rollback)
  # and also moves `latest`, which keeps values.yaml's default meaningful. Both tags
  # go up in the one `--push`, rather than one push per tag.
  # ---------------------------------------------------------------------------
  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes the Actions runtime env so `docker buildx --cache-to=type=gha` works.
      - name: Expose GitHub Actions runtime for the gha cache
        uses: crazy-max/ghaction-github-runtime@v3

      # Only to run the Nx CLI, which orchestrates buildx. Nothing is compiled here.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      # Infrastructure images (the nginx base the frontend images are FROM).
      - name: Build static docker apps
        run: |
          npx nx run-many -t build --configuration production \
            --projects "${{ needs.setup.outputs.static_apps }}"

      # One invocation, one container, one Nx cache, so the shared libraries are
      # compiled once for the whole workspace rather than once per image.
      #
      # `VELISTA_APP_VERSION` is the release version, with its leading `v` already
      # stripped by the setup job, and it is the same string the images are tagged
      # with (velista plan 0034 D4). That identity is the point: a client states this
      # version on every gateway request, so the version a running client reports is
      # the version of the image serving it, and `MIN_CLIENT_VERSION` on the gateway
      # is a floor expressed in the same numbers a rollback is expressed in.
      - name: Build the bundles in the pinned image
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/w -w /w \
            -e CI=true -e HOME=/tmp -e npm_config_cache=/w/.npm \
            -e MFE_BASE_URL="$PROD_MFE_BASE_URL" \
            -e MFE_REMOTE_URLS="$PROD_MFE_REMOTE_URLS" \
            -e LUNA_GATEWAY_URL="$PROD_LUNA_GATEWAY_URL" \
            -e LUNA_REALTIME_URL="$PROD_LUNA_REALTIME_URL" \
            -e VELISTA_APP_VERSION="${{ needs.setup.outputs.version }}" \
            "$BUILD_IMAGE" \
            npx nx run-many -t build prune --configuration production \
              --projects "${{ needs.setup.outputs.apps_tobuild }}"

      # --exclude-task-dependencies is load bearing: without it a cold Nx cache would
      # let this step recompile a bundle here, on the runner, outside the pinned
      # image, and nothing would say so.
      - name: Build & push production images
        env:
          DOCKER_IMAGE_TAG: ${{ needs.setup.outputs.version }},latest
        run: |
          npx nx run-many -t build:docker --configuration production \
            --projects "${{ needs.setup.outputs.apps_tobuild }}" \
            --exclude-task-dependencies

  # ---------------------------------------------------------------------------
  # The deploy, on its own, so it can be retried on its own without rebuilding.
  #
  # `!cancelled()` rather than `always()`: a cancelled release must not deploy. The
  # results are tested against 'failure' rather than for 'success' to match the
  # staging workflow, where jobs can legitimately be skipped.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [setup, test, build]
    if: >-
      !cancelled()
      && needs.setup.result == 'success'
      && needs.test.result != 'failure'
      && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      # Only the chart is needed here, and only at the release tag.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # Is there anywhere to deploy to?
      #
      # Everything upstream is worth doing whether or not a host exists: the release
      # images land in the registry and can be deployed later, or pulled by a machine
      # that is not this pipeline's to know about. Only the SSH steps need a VPS.
      #
      # Without this gate a missing host fails the release at the first ssh call,
      # which marks a release red that in fact published every image correctly.
      #
      # Secrets are read through `env` rather than interpolated into the script,
      # which keeps a secret's contents out of the shell command line.
      - name: Is a production host configured
        id: deploy-target
        env:
          DEPLOY_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing SSH_DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing SSH_DEPLOY_USER"
          [ -n "$DEPLOY_KEY" ]  || missing="$missing SSH_DEPLOY_KEY"

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Production host is configured; the deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped::Images for ${{ needs.setup.outputs.version }} were built, tested and pushed to the registry, but no deploy ran because these repository secrets are unset:$missing. Set them to deploy automatically, or deploy by hand with k8s/helm/deploy-release.sh (VPS) or k8s/helm/deploy-homelab.sh (home machine)."
            {
              echo "### Production deploy skipped"
              echo
              echo "Release **${{ needs.setup.outputs.version }}** was built, tested and pushed."
              echo "No host was deployed to because these secrets are unset:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "Deploy it by hand with:"
              echo '```sh'
              echo "./k8s/helm/deploy-homelab.sh ${{ needs.setup.outputs.version }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up SSH for deployment
        if: steps.deploy-target.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # SSH_DEPLOY_HOST stays the production VPS. Staging moved to its own host
      # under SSH_DEPLOY_HOST_STAGING (k8s plan 0002, section 3).
      #
      # The chart lands in the deploy user's home rather than /root. SSH_DEPLOY_USER
      # is an unprivileged account: it owns nothing outside its home and holds no
      # sudo. Nothing below needs any, because k3s writes its kubeconfig world
      # readable (k8s/bootstrap/install.sh) and helm and kubectl are all a deploy
      # runs.
      - name: Sync chart to the production host
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          rsync -avz --delete -e "ssh $SSH_OPTS" \
            ./k8s/ ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }}:~/k8s/

      # Reject a deploy that cannot possibly work in seconds, rather than
      # diagnosing it in minutes from a crashloop (k8s plan 0006, section 3).
      - name: Preflight the production Secrets
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash ~/k8s/bootstrap/provision-release.sh --check --env production"

      - name: Deploy production release
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash ~/k8s/helm/deploy-release.sh '${{ needs.setup.outputs.version }}'"

      # Events are the part that matters and the part people forget:
      # ImagePullBackOff, a PVC that cannot bind, and a failing readiness probe all
      # announce themselves there and nowhere else (k8s plan 0003, section 3.4).
      - name: Diagnose the failed release
        if: failure() && steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash -s" << 'EOF'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl -n nx-portfolio get pods -o wide || true
            kubectl -n nx-portfolio get events --sort-by=.lastTimestamp | tail -40 || true
            for p in $(kubectl -n nx-portfolio get pods \
                  --field-selector=status.phase!=Running -o name 2>/dev/null); do
              echo "::group::$p"
              kubectl -n nx-portfolio describe "$p" | tail -30 || true
              kubectl -n nx-portfolio logs "$p" --tail=50 --all-containers || true
              echo "::endgroup::"
            done
          EOF
