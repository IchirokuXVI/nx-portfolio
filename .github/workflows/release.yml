name: Production release

# Publishing a GitHub Release (tag vX.Y.Z) builds every micro-frontend at the
# release commit, pushes each image under the immutable version tag, and pins
# production to it. Rolling back is re-running deploy-release.sh with an older
# version whose images still exist (see k8s/helm/deploy-release.sh).

on:
  release:
    types: [published]

# Serialize releases: only one production release runs at a time. If two releases are
# published close together, the second waits for the first to finish rather than
# running two builds/pushes and two `helm upgrade`s at once. cancel-in-progress is
# false so a release in flight is never killed mid-deploy.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  production-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_REGISTRY: ghcr.io/ichirokuxvi
      DOCKER_SKIP_LOGIN: true
      # Use the GitHub Actions cache backend (type=gha) for every docker build.
      DOCKER_BUILD_CACHE: gha
      # Export only the final image layers to the cache (see docker-ci.yml).
      DOCKER_BUILD_CACHE_MODE: min
      # Where the shell loads its remotes from in production.
      PROD_MFE_BASE_URL: https://mfe.ichirokuxvi.com
      # ...and the remotes that are not on that host. velista is served from its own
      # origin (plan 0013), which no base URL can produce, so it names itself here and
      # overrides the base derived tuple. Per remote overrides win over the base, so
      # the other three are unaffected and stay unlisted.
      PROD_MFE_REMOTE_URLS: velista=https://velista.ichirokuxvi.com
      # Which backend the production velista image talks to (velista plan 0014).
      # Ignored by every app except velista, exactly as MFE_BASE_URL is ignored by
      # every app except the shell. Note `rt.` for realtime: the chart routes it on
      # its own host, and environment.prod.ts used to name `api.` for both.
      PROD_LUNA_GATEWAY_URL: https://api.ichirokuxvi.com
      PROD_LUNA_REALTIME_URL: https://rt.ichirokuxvi.com
      # Options for every SSH in this job, rsync's transport included.
      #
      # ServerAliveInterval is not a nicety. GitHub hosted runners reach the VPS
      # through Azure's outbound SNAT, which drops a flow that has carried no
      # packets for 4 minutes, and `helm --wait` prints nothing at all while it
      # waits. A first install waits far longer than four minutes, so the flow is
      # reaped mid deploy, the client's next write fails, and the step dies with
      # `client_loop: send disconnect: Broken pipe` while the deploy it was
      # watching carries on running on the host. A keepalive every 30 seconds
      # keeps packets on the flow; CountMax 10 still gives up after five minutes
      # of a genuinely unresponsive host, so a dead VPS is still a failed step.
      SSH_OPTS: '-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release version
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Could not resolve a release version from the tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes the Actions runtime env so `docker buildx --cache-to=type=gha` works.
      - name: Expose GitHub Actions runtime for the gha cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Nx version
        id: nx-version
        run: echo "NX_VERSION=$(npm pkg get devDependencies.nx | tr -d '\"')" >> $GITHUB_ENV

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: nx-${{ runner.os }}-${{ env.NX_VERSION }}

      - name: Install Nx
        run: npm install nx@$NX_VERSION

      - name: Set lowercase repo
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWERCASE=$REPO_LC" >> $GITHUB_ENV

      # The builder's gha cache scope is keyed by the lockfile hash so its npm ci
      # layer is reused until dependencies change.
      - name: Build docker builder
        env:
          DOCKER_BUILD_CACHE_SCOPE: builder-${{ hashFiles('**/package-lock.json') }}
        run: npx nx build docker/builder --configuration=production

      # Infrastructure images (local http server base).
      - name: Build static docker apps
        run: |
          static_apps=$(npx nx show projects --type "app" --projects tag:type:static-docker | paste -sd, -)
          npx nx run-many -t build --configuration production --projects name:$static_apps

      # A release re-runs the full test suite on the release commit, so production is
      # gated independently of what ran on the PR or the staging deploy.
      - name: Test all apps
        run: |
          testable_apps=$(npx nx show projects --with-target test | paste -sd, -)
          docker run \
            --rm "ghcr.io/${{ env.REPO_LOWERCASE }}/builder:latest" \
            npx nx run-many -t test --projects $testable_apps

      # Build & push every micro-frontend under the immutable version tag, with the
      # production MFE base URL baked into the shell.
      # Tag each image with the immutable version (used for pinning/rollback) and
      # also move `latest`, which keeps values.yaml's default meaningful.
      - name: Build & push production images
        env:
          DOCKER_IMAGE_TAG: ${{ steps.version.outputs.version }},latest
          MFE_BASE_URL: ${{ env.PROD_MFE_BASE_URL }}
          MFE_REMOTE_URLS: ${{ env.PROD_MFE_REMOTE_URLS }}
          LUNA_GATEWAY_URL: ${{ env.PROD_LUNA_GATEWAY_URL }}
          LUNA_REALTIME_URL: ${{ env.PROD_LUNA_REALTIME_URL }}
        run: |
          apps_tobuild=$(npx nx show projects --type "app" --with-target build:docker | paste -sd, -)
          npx nx run-many -t build:docker --configuration production --projects $apps_tobuild

      # Is there anywhere to deploy to?
      #
      # Everything above this point (build, test, push) is worth doing whether or
      # not a host exists: the release images land in the registry and can be
      # deployed later, or pulled by a machine that is not this pipeline's to know
      # about. Only the SSH steps below need a VPS.
      #
      # Without this gate a missing host fails the release at the first ssh call,
      # which marks a release red that in fact published every image correctly.
      # With it, the release succeeds and says plainly that it did not deploy.
      #
      # Secrets are read through `env` rather than interpolated into the script,
      # which keeps a secret's contents out of the shell command line.
      - name: Is a production host configured
        id: deploy-target
        env:
          DEPLOY_HOST: ${{ secrets.SSH_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing SSH_DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing SSH_DEPLOY_USER"
          [ -n "$DEPLOY_KEY" ]  || missing="$missing SSH_DEPLOY_KEY"

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Production host is configured; the deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped::Images for ${{ steps.version.outputs.version }} were built, tested and pushed to the registry, but no deploy ran because these repository secrets are unset:$missing. Set them to deploy automatically, or deploy by hand with k8s/helm/deploy-release.sh (VPS) or k8s/helm/deploy-homelab.sh (home machine)."
            {
              echo "### Production deploy skipped"
              echo
              echo "Release **${{ steps.version.outputs.version }}** was built, tested and pushed."
              echo "No host was deployed to because these secrets are unset:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "Deploy it by hand with:"
              echo '```sh'
              echo "./k8s/helm/deploy-homelab.sh ${{ steps.version.outputs.version }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up SSH for deployment
        if: steps.deploy-target.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # SSH_DEPLOY_HOST stays the production VPS. Staging moved to its own host
      # under SSH_DEPLOY_HOST_STAGING (k8s plan 0002, section 3); adding a secret
      # rather than renaming both is what keeps this workflow — the one that is
      # currently working — untouched by the split.
      #
      # The chart lands in the deploy user's home rather than /root. SSH_DEPLOY_USER
      # is an unprivileged account: it owns nothing outside its home and holds no
      # sudo. Nothing below needs any, because k3s writes its kubeconfig world
      # readable (k8s/bootstrap/install.sh) and helm and kubectl are all a deploy
      # runs.
      - name: Sync chart to the production host
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          rsync -avz --delete -e "ssh $SSH_OPTS" \
            ./k8s/ ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }}:~/k8s/

      # Reject a deploy that cannot possibly work in seconds, rather than
      # diagnosing it in minutes from a crashloop (k8s plan 0006, section 3).
      - name: Preflight the production Secrets
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash ~/k8s/bootstrap/provision-release.sh --check --env production"

      - name: Deploy production release
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash ~/k8s/helm/deploy-release.sh '${{ steps.version.outputs.version }}'"

      # Events are the part that matters and the part people forget:
      # ImagePullBackOff, a PVC that cannot bind, and a failing readiness probe all
      # announce themselves there and nowhere else (k8s plan 0003, section 3.4).
      - name: Diagnose the failed release
        if: failure() && steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash -s" << 'EOF'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl -n nx-portfolio get pods -o wide || true
            kubectl -n nx-portfolio get events --sort-by=.lastTimestamp | tail -40 || true
            for p in $(kubectl -n nx-portfolio get pods \
                  --field-selector=status.phase!=Running -o name 2>/dev/null); do
              echo "::group::$p"
              kubectl -n nx-portfolio describe "$p" | tail -30 || true
              kubectl -n nx-portfolio logs "$p" --tail=50 --all-containers || true
              echo "::endgroup::"
            done
          EOF
