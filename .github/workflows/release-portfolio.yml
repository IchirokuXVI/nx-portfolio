name: Production release, portfolio

# A published GitHub Release deploys the portfolio unit at its tag (k8s plan
# 0016 D4), with the GitHub environment portfolio-production. The pipeline
# itself is release-unit.yml.
#
# The release event has no tag filter, so the job tests the tag: portfolio-v*,
# or until k8s plan 0017 a bare vX.Y.Z, which deploys both units at one version.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: >-
      startsWith(github.event.release.tag_name, 'portfolio-v')
      || (startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-v'))
    uses: ./.github/workflows/release-unit.yml
    with:
      unit: portfolio
      tag: ${{ github.event.release.tag_name }}
