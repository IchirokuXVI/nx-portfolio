name: Production release, portfolio

# A published GitHub Release whose tag is portfolio-vX.Y.Z deploys the
# portfolio unit at that tag, with the GitHub environment portfolio-production
# (k8s plans 0016 D4 and 0017 D1). The pipeline itself is release-unit.yml.
#
# The release event has no tag filter, so every Release starts this workflow.
# The test sits on the calling job, so a tag of another unit starts no reusable
# workflow and enters no concurrency group. `refuse` then says so and stays green.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'portfolio-v')
    uses: ./.github/workflows/release-unit.yml
    with:
      unit: portfolio
      tag: ${{ github.event.release.tag_name }}
    # Without it the deploy job of release-unit.yml sees none of the secrets of
    # portfolio-production, although it names that environment.
    secrets: inherit

  refuse:
    if: ${{ !startsWith(github.event.release.tag_name, 'portfolio-v') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: This tag is not a release of portfolio
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          line="\`$TAG\` is not a release of portfolio; the prefixes are \`portfolio-v\` and \`velista-v\`."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
