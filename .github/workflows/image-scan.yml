name: Image scan

# Weekly: scan the images staging runs for known vulnerabilities and file the
# findings under Security > Code scanning (k8s plan 0013).
#
# It reports and never blocks. A finding that has a fixed version is closed by
# the next Renovate digest or version update, and a finding without one cannot
# be closed by anything here. Only fixable HIGH and CRITICAL findings are
# reported, so the list stays one somebody reads.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every deployable image, from the project tags (k8s plan 0016 D7), so a new
  # app needs no edit here.
  images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout the unit registry
        uses: actions/checkout@v4

      - name: List the images
        id: list
        run: echo "images=$(node tools/deploy/units.mjs images --json)" >> "$GITHUB_OUTPUT"

  scan:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.images) }}
    steps:
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:staging
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # One category per image, or each upload replaces the one before it.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.image }}:staging
