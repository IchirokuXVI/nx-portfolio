name: Host maintenance

# Weekly OS, k3s and add-on patching for both clusters (k8s plan 0013).
#
#   Monday 03:30 UTC   staging is patched to one dated Debian snapshot, rebooted
#                      if due, and checked from the inside and the outside.
#   + 2 days           the host-production environment's wait timer runs out.
#                      Staging must still be healthy, and then production is
#                      patched to the SAME snapshot.
#
# A failure anywhere stops the run, so production is never touched after a
# staging that broke. GitHub mails a failed scheduled run to whoever last
# changed the schedule below.
#
# Times: the production backup CronJobs run from 02:17 to 03:07 in the hosts'
# local time, which is Central European (00:17 to 01:07 UTC in summer), so a
# patch always lands after a fresh dump. 03:30 UTC is 05:30 in Spain in summer
# and 04:30 in winter, the quietest hour of both products.
#
# A patch never overlaps a deploy: both hold the lock on the host (k8s plan
# 0016 D2), so neither names a concurrency group of the other.
#
# One time setup, in the repository settings (k8s/README-new-cluster.md, 10b):
#   - environment host-staging, no rules, with the secrets SSH_DEPLOY_HOST,
#     SSH_DEPLOY_USER and SSH_DEPLOY_KEY of the staging host
#   - environment host-production, wait timer 2880 minutes, with the same three
#     for production and SSH_SOAK_CHECK_HOST, the staging host
#   - variable SSH_KNOWN_HOSTS: ssh-keyscan -t ed25519 ichirokuxvi.com staging.ichirokuxvi.com
#   - on each host, once: provision-host.sh --k3s, which installs nx-host-patch
# k8s/bootstrap/github-environments.sh sets both environments. The calls below
# pass `secrets: inherit`, because host-patch.yml sees no secret of its
# environment otherwise, and the environment's value wins over a repository
# secret of the same name.

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      snapshot:
        description: snapshot.debian.org timestamp (blank for now), e.g. 20261026T030000Z
        type: string
        default: ''
      production:
        description: Carry the snapshot to production after the soak
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
      staging: ${{ steps.endpoints.outputs.staging }}
      production: ${{ steps.endpoints.outputs.production }}
    steps:
      # The hour, not the minute: snapshot.debian.org resolves a timestamp to
      # the newest import at or before it, and a round number is easier to read
      # in a summary and to type into a manual run.
      - name: Pick the snapshot
        id: snapshot
        env:
          GIVEN: ${{ inputs.snapshot }}
        run: |
          snap="${GIVEN:-$(date -u +%Y%m%dT%H0000Z)}"
          [[ "$snap" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || { echo "::error::bad snapshot: $snap"; exit 1; }
          echo "snapshot=$snap" >> "$GITHUB_OUTPUT"
          echo "### Debian snapshot \`$snap\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the unit registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Every host of every unit, from k8s/units (k8s plan 0016 D7), so a new
      # unit needs no edit here.
      - name: The endpoints of each environment
        id: endpoints
        run: |
          staging="$(node tools/deploy/units.mjs endpoints staging | paste -sd' ' -)"
          production="$(node tools/deploy/units.mjs endpoints production | paste -sd' ' -)"
          [ -n "$staging" ] && [ -n "$production" ] || { echo "::error::k8s/units names no host"; exit 1; }
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"

  staging:
    needs: plan
    uses: ./.github/workflows/host-patch.yml
    with:
      environment: host-staging
      snapshot: ${{ needs.plan.outputs.snapshot }}
      endpoints: ${{ needs.plan.outputs.staging }}
    secrets: inherit

  production:
    needs: [plan, staging]
    if: github.event_name == 'schedule' || inputs.production
    uses: ./.github/workflows/host-patch.yml
    with:
      environment: host-production
      snapshot: ${{ needs.plan.outputs.snapshot }}
      endpoints: ${{ needs.plan.outputs.production }}
      soak-check-endpoints: ${{ needs.plan.outputs.staging }}
    secrets: inherit
