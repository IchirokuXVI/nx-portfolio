name: Staging deploy, portfolio

# Every push to main stages the portfolio unit (k8s plan 0016 D2): its affected
# images, its gates, and a deploy with the GitHub environment portfolio-staging.
# The pipeline itself is stage-unit.yml.

on:
  push:
    branches:
      - main
  # Manual run. Leave build_all on to rebuild and redeploy every image of the
  # unit, for example to bootstrap images that affected never rebuilt.
  workflow_dispatch:
    inputs:
      build_all:
        description: Build and deploy every image of the unit (ignore affected)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  stage:
    uses: ./.github/workflows/stage-unit.yml
    with:
      unit: portfolio
      build_all: ${{ inputs.build_all || false }}
