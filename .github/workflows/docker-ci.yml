name: Staging deploy (main)

# Every push to main builds the affected micro-frontends, pushes them under the
# mutable `staging` image tag, and rolls the changed staging deployments so they
# re-pull. Production is untouched here; it is deployed only by release.yml.

on:
  push:
    branches:
      - main
  # Manual trigger. Use it to build and deploy every staging app at once, e.g.
  # to bootstrap images that `affected` never rebuilt. Leave build_all on (the
  # default) for that; turn it off to run the normal affected path manually.
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build & deploy all staging apps (ignore affected)'
        type: boolean
        default: true

jobs:
  staging-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      GH_TOKEN: ${{ github.token }}
      PORTFOLIO_DOCKER_REGISTRY: ghcr.io/ichirokuxvi
      PORTFOLIO_DOCKER_SKIP_LOGIN: true
      # Where the shell loads its remotes from on staging. Baked into the shell
      # bundle at build time (ignored by the other, environment-agnostic apps).
      STAGING_MFE_BASE_URL: https://mfe.staging.ichirokuxvi.com

    steps:
      # Checkout full history so Nx can detect changes
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Setup Node.js & Nx
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Read the Nx version dynamically from package.json
      - name: Get Nx version
        id: nx-version
        run: echo "NX_VERSION=$(npm pkg get devDependencies.nx | tr -d '\"')" >> $GITHUB_ENV

      # Cache Nx installation
      - name: Cache Nx
        id: cache-nx
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: nx-${{ runner.os }}-${{ env.NX_VERSION }}

      - name: Install Nx
        run: npm install nx@$NX_VERSION

      - name: Set lowercase repo
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWERCASE=$REPO_LC" >> $GITHUB_ENV

      - name: Restore Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build main docker builder
        run: npx nx build docker/builder --configuration=production

      - name: Get last successful commit on current branch
        id: last_success
        run: |
          branch="${GITHUB_REF_NAME}"
          workflow_id="${GITHUB_WORKFLOW}"

          # Find the most recent successful run (excluding the current one)
          last_run=$(gh run list \
            --branch "$branch" \
            --workflow "$workflow_id" \
            --json headSha,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].headSha')

          echo "sha=$last_run" >> $GITHUB_OUTPUT

      - name: Print last successful commit
        run: |
          echo "Last successful commit SHA: ${{ steps.last_success.outputs.sha }}"

      - name: Get affected apps
        id: get-affected-apps
        run: |
          base_sha="${{ steps.last_success.outputs.sha }}"

          docker_apps=$(npx nx show projects --type "app" --projects tag:type:static-docker | paste -sd, -)
          echo "docker_apps=$docker_apps" >> "$GITHUB_OUTPUT"

          testable_apps=$(npx nx show projects --with-target test | paste -sd, -)
          echo "testable_apps=$testable_apps" >> "$GITHUB_OUTPUT"

          apps_tobuild=$(npx nx show projects --type "app" --with-target build:docker | paste -sd, -)
          echo "apps_tobuild=$apps_tobuild" >> "$GITHUB_OUTPUT"

          # Build everything when there is no previous successful commit to diff
          # against (first run), or when manually dispatched with build_all. This
          # is how missing staging images get bootstrapped.
          if [ -z "$base_sha" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; }; then
            echo "Building all apps (first run or manual build_all)."
            affected_docker_apps="$docker_apps"
            affected_testable_apps="$testable_apps"
            affected_apps_tobuild="$apps_tobuild"
          else
            affected_docker_apps=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$docker_apps" | paste -sd, -)
            affected_testable_apps=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$testable_apps" | paste -sd, -)
            affected_apps_tobuild=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$apps_tobuild" | paste -sd, -)
          fi

          echo "affected_docker_apps=$affected_docker_apps" >> "$GITHUB_OUTPUT"
          echo "affected_testable_apps=$affected_testable_apps" >> "$GITHUB_OUTPUT"
          echo "affected_apps_tobuild=$affected_apps_tobuild" >> "$GITHUB_OUTPUT"

          # Staging kubernetes deployment names are the lowercased app names with a
          # `-staging` suffix (see k8s/helm/values.yaml). Used to roll them below.
          affected_staging=$(echo "$affected_apps_tobuild" | tr ',' '\n' | sed '/^$/d' | tr '[:upper:]' '[:lower:]' | sed 's/$/-staging/' | paste -sd' ' -)
          echo "affected_staging=$affected_staging" >> "$GITHUB_OUTPUT"

          echo "Affected apps to build: $affected_apps_tobuild"
          echo "Affected staging deployments: $affected_staging"

      # Build affected static docker apps (builder base, local http server, proxy, certbot)
      - name: Build affected docker apps
        if: ${{ steps.get-affected-apps.outputs.affected_docker_apps != '' }}
        run: |
          npx nx run-many -t build --configuration production --projects name:${{ steps.get-affected-apps.outputs.affected_docker_apps }}

      # Test affected apps inside the builder image
      - name: Test affected apps
        if: ${{ steps.get-affected-apps.outputs.affected_testable_apps != '' }}
        run: |
          docker run \
            --rm "ghcr.io/${{ env.REPO_LOWERCASE }}/builder:latest" \
            npx nx run-many -t test --projects ${{ steps.get-affected-apps.outputs.affected_testable_apps }}

      # ---------------------------------------------------------------------------
      # e2e against the actual Docker images (not the dev server).
      #
      # The stack is brought up in "port" mode: every app image runs as its own
      # container on the remote's dev-serve port (shell 4200, remotes 4201-4204).
      # A development shell build's string remotes already resolve to
      # http://localhost:4201..4204, so no reverse proxy and no MFE_BASE_URL are
      # needed - the same setup documented in k8s/README.md, minus Kubernetes.
      #
      # This runs before the staging build/push so a failure gates the deploy.
      # ---------------------------------------------------------------------------
      - name: Get affected e2e projects
        id: get-affected-e2e
        run: |
          base_sha="${{ steps.last_success.outputs.sha }}"

          all_e2e=$(npx nx show projects --with-target e2e | paste -sd, -)

          if [ -z "$base_sha" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; }; then
            affected_e2e="$all_e2e"
          else
            affected_e2e=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$all_e2e" | paste -sd, -)
          fi

          # landing-e2e and odontogram-e2e are excluded: pre-existing breakage
          # (their tsconfig sets module=commonjs under the workspace's
          # moduleResolution=bundler, TS5095, and their specs predate the
          # through-shell routing). See k8s/README.md.
          affected_e2e=$(echo "$affected_e2e" | tr ',' '\n' | sed '/^$/d' | grep -vE '^(landing-e2e|odontogram-e2e)$' | paste -sd, -)

          echo "projects=$affected_e2e" >> "$GITHUB_OUTPUT"
          echo "Affected e2e projects: $affected_e2e"

      # Build the five app images in development configuration (port mode) and run
      # them as plain containers. The builder/local-http-server bases are reused
      # from the production build above by retagging them to the `dev` tag the
      # development Dockerfiles expect (BUILDER_TAG=dev).
      - name: Build & start the e2e docker stack
        if: ${{ steps.get-affected-e2e.outputs.projects != '' }}
        run: |
          REG="ghcr.io/${{ env.REPO_LOWERCASE }}"
          docker tag "$REG/builder:latest" "$REG/builder:dev"

          npx nx run docker/local-http-server:build --configuration=development
          # No MFE_BASE_URL: port mode relies on the default localhost:<port> remotes.
          npx nx run-many -t build:docker --configuration=development \
            --projects shell,landing,odontogram,damoclesSword,landingV2

          docker run -d --name shell         -p 4200:80 "$REG/shell:dev"
          docker run -d --name landing       -p 4201:80 "$REG/landing:dev"
          docker run -d --name odontogram    -p 4202:80 "$REG/odontogram:dev"
          docker run -d --name damoclessword -p 4203:80 "$REG/damoclessword:dev"
          docker run -d --name landingv2     -p 4204:80 "$REG/landingv2:dev"

          # Wait for the shell to answer.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4200/en >/dev/null 2>&1; then
              echo "shell is up"; break
            fi
            echo "waiting for shell ($i)..."; sleep 2
          done

      - name: Run affected e2e against the docker stack
        if: ${{ steps.get-affected-e2e.outputs.projects != '' }}
        env:
          E2E_BASE_URL: http://localhost:4200
        run: |
          # Ensure the runners' browsers are present.
          npx playwright install --with-deps chromium
          npx cypress install

          rc=0
          IFS=',' read -ra PROJECTS <<< "${{ steps.get-affected-e2e.outputs.projects }}"
          for p in "${PROJECTS[@]}"; do
            echo "::group::e2e $p"
            if [ -f "apps/$p/playwright.config.ts" ]; then
              npx playwright test -c "apps/$p/playwright.config.ts" --project=chromium || rc=1
            else
              npx cypress run --project "apps/$p" --browser electron || rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Tear down the e2e docker stack
        if: ${{ always() && steps.get-affected-e2e.outputs.projects != '' }}
        run: docker rm -f shell landing odontogram damoclessword landingv2 || true

      # Build & push affected micro-frontends under the mutable `staging` tag.
      # The shell reads MFE_BASE_URL; the other apps ignore it.
      - name: Build & push staging images
        if: ${{ steps.get-affected-apps.outputs.affected_apps_tobuild != '' }}
        env:
          PORTFOLIO_IMAGE_TAG: staging
          MFE_BASE_URL: ${{ env.STAGING_MFE_BASE_URL }}
        run: |
          npx nx run-many -t build:docker --configuration production --projects ${{ steps.get-affected-apps.outputs.affected_apps_tobuild }}

      - name: Save Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}

      - name: Set up SSH for deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Sync chart and deploy staging via Helm
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./k8s/ ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }}:/root/k8s/

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST }} \
            "bash -s -- '${{ steps.get-affected-apps.outputs.affected_staging }}'" << 'EOF'
            set -e
            AFFECTED_STAGING="$1"

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            PROD_TAG_FILE=/root/helm-live/prod-tag.yaml

            # Preserve the live production version across staging deploys.
            EXTRA_VALUES=""
            if [ -f "$PROD_TAG_FILE" ]; then
              EXTRA_VALUES="--values $PROD_TAG_FILE"
            fi

            echo "Applying chart (staging enabled, production version preserved)..."
            helm upgrade nx-portfolio /root/k8s/helm \
              --namespace nx-portfolio \
              --create-namespace \
              --values /root/k8s/helm/values.yaml \
              $EXTRA_VALUES

            # The staging tag is mutable, so a plain upgrade will not restart the
            # staging pods; roll the affected ones so they re-pull the new image.
            for dep in $AFFECTED_STAGING; do
              echo "Restarting deployment/$dep ..."
              kubectl rollout restart "deployment/$dep" -n nx-portfolio || true
            done

            echo "Staging deployment complete."
          EOF
