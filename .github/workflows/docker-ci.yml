name: Staging deploy (main)

# Every push to main builds the affected micro-frontends, pushes them under the
# mutable `staging` image tag, and rolls the changed staging deployments so they
# re-pull. Production is untouched here; it is deployed only by release.yml.
#
# Six jobs rather than one long one (k8s/plans/0007). Two reasons:
#
#   Speed. The suites and the build have no dependency on each other, so they run at
#   the same time instead of in a line.
#
#   Retries. GitHub's "Re-run failed jobs" re-runs only what failed and what depends
#   on it, reusing the successful jobs' outputs. A deploy that dies on a dropped SSH
#   connection is retried by itself, in about a minute, against images that are
#   already in the registry. It used to mean rebuilding ten images first.
#
# Nothing compiles on the runner. Every `nx build` runs inside BUILD_IMAGE, a digest
# pinned node:24, which is what makes a build independent of whichever runner GitHub
# hands out. The image builds afterwards pass --exclude-task-dependencies so they
# cannot quietly recompile outside it.

on:
  push:
    branches:
      - main
  # Manual trigger. Use it to build and deploy every staging app at once, e.g.
  # to bootstrap images that `affected` never rebuilt. Leave build_all on (the
  # default) for that; turn it off to run the normal affected path manually.
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build & deploy all staging apps (ignore affected)'
        type: boolean
        default: true

# Serialize staging deploys: only one runs at a time. A run triggered while another
# is in progress waits for it to finish instead of racing the build/push and the
# helm upgrade. cancel-in-progress is false so an in-flight deploy is never killed
# mid-way. This is a property of the Helm release, so it stays at workflow level and
# covers every job below.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  # The one place the build environment is defined, for every job in this file.
  # Bump deliberately, in a commit, with:
  #   docker buildx imagetools inspect node:24 --format '{{println .Manifest.Digest}}'
  BUILD_IMAGE: node:24@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
  DOCKER_REGISTRY: ghcr.io/ichirokuxvi
  DOCKER_SKIP_LOGIN: true
  # Use the GitHub Actions cache backend (type=gha) for every docker build, instead
  # of the local-dir cache + actions/cache tarball round-trip.
  DOCKER_BUILD_CACHE: gha
  # The images are now a base plus a COPY of a finished bundle, so there is no
  # expensive intermediate stage left to cache. `min` writes the least.
  DOCKER_BUILD_CACHE_MODE: min
  # Where the shell loads its remotes from on staging. Baked into the shell bundle by
  # the `nx build` below (ignored by the other, environment-agnostic apps). These
  # reach webpack as ordinary environment variables now, not as docker build args,
  # because the compilation no longer happens inside the image.
  STAGING_MFE_BASE_URL: https://mfe.staging.ichirokuxvi.com
  # ...and the remotes that are not on that host. velista is served from its own
  # origin (plan 0013), which no base URL can produce, so it names itself here and
  # overrides the base derived tuple. Per remote overrides win over the base, so
  # the other three are unaffected and stay unlisted.
  # That origin is staging.velista.app now, velista's own domain rather than a
  # label under the portfolio's. `staging.ichirokuxvi.com/velista` is unaffected:
  # the shell still mounts the remote there and only the fetch moves. The chart
  # has to agree (k8s/helm/values.staging.yaml, hostOverrides).
  STAGING_MFE_REMOTE_URLS: velista=https://staging.velista.app
  # Which backend the staging velista image talks to (velista plan 0014). On
  # velista's domain too, since these two exist only to serve it.
  STAGING_LUNA_GATEWAY_URL: https://api.staging.velista.app
  STAGING_LUNA_REALTIME_URL: https://rt.staging.velista.app
  # Options for every SSH in this file, rsync's transport included.
  #
  # ServerAliveInterval is not a nicety. GitHub hosted runners reach the VPS
  # through Azure's outbound SNAT, which drops a flow that has carried no packets
  # for 4 minutes, and `helm --wait` prints nothing at all while it waits. The
  # v0.2.1 deploy died at 4m24s with `client_loop: send disconnect: Broken pipe`,
  # and the diagnose step reconnected to the same host 2 seconds later: the host
  # was fine, the idle flow was not. A keepalive every 30 seconds keeps packets on
  # it; CountMax 10 still gives up after five minutes, so a genuinely unreachable
  # host is still a failed step rather than a hang.
  SSH_OPTS: '-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10'

jobs:
  # ---------------------------------------------------------------------------
  # What changed. Everything downstream reads these outputs rather than
  # recomputing them, which is also what lets the deploy job be re-run on its own:
  # a job may depend on another job's outputs, never on its step outputs.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      docker_apps: ${{ steps.lists.outputs.docker_apps }}
      testable: ${{ steps.lists.outputs.testable }}
      apps_tobuild: ${{ steps.lists.outputs.apps_tobuild }}
      deployments: ${{ steps.lists.outputs.deployments }}
      e2e: ${{ steps.lists.outputs.e2e }}
      luna: ${{ steps.lists.outputs.luna }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history so Nx can diff against an arbitrary earlier SHA.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      - name: Get last successful commit on current branch
        id: last_success
        run: |
          last_run=$(gh run list \
            --branch "${GITHUB_REF_NAME}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --json headSha,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].headSha')

          echo "sha=$last_run" >> "$GITHUB_OUTPUT"
          echo "Last successful commit SHA: ${last_run:-(none)}"

      - name: Work out what is affected
        id: lists
        run: |
          base_sha="${{ steps.last_success.outputs.sha }}"

          # Build everything when there is no previous successful commit to diff
          # against (first run), or when manually dispatched with build_all. This
          # is how missing staging images get bootstrapped.
          if [ -z "$base_sha" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; }; then
            echo "Building all apps (first run or manual build_all)."
            scope=""
          else
            scope="--affected --base $base_sha --head ${{ github.sha }}"
          fi

          # Nx runs in the pinned image here too, so this job needs no Node on the
          # runner and reads the same project graph the build will. CI=true is not
          # decoration: the container does not inherit the runner's environment, and
          # without it Nx starts its file watching daemon inside a container that is
          # about to be thrown away.
          #
          # --json everywhere. `nx show projects` prints a JSON array when stdout is
          # not a TTY and one name per line when it is, and parsing the pretty form
          # silently finds nothing. Reading JSON and splitting it with jq is what
          # retires that whole class of bug.
          list() {
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD":/w -w /w \
              -e CI=true -e HOME=/tmp -e npm_config_cache=/w/.npm \
              "$BUILD_IMAGE" \
              npx nx show projects $scope "$@" --json \
              | jq -r 'join(",")'
          }

          docker_apps=$(list --type app --projects tag:type:static-docker)
          testable=$(list --with-target test)
          apps_tobuild=$(list --type app --with-target build:docker)
          e2e=$(list --with-target e2e)

          # odontogram-e2e is excluded (pre-existing tsconfig/spec breakage; see
          # k8s/README.md).
          e2e=$(echo "$e2e" | tr ',' '\n' | sed '/^$/d' | grep -vE '^odontogram-e2e$' | paste -sd, - || true)

          # The deployment name is the lowercased project name. The `-staging` suffix
          # went away with the env dimension (k8s plan 0002): staging is a different
          # cluster, not a differently named half of the same release.
          deployments=$(echo "$apps_tobuild" | tr ',' '\n' | sed '/^$/d' | tr '[:upper:]' '[:lower:]' | paste -sd' ' -)

          luna=$(echo "$apps_tobuild" | tr ',' '\n' | sed '/^$/d' | grep -E '^luna-shopper-backend-' | paste -sd, - || true)

          {
            echo "docker_apps=$docker_apps"
            echo "testable=$testable"
            echo "apps_tobuild=$apps_tobuild"
            echo "deployments=$deployments"
            echo "e2e=$e2e"
            echo "luna=$luna"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Affected"
            echo
            echo "- apps to build: \`${apps_tobuild:-(none)}\`"
            echo "- testable: \`${testable:-(none)}\`"
            echo "- e2e: \`${e2e:-(none)}\`"
            echo "- deployments: \`${deployments:-(none)}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Unit tests and lint. These also run on the pull request (pr.yml), but they run
  # again here on the actual merged commit, which is what makes the merge to main
  # the thorough gate independently of what the PR tested.
  #
  # It hangs off `setup` alone, never off the build: nothing about a unit test needs
  # an image. It used to run inside the builder image and therefore had to wait for
  # that image to be built, exported and pushed first.
  # ---------------------------------------------------------------------------
  lint-test:
    needs: setup
    if: needs.setup.outputs.testable != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      - name: Lint & test affected
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/w -w /w \
            -e CI=true -e HOME=/tmp -e npm_config_cache=/w/.npm \
            "$BUILD_IMAGE" \
            npx nx run-many -t lint test --projects "${{ needs.setup.outputs.testable }}"

  # ---------------------------------------------------------------------------
  # Bundles once, then images.
  #
  # The bundles are built by ONE `nx run-many` inside the pinned image, so the shared
  # libraries are compiled once for the whole workspace rather than once per image,
  # and the Nx cache spans every app. The images that follow are a base plus a COPY
  # of `dist/apps/<project>`, which is also their entire build context.
  # ---------------------------------------------------------------------------
  build:
    needs: setup
    if: needs.setup.outputs.apps_tobuild != '' || needs.setup.outputs.docker_apps != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN so `docker buildx build
      # --cache-to=type=gha` works when called directly (the docker executor shells
      # out to buildx itself rather than using build-push-action).
      - name: Expose GitHub Actions runtime for the gha cache
        uses: crazy-max/ghaction-github-runtime@v3

      # Only to run the Nx CLI, which orchestrates buildx. Nothing is compiled here:
      # the bundle step below happens inside BUILD_IMAGE, and the image step passes
      # --exclude-task-dependencies so it cannot fall back to compiling.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      - name: Set lowercase repo
        run: echo "REPO_LOWERCASE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Infrastructure images (the nginx base the frontend images are FROM). The
      # builder image is deliberately absent: since plan 0007 nothing in CI is FROM
      # it, and it is kept only for the local full stack (k8s/README.md).
      - name: Build affected static docker apps
        if: needs.setup.outputs.docker_apps != ''
        run: |
          npx nx run-many -t build --configuration production \
            --projects "${{ needs.setup.outputs.docker_apps }}"

      # One invocation, one container, one Nx cache. `prune` is a no-op for projects
      # that do not have it and writes the pruned manifest and lockfile beside the
      # bundle for the five Luna services, which is what their runtime install needs.
      - name: Build the bundles in the pinned image
        if: needs.setup.outputs.apps_tobuild != ''
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/w -w /w \
            -e CI=true -e HOME=/tmp -e npm_config_cache=/w/.npm \
            -e MFE_BASE_URL="$STAGING_MFE_BASE_URL" \
            -e MFE_REMOTE_URLS="$STAGING_MFE_REMOTE_URLS" \
            -e LUNA_GATEWAY_URL="$STAGING_LUNA_GATEWAY_URL" \
            -e LUNA_REALTIME_URL="$STAGING_LUNA_REALTIME_URL" \
            "$BUILD_IMAGE" \
            npx nx run-many -t build prune --configuration production \
              --projects "${{ needs.setup.outputs.apps_tobuild }}"

      # --exclude-task-dependencies is load bearing: without it a cold Nx cache would
      # let this step recompile a bundle here, on the runner, outside the pinned
      # image, and nothing would say so.
      - name: Build & push staging images
        if: needs.setup.outputs.apps_tobuild != ''
        env:
          DOCKER_IMAGE_TAG: staging
        run: |
          npx nx run-many -t build:docker --configuration production \
            --projects "${{ needs.setup.outputs.apps_tobuild }}" \
            --exclude-task-dependencies

  # ---------------------------------------------------------------------------
  # e2e against the exact staging images that were just pushed.
  # k8s/e2e/portfolio-frontend/compose.yml stands up the shell + remotes behind a
  # reverse proxy on the staging hostnames (mirroring the Kubernetes topology), so
  # the real staging shell, which bakes the staging MFE host, is tested unchanged.
  # A failure gates the deploy: the mutable staging tag is simply not rolled out.
  # ---------------------------------------------------------------------------
  e2e-frontend:
    needs: [setup, build]
    if: needs.setup.outputs.e2e != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The suites run on the runner rather than in BUILD_IMAGE: they need browsers
      # and their system dependencies, which the build image has no reason to carry.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      - name: Resolve browser versions
        id: browsers
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "cypress=$(node -p "require('cypress/package.json').version")" >> "$GITHUB_OUTPUT"

      # A cold browser download is a large fraction of this job's wall time, and the
      # browsers only change when the tools do, so key the caches on those.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browsers.outputs.playwright }}

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ steps.browsers.outputs.cypress }}

      - name: Install browsers
        run: |
          npx playwright install --with-deps chromium
          npx cypress install

      - name: Start the staging e2e stack
        env:
          E2E_IMAGE_TAG: staging
        run: |
          # The staging shell bakes https://mfe.staging.ichirokuxvi.com, so make the
          # staging hostnames resolve to the local reverse proxy. velista is on the
          # list because it is served from an origin of its own (velista plan 0013)
          # and the shell initialises every remote container while it boots: leave
          # this host pointing at the real internet and the shell dies on an
          # unreachable remoteEntry, taking every suite with it. It is on velista's
          # own domain now, which is why the entry does not read `*.ichirokuxvi.com`
          # like the two beside it.
          echo "127.0.0.1 staging.ichirokuxvi.com mfe.staging.ichirokuxvi.com staging.velista.app" | sudo tee -a /etc/hosts

          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          export E2E_IMAGE_PREFIX="ghcr.io/$REPO_LC"

          docker compose -f k8s/e2e/portfolio-frontend/compose.yml up -d --pull always

          # Wait for the shell to answer through the proxy.
          for i in $(seq 1 45); do
            if curl -kfsS https://staging.ichirokuxvi.com/en >/dev/null 2>&1; then
              echo "staging e2e stack is up"; break
            fi
            echo "waiting for the staging e2e stack ($i)..."; sleep 2
          done

          # ...then check the remotes, because the wait above cannot. The shell
          # serves its index.html for any path, so it answers 200 whether or not a
          # single remote is reachable, and a missing remote host is invisible until
          # every spec fails on an empty <ng-shell-root>. Assert each remoteEntry
          # the shell actually asks for, and fail here with a name instead.
          missing=''
          for entry in \
            https://mfe.staging.ichirokuxvi.com/odontogram/remoteEntry.mjs \
            https://mfe.staging.ichirokuxvi.com/damoclesSword/remoteEntry.mjs \
            https://mfe.staging.ichirokuxvi.com/landingV2/remoteEntry.mjs \
            https://staging.velista.app/remoteEntry.mjs; do
            if curl -kfsS -o /dev/null "$entry"; then
              echo "  ok  $entry"
            else
              echo "  MISSING  $entry"; missing="$missing $entry"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::the e2e stack does not serve every remote the shell loads:$missing"
            exit 1
          fi

      - name: Run affected e2e against the staging stack
        env:
          E2E_BASE_URL: https://staging.ichirokuxvi.com
        run: |
          rc=0
          IFS=',' read -ra PROJECTS <<< "${{ needs.setup.outputs.e2e }}"
          for p in "${PROJECTS[@]}"; do
            # The nx project name can differ from its directory (e.g. landingV2-e2e
            # lives in apps/landing-v2-e2e), so resolve the real root.
            root=$(npx nx show project "$p" --json | jq -r .root)
            echo "::group::e2e $p ($root)"
            if [ -f "$root/playwright.config.ts" ]; then
              npx playwright test -c "$root/playwright.config.ts" --project=chromium || rc=1
            else
              npx cypress run --project "$root" --browser electron || rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Tear down the staging e2e stack
        if: always()
        run: docker compose -f k8s/e2e/portfolio-frontend/compose.yml down -v || true

  # ---------------------------------------------------------------------------
  # Tier 2 of plan 0015: the Luna Shopper backend e2e suite against the five images
  # that were just built and pushed, not against `node dist/...`.
  #
  # pr.yml's verify-infra already proved the application logic on this commit; what
  # it could not prove is the image: entrypoint, non root user, the runtime
  # dependency install, baked config, and SIGTERM reaching PID 1.
  #
  # It gates the deploy, so a broken image never reaches staging. It now runs beside
  # the frontend suite rather than after it.
  # ---------------------------------------------------------------------------
  e2e-luna:
    needs: [setup, build]
    if: needs.setup.outputs.luna != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A skip, an empty suite, or a stack that fails to come up fails the job, and
      # therefore blocks the deploy.
      LUNA_REQUIRE_STACK: '1'
      COMPOSE_PROJECT_NAME: luna-tier2-${{ github.run_id }}
      LUNA_IMAGE_TAG: staging
      E2E_SEED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore the workspace
        uses: ./.github/actions/workspace
        with:
          build-image: ${{ env.BUILD_IMAGE }}

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure the Luna Shopper service environment
        run: |
          # Writes the service .env files (which the migration CLI reads) and a
          # throwaway JWT keypair the images mount. One definition of what a service
          # needs to boot, shared with local development.
          bash k8s/e2e/luna-shopper-backend/luna-slot.sh 0
          rm -f k8s/e2e/luna-shopper-backend/.env.slot

      - name: Luna Shopper e2e against the built images
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          export LUNA_IMAGE_PREFIX="ghcr.io/$REPO_LC"

          # Pull all five at the staging tag: only the affected ones were rebuilt in
          # this run, and the rest are the staging images currently deployed, which
          # is exactly the combination about to be rolled out.
          docker compose -f k8s/e2e/luna-shopper-backend/compose.yml \
            -f k8s/e2e/luna-shopper-backend/compose.apps.yml pull
          bash k8s/e2e/luna-shopper-backend/stack.sh e2e-images

      - name: Upload Luna Shopper tier 2 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luna-shopper-tier2-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-output/luna-shopper-backend/
            dist/.playwright/apps/luna-shopper-backend-e2e/

      - name: Tear down the Luna Shopper tier 2 stack
        if: always()
        run: |
          docker compose -f k8s/e2e/luna-shopper-backend/compose.yml \
            -f k8s/e2e/luna-shopper-backend/compose.apps.yml down -v --remove-orphans || true

  # ---------------------------------------------------------------------------
  # The deploy, on its own, so it can be retried on its own.
  #
  # The `if` is not decoration. A job whose `needs` contains a SKIPPED job is skipped
  # by default, and e2e-frontend / e2e-luna skip whenever nothing relevant is
  # affected, so a plain needs list would silently refuse to deploy on exactly the
  # commits that are cheapest to deploy. Testing each result against 'failure' rather
  # than for 'success' is what lets `skipped` through, and `!cancelled()` rather than
  # `always()` is what stops a cancelled run from deploying anyway.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [setup, lint-test, build, e2e-frontend, e2e-luna]
    if: >-
      !cancelled()
      && needs.setup.result == 'success'
      && needs.lint-test.result != 'failure'
      && needs.build.result != 'failure'
      && needs.e2e-frontend.result != 'failure'
      && needs.e2e-luna.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      # Only the chart is needed here, and only at this commit.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Is there a staging host to deploy to?
      #
      # Everything upstream stands on its own: the staging images are in the registry
      # and the suites have run. Only the SSH steps need a machine, and staging is
      # the environment most likely not to have one, since it is disposable by design
      # and gets stood down whenever it is not earning its keep.
      #
      # Without this gate, no staging host turns every push to main red at the first
      # ssh call, hiding whether the build and the tests actually passed. With it,
      # the run stays green and says plainly that it did not deploy.
      #
      # Secrets are read through `env` rather than interpolated into the script,
      # which keeps a secret's contents out of the shell command line.
      - name: Is a staging host configured
        id: deploy-target
        env:
          DEPLOY_HOST: ${{ secrets.SSH_DEPLOY_HOST_STAGING }}
          DEPLOY_USER: ${{ secrets.SSH_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing SSH_DEPLOY_HOST_STAGING"
          [ -n "$DEPLOY_USER" ] || missing="$missing SSH_DEPLOY_USER"
          [ -n "$DEPLOY_KEY" ]  || missing="$missing SSH_DEPLOY_KEY"

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Staging host is configured; the deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging deploy skipped::Affected images were built, tested and pushed under the staging tag, but no deploy ran because these repository secrets are unset:$missing. Staging is currently stood down; set them to bring it back."
            {
              echo "### Staging deploy skipped"
              echo
              echo "Affected images were built, tested and pushed under the \`staging\` tag."
              echo "No host was deployed to because these secrets are unset:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "Staging is disposable by design (k8s plan 0002), so this is expected"
              echo "while no staging machine exists. Set the secrets to bring it back."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up SSH for deployment
        if: steps.deploy-target.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # ---------------------------------------------------------------------------
      # Everything below targets SSH_DEPLOY_HOST_STAGING, a different machine from
      # production's SSH_DEPLOY_HOST (k8s plan 0002, section 3). Two clusters, two
      # releases, one chart.
      #
      # The chart lands in the deploy user's home rather than /root. SSH_DEPLOY_USER
      # is an unprivileged account: it owns nothing outside its home and holds no
      # sudo. Nothing below needs any, because k3s writes its kubeconfig world
      # readable (k8s/bootstrap/install.sh) and helm and kubectl are all a deploy
      # runs.
      # ---------------------------------------------------------------------------
      - name: Sync chart to the staging host
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          rsync -avz --delete -e "ssh $SSH_OPTS" \
            ./k8s/ ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }}:~/k8s/

      # A deploy that cannot possibly work is rejected in seconds here rather than
      # diagnosed in minutes from a crashloop (k8s plan 0006, section 3).
      - name: Preflight the staging Secrets
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }} \
            "bash ~/k8s/bootstrap/provision-release.sh --check --env staging"

      - name: Deploy staging via Helm
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }} \
            "bash -s -- '${{ needs.setup.outputs.deployments }}'" << 'EOF'
            set -e
            AFFECTED="$1"

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "Applying chart (staging)..."

            # --atomic implies --wait and rolls back on failure, which is exactly
            # right for the environment whose purpose is to absorb failures: a
            # broken staging deploy leaves staging on the last good revision
            # instead of half migrated. Without --wait, `helm upgrade` returns as
            # soon as the API server accepts the manifests, so the job went green
            # while pods crashlooped or a rollout hung forever.
            #
            # It also covers the migration Jobs for free: they are pre-upgrade
            # hooks, so a migration that fails through its backoffLimit fails the
            # upgrade before any new pod takes traffic.
            #
            # 10m is chosen against the slowest real path: three migration Jobs,
            # then the Deployments rolling with a readiness probe whose
            # initialDelaySeconds is 5 and periodSeconds 10, on a single node
            # pulling images.
            helm upgrade --install nx-portfolio $HOME/k8s/helm \
              --namespace nx-portfolio \
              --create-namespace \
              --values $HOME/k8s/helm/values.yaml \
              --values $HOME/k8s/helm/values.staging.yaml \
              --atomic --timeout 10m

            # An affected app whose image CI built is not necessarily deployed in
            # this cluster. The harvester (plan 0038) is the first of those: the
            # chart describes it, `harvester.enabled` is false in both clusters,
            # and CI still builds its image because it is an affected project.
            # Restarting a Deployment that was never rendered fails the step and
            # takes an otherwise good deploy down with it.
            #
            # So the list is narrowed to what actually exists, and what was
            # dropped is PRINTED rather than silently skipped: a deployment
            # missing because it is switched off and one missing because the chart
            # is broken look identical here, and only the log can tell them apart.
            DEPLOYED=""
            for dep in $AFFECTED; do
              if kubectl get "deployment/$dep" -n nx-portfolio >/dev/null 2>&1; then
                DEPLOYED="$DEPLOYED $dep"
              else
                echo "Skipping deployment/$dep: not present in this cluster (is it disabled in values?)"
              fi
            done

            # The staging tag is mutable, so a plain upgrade will not restart the
            # pods; roll the affected ones so they re-pull the new image.
            #
            # Two loops, not one: all restarts are requested before any is
            # awaited, so the rollouts overlap instead of serialising.
            for dep in $DEPLOYED; do
              echo "Restarting deployment/$dep ..."
              kubectl rollout restart "deployment/$dep" -n nx-portfolio
            done

            # And then actually observe them. `rollout restart` is asynchronous by
            # design: it patches the pod template annotation and returns, so the
            # loop above asks for restarts and sees none of them. This is the half
            # --wait cannot cover, because the restarts happen after Helm has
            # finished. `rollout status` exits non zero on timeout, which fails
            # the step, which is the entire point.
            for dep in $DEPLOYED; do
              kubectl rollout status "deployment/$dep" -n nx-portfolio --timeout=5m
            done

            echo "Staging deployment complete."
          EOF

      # A failed deploy otherwise leaves a Helm error and nothing else. Events are
      # the part that matters and the part people forget: ImagePullBackOff against
      # a private GHCR package, a PVC that cannot bind, and a failing readiness
      # probe all announce themselves there and nowhere else.
      - name: Diagnose the failed deploy
        if: failure() && steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh $SSH_OPTS \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }} \
            "bash -s" << 'EOF'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl -n nx-portfolio get pods -o wide || true
            kubectl -n nx-portfolio get events --sort-by=.lastTimestamp | tail -40 || true
            for p in $(kubectl -n nx-portfolio get pods \
                  --field-selector=status.phase!=Running -o name 2>/dev/null); do
              echo "::group::$p"
              kubectl -n nx-portfolio describe "$p" | tail -30 || true
              kubectl -n nx-portfolio logs "$p" --tail=50 --all-containers || true
              echo "::endgroup::"
            done
          EOF
