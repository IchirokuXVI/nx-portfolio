name: Staging deploy (main)

# Every push to main builds the affected micro-frontends, pushes them under the
# mutable `staging` image tag, and rolls the changed staging deployments so they
# re-pull. Production is untouched here; it is deployed only by release.yml.

on:
  push:
    branches:
      - main
  # Manual trigger. Use it to build and deploy every staging app at once, e.g.
  # to bootstrap images that `affected` never rebuilt. Leave build_all on (the
  # default) for that; turn it off to run the normal affected path manually.
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build & deploy all staging apps (ignore affected)'
        type: boolean
        default: true

# Serialize staging deploys: only one runs at a time. A run triggered while another
# is in progress waits for it to finish instead of racing the build/push and the
# helm upgrade. cancel-in-progress is false so an in-flight deploy is never killed
# mid-way.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  staging-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_REGISTRY: ghcr.io/ichirokuxvi
      DOCKER_SKIP_LOGIN: true
      # Use the GitHub Actions cache backend (type=gha) for every docker build,
      # instead of the local-dir cache + actions/cache tarball round-trip. Needs the
      # docker-container buildx driver (set up below) and the Actions runtime env
      # (exposed below).
      DOCKER_BUILD_CACHE: gha
      # Export only the final image layers to the cache. The app images' builder
      # stage (the `nx build`) re-runs every commit regardless, so caching it buys
      # little; `min` writes less. Flip back to `max` to compare.
      DOCKER_BUILD_CACHE_MODE: min
      # Where the shell loads its remotes from on staging. Baked into the shell
      # bundle at build time (ignored by the other, environment-agnostic apps).
      STAGING_MFE_BASE_URL: https://mfe.staging.ichirokuxvi.com
      # ...and the remotes that are not on that host. velista is served from its own
      # origin (plan 0013), which no base URL can produce, so it names itself here and
      # overrides the base derived tuple. Per remote overrides win over the base, so
      # the other three are unaffected and stay unlisted.
      STAGING_MFE_REMOTE_URLS: velista=https://velista.staging.ichirokuxvi.com
      # Which backend the staging velista image talks to (velista plan 0014).
      # velista is the only app that reads these; every other one ignores them,
      # exactly as MFE_BASE_URL is ignored by every app except the shell.
      STAGING_LUNA_GATEWAY_URL: https://api.staging.ichirokuxvi.com
      STAGING_LUNA_REALTIME_URL: https://rt.staging.ichirokuxvi.com

    steps:
      # Checkout full history so Nx can detect changes
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN so `docker buildx build
      # --cache-to=type=gha` works when called directly (the docker executor shells
      # out to buildx itself rather than using build-push-action).
      - name: Expose GitHub Actions runtime for the gha cache
        uses: crazy-max/ghaction-github-runtime@v3

      # Setup Node.js & Nx
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Read the Nx version dynamically from package.json
      - name: Get Nx version
        id: nx-version
        run: echo "NX_VERSION=$(npm pkg get devDependencies.nx | tr -d '\"')" >> $GITHUB_ENV

      # Cache Nx installation
      - name: Cache Nx
        id: cache-nx
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: nx-${{ runner.os }}-${{ env.NX_VERSION }}

      - name: Install Nx
        run: npm install nx@$NX_VERSION

      - name: Set lowercase repo
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWERCASE=$REPO_LC" >> $GITHUB_ENV

      # The builder image gets its own gha cache scope keyed by the lockfile hash,
      # so its expensive `npm ci` layer is reused across runs until dependencies
      # actually change, and it is isolated from the (larger, churnier) app-image
      # caches. Other images use the default per-image scope.
      - name: Build main docker builder
        env:
          DOCKER_BUILD_CACHE_SCOPE: builder-${{ hashFiles('**/package-lock.json') }}
        run: npx nx build docker/builder --configuration=production

      - name: Get last successful commit on current branch
        id: last_success
        run: |
          branch="${GITHUB_REF_NAME}"
          workflow_id="${GITHUB_WORKFLOW}"

          # Find the most recent successful run (excluding the current one)
          last_run=$(gh run list \
            --branch "$branch" \
            --workflow "$workflow_id" \
            --json headSha,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].headSha')

          echo "sha=$last_run" >> $GITHUB_OUTPUT

      - name: Print last successful commit
        run: |
          echo "Last successful commit SHA: ${{ steps.last_success.outputs.sha }}"

      - name: Get affected apps
        id: get-affected-apps
        run: |
          base_sha="${{ steps.last_success.outputs.sha }}"

          docker_apps=$(npx nx show projects --type "app" --projects tag:type:static-docker | paste -sd, -)
          echo "docker_apps=$docker_apps" >> "$GITHUB_OUTPUT"

          testable_apps=$(npx nx show projects --with-target test | paste -sd, -)
          echo "testable_apps=$testable_apps" >> "$GITHUB_OUTPUT"

          apps_tobuild=$(npx nx show projects --type "app" --with-target build:docker | paste -sd, -)
          echo "apps_tobuild=$apps_tobuild" >> "$GITHUB_OUTPUT"

          # Build everything when there is no previous successful commit to diff
          # against (first run), or when manually dispatched with build_all. This
          # is how missing staging images get bootstrapped.
          if [ -z "$base_sha" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; }; then
            echo "Building all apps (first run or manual build_all)."
            affected_docker_apps="$docker_apps"
            affected_testable_apps="$testable_apps"
            affected_apps_tobuild="$apps_tobuild"
          else
            affected_docker_apps=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$docker_apps" | paste -sd, -)
            affected_testable_apps=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$testable_apps" | paste -sd, -)
            affected_apps_tobuild=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$apps_tobuild" | paste -sd, -)
          fi

          echo "affected_docker_apps=$affected_docker_apps" >> "$GITHUB_OUTPUT"
          echo "affected_testable_apps=$affected_testable_apps" >> "$GITHUB_OUTPUT"
          echo "affected_apps_tobuild=$affected_apps_tobuild" >> "$GITHUB_OUTPUT"

          # The deployment name is now just the lowercased project name. The
          # `-staging` suffix went away with the env dimension (k8s plan 0002):
          # staging is a different cluster, not a differently named half of the
          # same release, so deriving a name by string surgery is over.
          affected_deployments=$(echo "$affected_apps_tobuild" | tr ',' '\n' | sed '/^$/d' | tr '[:upper:]' '[:lower:]' | paste -sd' ' -)
          echo "affected_deployments=$affected_deployments" >> "$GITHUB_OUTPUT"

          echo "Affected apps to build: $affected_apps_tobuild"
          echo "Affected deployments: $affected_deployments"

      # Build affected static docker apps (builder base, local http server)
      - name: Build affected docker apps
        if: ${{ steps.get-affected-apps.outputs.affected_docker_apps != '' }}
        run: |
          npx nx run-many -t build --configuration production --projects name:${{ steps.get-affected-apps.outputs.affected_docker_apps }}

      # Unit tests also run on the PR (pr.yml) for fast feedback, but they run again
      # here on the actual merged commit — together with the e2e below, this makes
      # the merge to main the thorough gate, independent of what the PR tested.
      - name: Test affected apps
        if: ${{ steps.get-affected-apps.outputs.affected_testable_apps != '' }}
        run: |
          docker run \
            --rm "ghcr.io/${{ env.REPO_LOWERCASE }}/builder:latest" \
            npx nx run-many -t test --projects ${{ steps.get-affected-apps.outputs.affected_testable_apps }}

      # Build & push affected micro-frontends under the mutable `staging` tag.
      # The shell reads MFE_BASE_URL and MFE_REMOTE_URLS; the other apps ignore both.
      - name: Build & push staging images
        if: ${{ steps.get-affected-apps.outputs.affected_apps_tobuild != '' }}
        env:
          DOCKER_IMAGE_TAG: staging
          MFE_BASE_URL: ${{ env.STAGING_MFE_BASE_URL }}
          MFE_REMOTE_URLS: ${{ env.STAGING_MFE_REMOTE_URLS }}
          LUNA_GATEWAY_URL: ${{ env.STAGING_LUNA_GATEWAY_URL }}
          LUNA_REALTIME_URL: ${{ env.STAGING_LUNA_REALTIME_URL }}
        run: |
          npx nx run-many -t build:docker --configuration production --projects ${{ steps.get-affected-apps.outputs.affected_apps_tobuild }}

      # ---------------------------------------------------------------------------
      # e2e against the exact staging images that were just pushed. k8s/e2e/portfolio-frontend/compose.yml
      # stands up the shell + remotes behind a reverse proxy on the staging hostnames
      # (mirroring the Kubernetes topology), so the real staging shell — which bakes
      # the staging MFE host — is tested unchanged. Runs after the push and before the
      # deploy: a failure gates the deploy (the mutable staging tag is simply not
      # rolled out).
      # ---------------------------------------------------------------------------
      - name: Get affected e2e projects
        id: get-affected-e2e
        run: |
          base_sha="${{ steps.last_success.outputs.sha }}"

          all_e2e=$(npx nx show projects --with-target e2e | paste -sd, -)

          if [ -z "$base_sha" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; }; then
            affected_e2e="$all_e2e"
          else
            affected_e2e=$(npx nx show projects --affected --base "$base_sha" --head="${{ github.sha }}" --projects "$all_e2e" | paste -sd, -)
          fi

          # odontogram-e2e is excluded (pre-existing tsconfig/spec breakage; see
          # k8s/README.md).
          affected_e2e=$(echo "$affected_e2e" | tr ',' '\n' | sed '/^$/d' | grep -vE '^(odontogram-e2e)$' | paste -sd, -)

          echo "projects=$affected_e2e" >> "$GITHUB_OUTPUT"
          echo "Affected e2e projects: $affected_e2e"

      - name: Start the staging e2e stack
        if: ${{ steps.get-affected-e2e.outputs.projects != '' }}
        env:
          E2E_IMAGE_PREFIX: ghcr.io/${{ env.REPO_LOWERCASE }}
          E2E_IMAGE_TAG: staging
        run: |
          # The staging shell bakes https://mfe.staging.ichirokuxvi.com, so make the
          # staging hostnames resolve to the local reverse proxy.
          echo "127.0.0.1 staging.ichirokuxvi.com mfe.staging.ichirokuxvi.com" | sudo tee -a /etc/hosts

          docker compose -f k8s/e2e/portfolio-frontend/compose.yml up -d --pull always

          # Wait for the shell to answer through the proxy.
          for i in $(seq 1 45); do
            if curl -kfsS https://staging.ichirokuxvi.com/en >/dev/null 2>&1; then
              echo "staging e2e stack is up"; break
            fi
            echo "waiting for the staging e2e stack ($i)..."; sleep 2
          done

      - name: Run affected e2e against the staging stack
        if: ${{ steps.get-affected-e2e.outputs.projects != '' }}
        env:
          E2E_BASE_URL: https://staging.ichirokuxvi.com
        run: |
          npx playwright install --with-deps chromium
          npx cypress install

          rc=0
          IFS=',' read -ra PROJECTS <<< "${{ steps.get-affected-e2e.outputs.projects }}"
          for p in "${PROJECTS[@]}"; do
            # The nx project name can differ from its directory (e.g. landingV2-e2e
            # lives in apps/landing-v2-e2e), so resolve the real root.
            root=$(npx nx show project "$p" --json | jq -r .root)
            echo "::group::e2e $p ($root)"
            if [ -f "$root/playwright.config.ts" ]; then
              npx playwright test -c "$root/playwright.config.ts" --project=chromium || rc=1
            else
              npx cypress run --project "$root" --browser electron || rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Tear down the staging e2e stack
        if: ${{ always() && steps.get-affected-e2e.outputs.projects != '' }}
        run: docker compose -f k8s/e2e/portfolio-frontend/compose.yml down -v || true

      # ---------------------------------------------------------------------------
      # Tier 2 of plan 0015: the Luna Shopper backend e2e suite against the five
      # images that were just built and pushed, not against `node dist/...`.
      #
      # The pull request gate (pr.yml's verify-infra) already proved the
      # application logic on this commit; what it could not prove is the image —
      # entrypoint, non root user, the runtime dependency install, baked config,
      # and SIGTERM reaching PID 1. Those images exist by this point in the job, so
      # this costs the stack boot and the suite, not a rebuild.
      #
      # It runs BEFORE the helm upgrade, so a red suite stops the deploy and a
      # broken image never reaches staging. That is what makes the staging deploy
      # gated rather than optimistic.
      # ---------------------------------------------------------------------------
      - name: Are any Luna Shopper backend images affected
        id: luna-affected
        run: |
          # `nx show projects` prints a JSON array when stdout is not a TTY and one
          # name per line when it is, so the upstream output can arrive either as
          # `a,b` or as `["a","b"]`. Strip the JSON punctuation before splitting so
          # this reads the same list either way.
          luna=$(echo "${{ steps.get-affected-apps.outputs.affected_apps_tobuild }}" \
            | tr -d '[]" ' | tr ',' '\n' | sed '/^$/d' \
            | grep -E '^luna-shopper-backend-' | paste -sd, - || true)
          echo "projects=$luna" >> "$GITHUB_OUTPUT"
          echo "Affected Luna Shopper backend images: ${luna:-(none)}"

      - name: Configure the Luna Shopper service environment
        if: ${{ steps.luna-affected.outputs.projects != '' }}
        run: |
          # Writes the service .env files (which the migration CLI reads) and a
          # throwaway JWT keypair the images mount. One definition of what a
          # service needs to boot, shared with local development.
          bash k8s/e2e/luna-shopper-backend/luna-slot.sh 0
          rm -f k8s/e2e/luna-shopper-backend/.env.slot

      - name: Luna Shopper e2e against the built images
        if: ${{ steps.luna-affected.outputs.projects != '' }}
        env:
          # A skip, an empty suite, or a stack that fails to come up fails the job
          # — and therefore blocks the deploy.
          LUNA_REQUIRE_STACK: '1'
          COMPOSE_PROJECT_NAME: luna-tier2-${{ github.run_id }}
          LUNA_IMAGE_PREFIX: ghcr.io/${{ env.REPO_LOWERCASE }}
          LUNA_IMAGE_TAG: staging
          E2E_SEED: '1'
        run: |
          npx playwright install --with-deps chromium
          # Pull all five at the staging tag: only the affected ones were rebuilt
          # in this run, and the rest are the staging images currently deployed,
          # which is exactly the combination about to be rolled out.
          docker compose -f k8s/e2e/luna-shopper-backend/compose.yml \
            -f k8s/e2e/luna-shopper-backend/compose.apps.yml pull
          bash k8s/e2e/luna-shopper-backend/stack.sh e2e-images

      - name: Upload Luna Shopper tier 2 diagnostics
        if: ${{ failure() && steps.luna-affected.outputs.projects != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: luna-shopper-tier2-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-output/luna-shopper-backend/
            dist/.playwright/apps/luna-shopper-backend-e2e/

      - name: Tear down the Luna Shopper tier 2 stack
        if: ${{ always() && steps.luna-affected.outputs.projects != '' }}
        env:
          COMPOSE_PROJECT_NAME: luna-tier2-${{ github.run_id }}
        run: |
          docker compose -f k8s/e2e/luna-shopper-backend/compose.yml \
            -f k8s/e2e/luna-shopper-backend/compose.apps.yml down -v --remove-orphans || true

      # Is there a staging host to deploy to?
      #
      # Everything above (build, test, e2e, push) stands on its own: the staging
      # images are in the registry and the suites have run. Only the SSH steps
      # below need a machine, and staging is the environment most likely not to
      # have one, since it is disposable by design and gets stood down whenever it
      # is not earning its keep.
      #
      # Without this gate, no staging host turns every push to main red at the
      # first ssh call, hiding whether the build and the tests actually passed.
      # With it, the run stays green and says plainly that it did not deploy.
      #
      # Secrets are read through `env` rather than interpolated into the script,
      # which keeps a secret's contents out of the shell command line.
      - name: Is a staging host configured
        id: deploy-target
        env:
          DEPLOY_HOST: ${{ secrets.SSH_DEPLOY_HOST_STAGING }}
          DEPLOY_USER: ${{ secrets.SSH_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing SSH_DEPLOY_HOST_STAGING"
          [ -n "$DEPLOY_USER" ] || missing="$missing SSH_DEPLOY_USER"
          [ -n "$DEPLOY_KEY" ]  || missing="$missing SSH_DEPLOY_KEY"

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Staging host is configured; the deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging deploy skipped::Affected images were built, tested and pushed under the staging tag, but no deploy ran because these repository secrets are unset:$missing. Staging is currently stood down; set them to bring it back."
            {
              echo "### Staging deploy skipped"
              echo
              echo "Affected images were built, tested and pushed under the \`staging\` tag."
              echo "No host was deployed to because these secrets are unset:"
              echo
              for s in $missing; do echo "- \`$s\`"; done
              echo
              echo "Staging is disposable by design (k8s plan 0002), so this is expected"
              echo "while no staging machine exists. Set the secrets to bring it back."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up SSH for deployment
        if: steps.deploy-target.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # ---------------------------------------------------------------------------
      # Everything below targets SSH_DEPLOY_HOST_STAGING, a different machine from
      # production's SSH_DEPLOY_HOST (k8s plan 0002, section 3). Two clusters, two
      # releases, one chart. Adding a secret rather than renaming both keeps the
      # production workflow untouched, which matters because production is the one
      # that is currently working.
      #
      # The chart lands in the deploy user's home rather than /root. SSH_DEPLOY_USER
      # is an unprivileged account: it owns nothing outside its home and holds no
      # sudo. Nothing below needs any, because k3s writes its kubeconfig world
      # readable (k8s/bootstrap/install.sh) and helm and kubectl are all a deploy
      # runs.
      # ---------------------------------------------------------------------------
      - name: Sync chart to the staging host
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./k8s/ ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }}:~/k8s/

      # A deploy that cannot possibly work is rejected in seconds here rather than
      # diagnosed in minutes from a crashloop (k8s plan 0006, section 3).
      - name: Preflight the staging Secrets
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }} \
            "bash ~/k8s/bootstrap/provision-release.sh --check --env staging"

      - name: Deploy staging via Helm
        if: steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }} \
            "bash -s -- '${{ steps.get-affected-apps.outputs.affected_deployments }}'" << 'EOF'
            set -e
            AFFECTED="$1"

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # No prod-tag.yaml plumbing any more. It existed only because a
            # staging deploy and a production deploy shared one release, so the
            # staging upgrade had to avoid clobbering the pinned production
            # version. Two releases on two clusters cannot collide.
            echo "Applying chart (staging)..."

            # --atomic implies --wait and rolls back on failure, which is exactly
            # right for the environment whose purpose is to absorb failures: a
            # broken staging deploy leaves staging on the last good revision
            # instead of half migrated. Without --wait, `helm upgrade` returns as
            # soon as the API server accepts the manifests, so the job went green
            # while pods crashlooped or a rollout hung forever.
            #
            # It also covers the migration Jobs for free: they are pre-upgrade
            # hooks, so a migration that fails through its backoffLimit fails the
            # upgrade before any new pod takes traffic.
            #
            # 10m is chosen against the slowest real path: three migration Jobs,
            # then the Deployments rolling with a readiness probe whose
            # initialDelaySeconds is 5 and periodSeconds 10, on a single node
            # pulling images.
            helm upgrade --install nx-portfolio $HOME/k8s/helm \
              --namespace nx-portfolio \
              --create-namespace \
              --values $HOME/k8s/helm/values.yaml \
              --values $HOME/k8s/helm/values.staging.yaml \
              --atomic --timeout 10m

            # The staging tag is mutable, so a plain upgrade will not restart the
            # pods; roll the affected ones so they re-pull the new image.
            #
            # Two loops, not one: all restarts are requested before any is
            # awaited, so the rollouts overlap instead of serialising.
            for dep in $AFFECTED; do
              echo "Restarting deployment/$dep ..."
              kubectl rollout restart "deployment/$dep" -n nx-portfolio
            done

            # And then actually observe them. `rollout restart` is asynchronous by
            # design: it patches the pod template annotation and returns, so the
            # loop above asks for restarts and sees none of them. This is the half
            # --wait cannot cover, because the restarts happen after Helm has
            # finished. `rollout status` exits non zero on timeout, which fails
            # the step, which is the entire point.
            #
            # The `|| true` that used to be here is gone: a restart that cannot be
            # requested is a real failure, and now that deployment names are just
            # the lowercased project names, a mismatch is a bug rather than a
            # naming quirk to tolerate.
            for dep in $AFFECTED; do
              kubectl rollout status "deployment/$dep" -n nx-portfolio --timeout=5m
            done

            echo "Staging deployment complete."
          EOF

      # A failed deploy otherwise leaves a Helm error and nothing else. Events are
      # the part that matters and the part people forget: ImagePullBackOff against
      # a private GHCR package, a PVC that cannot bind, and a failing readiness
      # probe all announce themselves there and nowhere else.
      - name: Diagnose the failed deploy
        if: failure() && steps.deploy-target.outputs.configured == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_DEPLOY_USER }}@${{ secrets.SSH_DEPLOY_HOST_STAGING }} \
            "bash -s" << 'EOF'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl -n nx-portfolio get pods -o wide || true
            kubectl -n nx-portfolio get events --sort-by=.lastTimestamp | tail -40 || true
            for p in $(kubectl -n nx-portfolio get pods \
                  --field-selector=status.phase!=Running -o name 2>/dev/null); do
              echo "::group::$p"
              kubectl -n nx-portfolio describe "$p" | tail -30 || true
              kubectl -n nx-portfolio logs "$p" --tail=50 --all-containers || true
              echo "::endgroup::"
            done
          EOF
