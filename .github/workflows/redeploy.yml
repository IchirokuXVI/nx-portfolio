name: Redeploy a unit

# Deploys an already built version of one unit again, which is the rollback
# (k8s plan 0017 D7). Nothing is built.
#
#   gh workflow run redeploy.yml --ref main -f unit=velista -f environment=production -f version=0.15.0
#
# It runs from the default branch, because a dispatch needs the workflow file
# at the ref it runs on. On production it checks out the tag of the unit's
# newest published Release (or of chart_ref), not main and not the tag of the
# version: that tag holds the chart that production runs now and the
# deploy-unit action, and main may hold chart changes no release has shipped.
# A tag with no published Release is skipped, so a tag pushed by hand never
# supplies the chart. A version older than the unit's first release under k8s
# plan 0016 is refused, because its images were never deployed by a unit chart.
# On staging it checks out main and deploys the `staging` tag again.
#
# The production job uses <unit>-production-redeploy: <unit>-production allows
# the unit's release tags only, and this run is on main. A production redeploy
# never runs the cutover of k8s plan 0016 D5; a release does.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: The deploy unit.
        type: choice
        options: [portfolio, velista]
        required: true
      environment:
        description: Where to deploy.
        type: choice
        options: [production, staging]
        required: true
      version:
        description: Production only. The version to put back, such as 0.15.0. Ignored on staging.
        type: string
        default: ''
      chart_ref:
        description: Production only. The release whose chart deploys, such as 0.15.1. Default the newest published release of the unit.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      deployments: ${{ steps.resolve.outputs.deployments }}
    env:
      UNIT: ${{ inputs.unit }}
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      CHART_REF: ${{ inputs.chart_ref }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Runs from the default branch
        env:
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT" ]; then
            line="Dispatch redeploy.yml on \`$DEFAULT\`, not \`$REF\`: gh workflow run redeploy.yml --ref $DEFAULT ..."
            echo "::error::$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The whole history and every tag, to find the unit's releases.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolve the tag and the version
        id: resolve
        run: |
          refuse() {
            echo "::error title=Redeploy refused::$1"
            {
              echo "### Redeploy of $UNIT to $ENVIRONMENT refused before any SSH"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          . <(tr -d '\r' < "k8s/units/$UNIT/unit.env")

          if [ "$ENVIRONMENT" = staging ]; then
            ref="$(git rev-parse HEAD)"
            version=''
            image_tag=staging
          else
            number() {
              n="${1#"$TAG_PREFIX"}"
              n="${n#v}"
              [[ "$n" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]*)?$ ]] \
                || refuse "\`$1\` is not a version. Pass the number, such as 0.15.0."
            }
            number "$VERSION"
            version="$n"

            # A tag counts only when its Release is published: a draft or a tag
            # pushed by hand was never deployed by release-<unit>.yml.
            listed="$(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft | not) | .tag_name')" \
              || refuse "The Releases of $REPO could not be listed."
            declare -A published=()
            while read -r t; do
              [ -z "$t" ] || published["$t"]=1
            done <<< "$(printf '%s' "$listed" | tr -d '\r')"
            releases=()
            while read -r t; do
              [ -z "${published[$t]:-}" ] || releases+=("$t")
            done < <(git -c versionsort.suffix=- tag -l "$TAG_PREFIX*" --sort=v:refname)
            [ "${#releases[@]}" -gt 0 ] || refuse "No tag \`$TAG_PREFIX*\` has a published Release, so $UNIT has no release to deploy again."

            # The oldest release cut after plan 0016 landed is the oldest one
            # that carries the deploy-unit action.
            floor=-1 target=-1 chart=$(( ${#releases[@]} - 1 ))
            if [ -n "$CHART_REF" ]; then
              number "$CHART_REF"
              chart_tag="$TAG_PREFIX$n"
              chart=-1
            fi
            for i in "${!releases[@]}"; do
              if [ "$floor" -lt 0 ] && git cat-file -e "${releases[$i]}:.github/actions/deploy-unit/action.yml" 2> /dev/null; then
                floor=$i
              fi
              [ "${releases[$i]}" != "$TAG_PREFIX$version" ] || target=$i
              [ -z "$CHART_REF" ] || [ "${releases[$i]}" != "$chart_tag" ] || chart=$i
            done
            back="Below that line the way back is \`helm rollback $RELEASE_NAME 1 -n $NAMESPACE\` on the host, which restores the cutover install (k8s plan 0017 D7)."
            [ "$floor" -ge 0 ] \
              || refuse "No release of $UNIT was cut after k8s plan 0016, so this workflow deploys no version of it yet. $back"
            [ "$target" -ge 0 ] \
              || refuse "\`$TAG_PREFIX$version\` has no published Release. Only a published release can be deployed again."
            [ "$target" -ge "$floor" ] \
              || refuse "\`$TAG_PREFIX$version\` is older than \`${releases[$floor]}\`, the oldest version this workflow deploys. $back"
            [ "$chart" -ge 0 ] \
              || refuse "\`$chart_tag\` (chart_ref) has no published Release."
            [ "$chart" -ge "$floor" ] \
              || refuse "\`${releases[$chart]}\` (chart_ref) is older than \`${releases[$floor]}\` and holds no unit chart."

            ref="${releases[$chart]}"
            image_tag="$version"
            git checkout --quiet "$ref"
          fi

          projects="$(node tools/deploy/units.mjs projects "$UNIT")"
          deployments="$(echo "$projects" | tr '[:upper:]' '[:lower:]' | paste -sd' ' -)"
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "deployments=$deployments"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Redeploy of $UNIT to $ENVIRONMENT"
            echo
            if [ "$ENVIRONMENT" = staging ]; then
              echo "- chart and scripts from \`main\` at \`$ref\`"
            elif [ -n "$CHART_REF" ]; then
              echo "- chart and scripts from \`$ref\`, the release named by chart_ref"
            else
              echo "- chart and scripts from \`$ref\`, the newest published release of $UNIT"
            fi
            echo "- images tagged \`$image_tag\`"
            if [ "$ENVIRONMENT" = production ]; then
              echo
              echo "A published release can still have failed to deploy. If the release of \`$ref\` failed and its chart is suspect, pass an older release as \`chart_ref\`, or run \`helm history $RELEASE_NAME -n $NAMESPACE\` and \`helm rollback $RELEASE_NAME <previous revision> -n $NAMESPACE\` on the host."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The chart of the newest release names every image the unit has now. An
      # older version that lacks one would leave a Deployment that cannot pull.
      - name: Every image of the unit exists at that tag
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          DEPLOYMENTS: ${{ steps.resolve.outputs.deployments }}
        run: |
          missing=""
          for ref in $(node tools/deploy/units.mjs images); do
            case " $DEPLOYMENTS " in *" ${ref##*/} "*) ;; *) continue ;; esac
            docker manifest inspect "$ref:$IMAGE_TAG" > /dev/null 2>&1 || missing="$missing $ref:$IMAGE_TAG"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Redeploy refused::these images do not exist:$missing"
            {
              echo "### Redeploy of $UNIT to $ENVIRONMENT refused before any SSH"
              echo
              echo "The chart deploys images that the registry does not hold:"
              echo
              for m in $missing; do echo "- \`$m\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The same concurrency group as the pipelines of the unit, so a redeploy
  # waits for a running release or staging deploy and never overlaps it.
  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    # The pipelines' bound: a staging redeploy runs the cutover of k8s plan
    # 0016 D5 on a cluster that is not cut over yet.
    timeout-minutes: 150
    environment: ${{ inputs.environment == 'production' && format('{0}-production-redeploy', inputs.unit) || format('{0}-staging', inputs.unit) }}
    concurrency:
      group: deploy-${{ inputs.unit }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The cutover belongs to a release inside a window the owner chose, so a
      # production redeploy onto a cluster that is not cut over stops unchanged.
      - name: Deploy
        uses: ./.github/actions/deploy-unit
        with:
          unit: ${{ inputs.unit }}
          mode: ${{ inputs.environment }}
          version: ${{ needs.resolve.outputs.version }}
          deployments: ${{ inputs.environment == 'staging' && needs.resolve.outputs.deployments || '' }}
          host: ${{ secrets.SSH_DEPLOY_HOST }}
          user: ${{ secrets.SSH_DEPLOY_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          known_hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          allow_cutover: 'false'
