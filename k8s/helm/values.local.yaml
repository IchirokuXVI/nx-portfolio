# Local development override for Docker Desktop Kubernetes.
#
# Deploy with:
#   helm upgrade --install nx-portfolio k8s/helm \
#     --namespace nx-portfolio --create-namespace \
#     --values k8s/helm/values.yaml --values k8s/helm/values.local.yaml
#
# Assumes the images were built locally with `--configuration=development`, so
# they carry the `dev` tag and live unprefixed in the Docker Desktop image store
# (nx-portfolio/<app>:dev). Add these hosts to your machine's hosts file, all on
# 127.0.0.1 (Docker Desktop exposes the LoadBalancer there). Editing the hosts
# file needs administrator rights:
#   127.0.0.1 portfolio.localhost mfe.localhost
#
# The shell image must be built with MFE_BASE_URL=http://mfe.localhost so it loads
# its remotes through the reverse proxy on the local micro-frontend host.
#
# If you cannot edit the hosts file, use k8s/helm/values.localhost.yaml instead:
# it serves everything through a single `localhost` host + port forward, no admin
# and no DNS changes required.

# Use the locally built dev images without reaching for a registry.
productionImageTag: dev
appImagePullPolicy: IfNotPresent

# Docker Desktop ships a `hostpath` default StorageClass, not k3s's `local-path`.
certsVolume:
  storageClassName: hostpath

# No public DNS locally: skip Let's Encrypt (self-signed dummy certs are enough)
# and skip the MetalLB pool (Docker Desktop surfaces the proxy on localhost).
certbot:
  enabled: false
metallb:
  enabled: false

# Keep the local deploy to the single production-labelled set on local hostnames.
staging:
  enabled: false

apps:
  - name: shell
    env: production
    image: nx-portfolio/shell
    host: portfolio.localhost
    path: /
  - name: landing
    env: production
    image: nx-portfolio/landing
    host: mfe.localhost
    path: /landing
  - name: odontogram
    env: production
    image: nx-portfolio/odontogram
    host: mfe.localhost
    path: /odontogram
  - name: damoclessword
    env: production
    image: nx-portfolio/damoclessword
    host: mfe.localhost
    path: /damoclesSword
  - name: landingv2
    env: production
    image: nx-portfolio/landingv2
    host: mfe.localhost
    path: /landingV2
