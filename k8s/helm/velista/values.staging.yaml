# Staging of the velista unit (plans 0002 and 0015).
#
#   helm upgrade --install velista k8s/helm/velista --namespace luna-shopper \
#     --values k8s/helm/velista/values.yaml \
#     --values k8s/helm/velista/values.staging.yaml
#
# Compare against values.production.yaml: same keys, staging's answers. A key in
# one and not the other should be a decision, not an accident.

# velista's own domain, staging half: `staging.velista.app` is to `velista.app`
# what `staging.ichirokuxvi.com` is to `ichirokuxvi.com`. The four hosts compose
# under it: staging.velista.app, admin., api. and rt.
#
# Each is a record of its own, and a wildcard on `*.velista.app` does not reach
# `api.staging.velista.app`, because a wildcard matches one label. All four exist
# as CNAMEs onto `staging.velista.app`, which answers the staging address. They
# must resolve before this deploys, or cert-manager burns Let's Encrypt's failed
# validation budget retrying names that cannot answer.
baseDomain: staging.velista.app
environment: staging

# Staging tracks the mutable tag CI overwrites on every push to main. The deploy
# rolls the changed deployments so they re-pull it.
imageTag: staging

gateway:
  tls:
    issuer:
      acme:
        # Let's Encrypt sends expiry warnings here.
        email: danieliyo65@gmail.com

lunaShopperBackend:
  enabled: true
  config:
    logLevel: debug
    # Three origins, exactly as production, one label down: the portfolio, whose
    # `/velista` path the Gateway serves from the velista image (plan 0165),
    # velista's own host, and the back office.
    corsOrigins: https://staging.ichirokuxvi.com,https://staging.velista.app,https://admin.staging.velista.app
    authJwtKid: staging-1
    adminJwtKid: staging-admin-1
    # Staging says so, which is the whole point: an operator cannot mistake which
    # database they are about to write to. ADMIN_DEV_AUTOLOGIN is absent here for
    # the same reason it is absent from production.
    environmentName: staging
    # Support sessions (plan 0194). On in staging, where the people are the
    # owner's own test accounts. Production does not set this.
    impersonationEnabled: true
    # The web client velista-web in Google Cloud project velista-512817, owned by
    # admin@velista.app. Its secret is GOOGLE_CLIENT_SECRET in the Secret.
    googleClientId: 717012688744-diupovqba48a48vpjpbta5caipv9bn16.apps.googleusercontent.com
    # Register this URI in the Google console beside the production one. Google
    # matches redirect_uri exactly, so the two are two entries, not a pattern.
    googleCallbackUrl: https://api.staging.velista.app/v1/auth/google/callback
    appBaseUrl: https://staging.velista.app/{locale}
    # Sender on the domain that has mail set up, links on the app's domain, for
    # the reasons spelled out in values.production.yaml.
    mailFrom: Velista (staging) <no-reply@velista.app>
    smtpHost: in-v3.mailjet.com
    # **2525, not 587, because the VPS blocks the SMTP ports.** Measured from
    # inside the auth pod on both clusters: 25, 465 and 587 all time out, and
    # 2525 answers `220 in.mailjet.com ESMTP Mailjet`. That is the anti spam
    # block hosting providers apply by default, and 2525 is the alternative
    # Mailjet publishes for hosts that have it. On 587 no mail ever left either
    # cluster: the connection hung until the ingress gave up at 15 seconds, so
    # registration wrote the account and still answered 504.
    smtpPort: 2525
    smtpUser: 497721f71489adfcbc3078d2b292aad8
    # `auth/verify` and `auth/reset-password`, and with no locale segment, for
    # the reasons spelled out beside the production pair.
    mailVerifyBaseUrl: https://staging.velista.app/auth/verify
    mailResetBaseUrl: https://staging.velista.app/auth/reset-password
    # Staging is the natural place to switch tracing on first, once a collector
    # lands in the cluster. Off until then, same as production.

  # The harvester (plan 0038) IS deployed to staging, for store discovery only
  # (k8s plan 0008). This file said staging is where it would go first if it ever
  # went anywhere; this is that.
  #
  # Plan 0063 puts a STORE_DISCOVERY run in the path of an ordinary user adding a
  # postal code, and a service that does not exist in a cluster cannot run there.
  # Nothing in backend plans 0060 through 0064 is observable outside a dev slot
  # until this is on, which is why staging gets it before production rather than
  # alongside it: the point of the soak is to watch real profile edits produce
  # real runs.
  #
  # `harvestEnabled` is the second switch and it has to be true too, or the pod
  # boots, passes its probes and refuses to spawn anything. The queue fills either
  # way, so this being false would simply build a backlog.
  #
  # Every chain's `supermarket_sources` row stays off, which is the per chain
  # switch (plan 0083) and is application state rather than a key in this file.
  # This is the section 8.1 separation working as designed rather than a
  # leftover. Store discovery is two requests to
  # OpenStreetMap (one geocode, one Overpass query, once per postal code per
  # thirty day cooldown) and never touches a storefront. Catalog discovery is
  # 4,383 requests into somebody's shop, and it stays a decision of its own to
  # make later, on its own evidence. The double fetch objection this file used to
  # raise is about that second thing: two clusters walking one assortment is twice
  # the requests for one copy of the answer. Two OSM lookups a month for a postal
  # code a real person lives in is a different order of thing, and if the overlap
  # with production ever stops being comfortable the answer is a shared cache, not
  # switching a cluster off.
  #
  # The actor id is no longer a values field at all (plan 0081, section 11).
  # `provision-release.sh` generates it into the per environment Secret, and both
  # `HARVESTER_ACTOR_ID` and catalog's `SERVICE_ACTOR_IDS` read that one key.
  #
  # It used to be left empty here on purpose, because store discovery writes into
  # the harvester's own database and never calls catalog. A leaflet import does
  # call catalog, so an empty id is no longer a harmless default: it is an import
  # that runs and writes nothing, with `CatalogClient.actor()` throwing a named
  # error. Provisioning it is what `--check` now asserts before a deploy.
  harvester:
    enabled: true
    harvestEnabled: true
    # Staging fires no schedule (plan 0206, section 10). Production does, and
    # two clusters fetching one chain on one timer double what the chain sees.
    # A person can still start any run here.
    schedulerEnabled: false

  # The catalog database keeps the one core that values.yaml gives it, and Redis
  # keeps its 100m. Both would take more, and this node has four cores: 3,310m of
  # the 4,000m is requested, and a deploy needs the rest for the pods that it
  # surges. A stateful pod cannot take a higher limit alone, because its request
  # must equal its limit to stay Guaranteed (plan 0004).

  # No nightly backups in staging: it is disposable by design. The CronJobs render
  # suspended, because a release task (`k8s/release-tasks`) dumps every database
  # it touches before it runs, and it starts that dump from them. That needs
  # luna-shopper-backend-backup-secret here too, pointing at a bucket of its own:
  # never production's, whose `latest` would then pick up a staging dump.
  backups:
    enabled: true
    suspend: true
