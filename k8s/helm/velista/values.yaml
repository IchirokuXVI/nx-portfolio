# ---------------------------------------------------------------------------
# The velista deploy unit (k8s plans 0014 and 0015): velista, the back office
# and the Luna Shopper backend. One environment per values file (plan 0002), one
# release per unit:
#
#   helm upgrade --install velista k8s/helm/velista --namespace luna-shopper \
#     --values k8s/helm/velista/values.yaml \
#     --values k8s/helm/velista/values.production.yaml
#
# The namespace and the release name come from k8s/units/velista/unit.env.
# Every object is rendered into `--namespace`, so no key here names one.
# ---------------------------------------------------------------------------

# The domain this unit serves: velista.app in production, staging.velista.app in
# staging (plan 0015 D7). Every host is derived from it. Empty here, so a deploy
# with no environment values file fails rather than picks one.
baseDomain: ''

# Which environment this is, for telemetry only (DEPLOYMENT_ENVIRONMENT on every
# backend pod). Nothing in the chart branches on it.
environment: ''

# Names that do not sit under `baseDomain`, keyed by the `apps` /
# `lunaShopperBackend.services` entry name. Empty in both clusters, whose hosts
# all compose under this unit's own domain. The homelab file uses it to put
# velista under the owner's one domain. See the `charts.host` helper.
hostOverrides: {}

# A cluster deploy pulls the freshly pushed images (Always). A local deploy uses
# the images built into the Docker Desktop store and overrides this.
appImagePullPolicy: Always

# Registry credentials as Secret names in this namespace. Empty in both
# clusters, which authenticate at the node level; see values.homelab.yaml.
imagePullSecrets: []

# The tag every app and backend service of this unit runs. Production pins the
# release version (deploy-release.sh passes --set imageTag); staging tracks the
# mutable `staging` tag that CI overwrites on every push to main.
imageTag: latest

# ---------------------------------------------------------------------------
# Routing (plans 0001 and 0015). The chart declares the routes as core Gateway
# API objects, and the implementation owns the data plane. The cluster
# prerequisites (Gateway API CRDs, Envoy Gateway with merged gateways,
# cert-manager, MetalLB and its pool) are installed once per cluster by
# k8s/bootstrap/install.sh, not by this chart. The one implementation specific
# template is luna-shopper-backend/implementation-envoy.yaml.tpl.
# ---------------------------------------------------------------------------
gateway:
  enabled: true

  # `kubectl get gatewayclass` names it; install.sh prints it at the end.
  className: eg

  tls:
    enabled: true
    # The unit's own ACME account (plan 0015 D4): a namespaced Issuer that this
    # chart renders when `create` is true, solving HTTP-01 through this unit's
    # Gateway. A local deploy points at an existing ClusterIssuer instead.
    issuer:
      kind: Issuer
      name: letsencrypt
      create: true
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        # Required when `create` is true. The environment files set it.
        email: ''
    # Plain HTTP answers with a redirect to HTTPS. `.app` is on the HSTS preload
    # list, so a browser never tries plain HTTP there anyway.
    redirectHttp: true

  # Long lived connection timeout for the routed WebSocket services, carried over
  # from nginx's proxy_read_timeout / proxy_send_timeout. Applied by
  # implementation-envoy.yaml.tpl.
  websocketTimeout: 3600s

  # Implementation specific annotations on the Gateway. Empty by design.
  extraAnnotations: {}

# Each app is one Deployment and Service, routed by one HTTPRoute. Image names are
# the tag-less repo path; the tag is `imageTag` above.
apps:
  # velista is a standalone app on its own origin, the root of `baseDomain`
  # (plan 0165). `path: /` emits no rewrite filter. DNS is the one manual
  # prerequisite: cert-manager cannot solve an HTTP-01 challenge for a name that
  # does not resolve.
  #
  # It is also served at `/velista` on the portfolio host. That route belongs to
  # the portfolio chart (`externalRoutes`), and `referenceGrants` below allows it.
  - name: velista
    image: ghcr.io/ichirokuxvi/nx-portfolio/velista
    hostPrefix: ''
    path: /
  # The back office for the luna-shopper backend (luna-shopper-admin plan 0001).
  # Named after the backend it administers, and served on `admin.` of velista's
  # domain because that is the record that exists and the name the operator
  # types. Not a micro-frontend: the shell loads nothing from it.
  - name: luna-shopper-admin
    image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-admin
    hostPrefix: admin
    path: /

# The routes of other units that may reach a Service of this one (plan 0015 D6).
# `fromNamespace` is the NAMESPACE of k8s/units/portfolio/unit.env, the one
# place this unit names the other's namespace. `provision-release.sh --check`
# fails when the two differ. Drop the entry when the portfolio stops routing to
# velista (backlog 0002).
referenceGrants:
  - name: portfolio-reaches-velista
    fromNamespace: portfolio
    toServices:
      - velista

# ---------------------------------------------------------------------------
# Luna Shopper backend (plan 0002).
#
# Long running Node services (gateway, realtime, auth, core, catalog), their
# stateful dependencies (three Postgres instances + NATS with JetStream) and the
# zero downtime deploy config (rolling update with a readiness gate, graceful
# shutdown, PodDisruptionBudgets). Kept out of the `apps` list above because the
# shape differs: these carry env/secrets, health probes and PDBs, and only the
# gateway and realtime are public (each gets an HTTPRoute); auth, core and
# catalog are internal (ClusterIP, reached over NATS and by the gateway).
#
# Disabled by default: turning it on requires the runtime Secrets to exist (run
# k8s/bootstrap/provision-release.sh) and the api./rt. DNS records. Flip to true
# once those are in place.
#
# Since plan 0002 this switch means one thing rather than two. It used to stand
# up the production services unconditionally while only the staging ones honoured
# `staging.enabled`, so enabling the backend for a staging smoke test also
# crashlooped five production pods and requested real certificates for the
# production API hosts. One environment per release removes that entirely.
# ---------------------------------------------------------------------------
lunaShopperBackend:
  enabled: false

  imagePullPolicy: Always

  # Two replicas per service (plan 0004, section 3 / plan 0027, section 3 /
  # plan 0028, section 6).
  #
  # This was pinned at 1 for a correctness reason rather than a cost one: four
  # pieces of shared state lived in each pod's memory, so a second replica did
  # not add redundancy, it added a realtime service that was wrong about half the
  # time. Plan 0028 moved all four into Redis, in this order and each with its
  # own tests:
  #
  #   the socket.io adapter, so a broadcast reaches sockets on every pod;
  #   the relay channel, so an event crosses the pod boundary exactly once;
  #   presence, with a heartbeat so a killed pod's users drain out on their own;
  #   the throttle counters and the JetStream dedupe window.
  #
  # Raising this without Redis reachable does not fail loudly, which is why
  # REDIS_URL is required rather than optional in both services that hold state.
  #
  # The PodDisruptionBudget below follows this value: at 1 it is not rendered at
  # all, because `minAvailable: 1` over a single replica blocks every voluntary
  # eviction and hangs `kubectl drain` forever. At 2 it renders again.
  replicaCount: 2

  # Zero downtime knobs (plan 0002, section 6). maxUnavailable 0 + maxSurge 1
  # means a new pod must pass its readiness probe before an old one is removed.
  # Still true at one replica: the replacement starts and goes ready before the
  # old pod is retired, so an ordinary deploy stays brief. What one replica costs
  # is surviving a crash or a node failure.
  rollout:
    maxUnavailable: 0
    maxSurge: 1
  # Long enough for in flight requests to drain on SIGTERM before SIGKILL.
  terminationGracePeriodSeconds: 30
  # Node maintenance may never take the last replica of a service. Only rendered
  # when replicaCount > 1; see the note above.
  pdb:
    minAvailable: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Non secret config, rendered into one ConfigMap. Secret values (DB URLs, JWT
  # keys, OAuth secret, SMTP password) live in a separate, pre created Secret;
  # see luna-shopper-backend-secrets.md and bootstrap/provision-release.sh.
  #
  # The keys here are the ones that are the same in every cluster. The per
  # environment answers (log level, CORS origins, the OAuth callback, the mail
  # URLs) live in values.production.yaml / values.staging.yaml, which merge over
  # this map.
  config:
    natsUrl: nats://luna-shopper-backend-nats:4222
    # No credentials and no Secret (plan 0028, section 3): a cluster local
    # Service with no auth, consistent with how NATS is already deployed here.
    # If that ever changes it changes for both at once.
    redisUrl: redis://luna-shopper-backend-redis:6379
    accessTokenTtl: 15m
    refreshTokenTtl: 30d
    # The operator session (plan 0071, section 4). Short, and there is no refresh
    # token behind it: the back office renews the token while it is still valid
    # and once it is dead it is dead, so the whole design holds no long lived
    # credential for an account that can read every user's data.
    adminAccessTokenTtl: 15m
    # Lockout (plan 0071, section 7). Five consecutive failures for one username,
    # counted over fifteen minutes and reset by a successful sign in. Separate
    # from the gateway's per IP throttle because throttling limits a source and
    # this protects an account.
    adminLoginLockoutThreshold: '5'
    adminLoginLockoutWindow: 15m
    # Overridden by each environment file. The default is the safe half of the
    # mistake: an operator told they are in development while looking at
    # production data has been warned about the wrong thing in the harmless
    # direction only if the colour is alarming, so both clusters state their own.
    environmentName: development
    # Support sessions (plan 0194): an operator opens the app as a user, for
    # two hours at most. Off here, so a cluster allows it only when its own
    # values file says so. values.staging.yaml does. values.production.yaml
    # does not name it: production waits for the privacy policy to name
    # support access, and the owner turns it on after that.
    impersonationEnabled: false
    # The Terms (plan 0231, section 5.3). True refuses a path that creates an
    # account with no accepted version. False in every environment until
    # velista plan 0173 ships the acceptance UI and minClientVersion reaches
    # its first build, in the same PR. The gateway refuses to boot with it true
    # and no published controller or contact.
    termsAcceptanceRequired: false
    # What the privacy policy states about log retention (plan 0231, section
    # 5.3). Reported by GET /v1/legal/settings and enforced by k8s plan 0018,
    # which may change the assistant's number.
    legal:
      applicationLogDays: 30
      assistantLogDays: 7
    # How long auth, core and catalog keep a row of each kind (plan 0233), as
    # durations. The privacy policy prints these numbers (plan 0231 gives them
    # to the gateway, which reports them in whole days), so a change here is a
    # change to the policy. Auth, core and catalog enforce them with a sweep,
    # and each refuses to boot below a floor: 7d for audit, 1d for the others.
    retention:
      audit: 180d
      adminLoginFailures: 90d
      expiredGrants: 14d
    # Google sign in is optional (plan 0026): with an empty client id every
    # service still boots, and the two interactive Google routes answer 501
    # `not_configured` instead of failing. Set all three to turn it on.
    googleClientId: ''
    # Email is optional the same way (plan 0026, section 3.4). With no SMTP host
    # registration answers 501 rather than accepting a signup whose confirmation
    # link is never sent. A cluster that exercises the signup flow sets it.
    smtpHost: ''
    # 2525 rather than the conventional 587. Both environment files override it
    # with the same number, and the default matches them so a new cluster
    # inherits the port that works: hosting providers block 25, 465 and 587
    # outbound by default, and a blocked port does not fail, it hangs.
    smtpPort: '2525'
    smtpUser: ''
    # There is deliberately no admin list here any more (plan 0072). Writing the
    # catalog is proved by a signature the service verifies for itself, so an
    # admin is created with one database write and no restart, and no value in
    # this file can grant the role. What services may write catalog is
    # `SERVICE_ACTOR_IDS`, which comes from the per environment Secret that
    # `provision-release.sh` writes rather than from this file (plan 0081,
    # section 11).
    # The oldest velista build this deployment will serve (velista plan 0034).
    #
    # Empty switches the mechanism off, which is how both clusters run: the gateway
    # advertises no floor and refuses nobody. Set it to a released version, and the
    # same numbers a rollback is expressed in, when a client old enough to send
    # requests that mean the wrong thing is worth retiring. Clients then read the
    # floor off any response, fetch the new bundle and reload themselves, and one
    # that is still below it is answered `client_too_old` (426).
    #
    # Two things to know before setting it. A non semver value fails the gateway at
    # boot on purpose, so this cannot be quietly wrong. And staging builds identify
    # themselves as `staging`, which is not a version, so a floor set on the staging
    # cluster retires nothing there.
    minClientVersion: ''
    # Telemetry (plan 0016). Tracing stays off until a collector exists in the
    # cluster (section 8): with no endpoint no exporter is constructed and no
    # network call is attempted, so the services run exactly as they do today.
    # Turning it on is a values change and a `helm upgrade`, not a new image.
    otelEnabled: false
    otelExporterEndpoint: ''
    # Full sampling is right while traffic is small; lower it if the volume ever
    # costs something. Parent based, so it only decides at a trace root.
    otelSamplerArg: 1
    # /metrics on each service's health port, reachable inside the cluster only.
    # It costs nothing until something scrapes it.
    metricsEnabled: true

  # -------------------------------------------------------------------------
  # The harvester (plan 0038), and the one switch that decides whether it exists
  # in a cluster at all.
  #
  # FALSE HERE IS THE CHART'S DEFAULT, NOT EVERY CLUSTER'S ANSWER (k8s plan
  # 0008). Staging turns it on for store discovery, production follows after a
  # soak, and each environment file says so beside its own flag. A cluster that
  # says nothing gets no harvester, which is the right way round for a service
  # that fetches from third parties.
  #
  # It was false everywhere until then, for one reason that came apart into two:
  #
  # - The FETCHING cost was the loud half. A catalog discovery run is 4,383 HTTP
  #   requests over eighteen minutes at the default rate, on nodes sized for the
  #   app rather than for a crawler. That cost belongs to catalog discovery, which
  #   is still off in both clusters. Store discovery, the mode plan 0063 puts in
  #   the path of somebody adding a postal code, is TWO requests: one geocode and
  #   one Overpass query, once per postal code per thirty day cooldown.
  # - The RESIDENT cost is unchanged, and it is what a cluster now pays: a fourth
  #   Postgres with its own 2Gi volume on a 256Mi memory budget, plus another Node
  #   process at roughly 230 MB. Section 5 of that plan sizes the database for
  #   this workload, and tens of thousands of small rows is comfortable inside it.
  #
  # Nothing else in the chart branches on this. Both the service entry and the
  # database instance carry `optional: harvester`, and every template that walks
  # those lists skips an entry whose `optional` is not enabled here. So with this
  # false there is no Deployment, no Service, no PDB, no migration Job, no
  # StatefulSet, no PVC and no backup CronJob: the harvester is described by the
  # chart and absent from the cluster.
  #
  # Turning it on in a cluster is this flag plus two Secret keys (HARVESTER_DB_URL
  # and the harvester-db instance secret, both of which provision-release.sh
  # writes unconditionally), and then `harvestEnabled` below, which is a second,
  # separate decision: the pod existing and the pod fetching from a third party
  # are not the same thing. Run `provision-release.sh --check --unit velista --env <env>` before
  # the first deploy that carries this true; a missing secretKeyRef is precisely
  # the failure a newly enabled service introduces, and --check names it in
  # seconds rather than at rollout.
  #
  # TURNING IT BACK OFF LEAVES THE VOLUME BEHIND. A StatefulSet's
  # `volumeClaimTemplates` PVCs are not deleted with the StatefulSet, so setting
  # this false removes the workload and leaves a 2Gi claim on the node. That is
  # correct behaviour rather than a leak. Deleting the claim is deliberate and
  # manual, and it destroys the import decisions section 6 of k8s plan 0008
  # explains no re-run can bring back.
  # -------------------------------------------------------------------------
  harvester:
    enabled: false

    # THE ACTOR ID IS NOT HERE ANY MORE (plan 0081, section 11).
    #
    # The uuid the harvester writes to catalog as (backlog 0001, section 4.1;
    # plan 0072, section 4) is generated once per cluster by
    # `provision-release.sh` and kept in the per environment Secret, and both
    # `HARVESTER_ACTOR_ID` and catalog's `SERVICE_ACTOR_IDS` are read from that
    # one key, so the pair still cannot drift.
    #
    # A uuid is not a secret, and it was a ConfigMap value for exactly that
    # reason. What moved it is that it has to EXIST in both clusters now: an
    # import writes prices, `CatalogClient.actor()` throws without an id, and
    # the Secret is the only per cluster store the provisioning script owns. The
    # chart owns the ConfigMap and would overwrite anything written there.
    # `--check` then asserts the key exists before a deploy, which a values file
    # somebody forgot to edit could never do.

    # Whether the pod may start a run at all. Separate from `enabled` on purpose:
    # bringing the service up and letting it fetch from a third party are two
    # decisions, and this one is reversible in seconds.
    #
    # False here for the same reason `enabled` is: a cluster that has not decided
    # gets the quiet answer. The environment file of a cluster that wants store
    # discovery sets it true beside its own `enabled` (k8s plan 0008), and the
    # queue in plan 0063 fills either way, so a cluster that turns this on later
    # drains a real backlog rather than starting from nothing.
    harvestEnabled: false

    # Whether a due schedule starts its preset by itself (plan 0206, section
    # 10). A third decision, after the pod existing and the pod fetching: a pod
    # that runs the walk a person asked for and a pod that starts walks with
    # nobody asking are not the same thing. False here, false in staging, true
    # in production only: two clusters that both fetch one chain on a timer
    # double what the chain sees and add nothing. With it on and no schedule
    # row, nothing happens.
    schedulerEnabled: false

    # There is no per chain key here, and there is not meant to be (plan 0083).
    # Which chains may be fetched is a row per chain in the harvester's own
    # database, `supermarket_sources.enabled`, off by default and written from
    # the back office. A variable named after a storefront needed a new one per
    # storefront, threaded through the service config, this file, the ConfigMap
    # and both `luna-slot` scripts before a run could start.
    #
    # Every chain's row is off in both clusters today, and that is a decision
    # about the chains rather than about the harvester: store discovery reads
    # OpenStreetMap and never touches a storefront, so "the service exists and
    # finds shops" and "the service reads a supermarket's prices" stay separable,
    # which is the whole point of section 8.1. Turning one on in a cluster is its
    # own call to make when there is a reason to make it, and the double fetch
    # rule in that section is the first thing to settle when it comes up: two
    # clusters walking the same assortment is twice the requests for one copy of
    # the answer. Runs happen against the local compose stack until then.

    # An HONEST User-Agent naming the app and a contact address, and specifically
    # not the Chrome impersonation the public reference implementations use. Set
    # the contact to a mailbox someone reads.
    userAgent: 'LunaShopper/0.1 (+https://velista.app; personal price comparison; contact@velista.app)'

    # Two knobs doing two different jobs (plan 0038, section 6.3): `workers`
    # bounds how many requests are in flight, `maxRequestsPerSecond` bounds our
    # impact on the source. They are separate because one shared token bucket is
    # what makes the configured rate the rate the source actually sees; a per
    # worker delay would be four times the intended rate at four workers.
    #
    # 4 req/s is the only number in that section with no evidence behind it, and
    # it decides whether a run takes 9 minutes or 73. Watch for 429s and halve it
    # rather than retrying harder.
    defaultWorkers: 4
    defaultMaxRps: 4
    batchSize: 200

    # A RUNNING run whose heartbeat is older than this (seconds) is reaped as
    # STALE and its lock released. The only recovery path for a force killed
    # harvester, and none other is designed: a lost run costs one refresh cycle.
    staleAfterSeconds: 900

    # A run fails outright once this fraction of its planned work has failed.
    failureRatio: '0.25'

    # The postal code discovery queue (plan 0063). An unknown code somebody put
    # on their profile becomes a STORE_DISCOVERY run, drained one at a time.
    #
    # `discoveryRadiusMetres` is NOT the profile's nearby radius and must never
    # be merged with it (section 7): that one decides which postal codes a person
    # shops in, this decides how far around a code's centre to look for shops,
    # and it is larger because a shop at the edge of a code is still that code's
    # shop.
    #
    # Thirty days because a supermarket opening is a rare event and a closing
    # rarer, so a thousand users in one postcode cost one run a month between
    # them. Draining is gated by `harvestEnabled` above; the queue fills either
    # way, so turning that on later drains a real backlog.
    discoveryRadiusMetres: 5000
    discoveryCooldownDays: 30
    discoveryMaxAttempts: 3
    discoveryPollSeconds: 60

    # Empty means each library's public default. OVERPASS_URL exists so a self
    # hosted instance can be pointed at without a code change if usage ever grows.
    overpassUrl: ''
    nominatimUrl: ''

    # The key LIDL's public store search bundle ships (plan 0089, section 10).
    # It is configuration and not a secret, which is why it sits here and not in
    # the Secret: it is the same fixed string every browser sends. Empty means
    # the value the library carries, and a 401 from the store service is the
    # signal that the chain rotated it.
    lidlStoresApiKey: ''

  # -------------------------------------------------------------------------
  # The assistant (plan 0039).
  #
  # **No `enabled` switch, unlike the harvester above, and that difference is the
  # design rather than an omission.** The harvester is gated because running it
  # costs a fourth Postgres with its own volume, and because a cluster has to
  # decide separately whether that service may fetch from anybody. This service is
  # one small stateless Node process with no database at all, so there is nothing
  # to gate: it deploys everywhere.
  #
  # Claude answers every turn (plan 0236), and the transcriber below hears (plan
  # 0235). There is no provider switch: Velista is for every age, and Claude is
  # the provider whose terms allow a service that minors use, with the
  # safeguards of plan 0236 (a child safety block in the prompt and a check of
  # every reply).
  #
  # What decides whether it can actually answer is `ANTHROPIC_API_KEY` in the
  # Secret. An absent key is a supported deployment rather than a broken one.
  # The pod boots, its health probes pass, and `/v1/assistant` answers 501
  # not_configured (plan 0026). That is also why the key is in
  # `OPTIONAL_EMPTY_KEYS` in provision-release.sh, so `--check` keeps passing on
  # a cluster where the assistant is simply unconfigured. Nothing here may be
  # made required without breaking that property.
  #
  # There are **no environment values file changes for this service at all**,
  # because it is not routed: no host, no DNS record, no certificate and no CORS
  # origin in either environment. That is the whole saving from section 3's
  # decision to reach it through the gateway rather than on a `bot.` host.
  # -------------------------------------------------------------------------
  assistant:
    # Where the assistant calls the app's own API on the caller's behalf (rule
    # A1). Empty means the in cluster gateway service, which is what it should
    # always be: this must never be the public `api.` host, or every turn pays for
    # TLS and the ingress twice for a call that never leaves the cluster.
    gatewayInternalUrl: ''

    # A config value and not a literal, so changing it is an env edit and a
    # restart. Empty means `claude-haiku-5-5`.
    model: ''

    # Empty means the defaults the evaluation chose (plan 0224, section 10):
    # effort `low` (`low`, `medium` or `high`) and thinking `adaptive`
    # (`adaptive` or `off`). `off` on a Sonnet model is a 400 on the first turn.
    claudeEffort: ''
    claudeThinking: ''

    # The check of every reply before it leaves (plan 0236, section 4): one
    # short call to `moderationModel` (empty means `claude-haiku-5-5`). A reply
    # it flags is replaced, and a reply it could not check is dropped. `off` is
    # only for a self hosted deployment that no minor uses. Quoted, because YAML
    # reads a bare on as true (the template accepts either).
    moderation: 'on'
    moderationModel: ''
    # The number the assistant names to a person in danger. Empty means 112, the
    # emergency number of Spain and the whole EU.
    emergencyNumber: ''

    # Whether each turn's record logs what the person said and the reply (k8s
    # plan 0018, D3). Off, the record holds their lengths and nothing else
    # changes. The host keeps this container's logs 7 days (`assistantLogDays`
    # above states it), so on means a transcript lives that long.
    logTurnText: false

    # Voice input (plan 0041). A spoken turn is transcribed by the deployment's
    # own transcriber (plan 0235, `transcriber` below), and then runs the
    # identical code a typed turn runs. No model provider hears, so there is no
    # second secret here and nothing new in provision-release.sh.
    #
    # 2 MB, before base64. The gateway's multipart interceptor enforces the same
    # number on the upload; this one is applied to what actually crossed the
    # broker, because a cap the client could have chosen is not a cap. It sits
    # inside `nats.maxPayload` above with deliberate headroom.
    audioMaxBytes: 2097152
    # The transcriber decodes each of these with ffmpeg. The first three are
    # what browsers actually produce: Chrome webm, Firefox ogg, Safari mp4.
    audioMimeTypes: 'audio/webm,audio/ogg,audio/mp4,audio/wav,audio/mpeg,audio/aac,audio/flac'

    # Caps on the client supplied transcript. The service stores nothing between
    # turns (rule A2), so the whole conversation arrives on every request and is
    # untrusted input.
    maxTurns: 20
    maxChars: 8000
    maxToolCalls: 6

    # Living inside the provider's rate limit (section 9). It is per account
    # rather than per user, so a 429 is an ordinary event; that is accepted, and
    # the requirement is only that it be legible, which is rule A5. Both numbers
    # below are per instance and in memory: neither survives a restart and
    # neither is shared across replicas.
    turnsPerMinute: 8
    # A small gate in front of the provider call, so a burst queues briefly
    # instead of becoming a burst of 429s. Waiting two seconds is invisible,
    # being told to come back is not.
    concurrency: 2
    # The floor for `retryAfterSeconds`, so the field is never absent.
    retryAfterFallbackSeconds: 30

    # Each person's allowance (plan 0234, section 7). The two numbers above
    # protect the provider's rate limit and the pod; these protect the bill.
    # Counted in core's database, so they survive a restart and are shared by
    # every replica. Positive integers, and no "off": a self hoster who wants
    # no practical limit sets a large number. Money is integer micro dollars,
    # so 100000 is $0.10. These are the only place the defaults are written;
    # the template refuses to render without them.
    allowance:
      registered:
        turnsPerDay: 60
        turnsPerMonth: 600
        # Fifteen minutes of talking to the app.
        assistantAudioSecondsPerDay: 900
        assistantAudioSecondsPerMonth: 9000
        # Thirty one minute voice comments.
        commentAudioSecondsPerDay: 1800
        commentAudioSecondsPerMonth: 18000
        # The turn count binds first; money is the backstop for long turns.
        costPerDayMicroUsd: 100000
        costPerMonthMicroUsd: 1000000
      # A guest (a `TEMPORARY` account).
      guest:
        turnsPerDay: 20
        turnsPerMonth: 100
        assistantAudioSecondsPerDay: 300
        assistantAudioSecondsPerMonth: 1500
        commentAudioSecondsPerDay: 600
        commentAudioSecondsPerMonth: 3000
        costPerDayMicroUsd: 40000
        costPerMonthMicroUsd: 200000
      # What the whole deployment may spend: one bad day costs at most this.
      # Reached, the assistant says it is resting and never names money.
      deploymentCostPerDayMicroUsd: 3000000
      deploymentCostPerMonthMicroUsd: 30000000
      # What a turn holds before its first provider call: at least the worst
      # turn at the default caps and prices (plan 0234, section 5.2).
      turnReserveMicroUsd: 20000
      # An IANA name. The day and the month turn over at midnight there.
      timezone: UTC

  # -------------------------------------------------------------------------
  # The transcriber (plan 0235): speech to text on this cluster's own machine,
  # faster-whisper behind a small HTTP service, so no recording leaves it. The
  # assistant is its only caller, and it has no route from outside.
  #
  # This one value is voice. True renders the Deployment, the Service and the
  # model volume (templates/luna-shopper-backend/transcriber.yaml.tpl), and
  # writes TRANSCRIBER_URL for the assistant, which is what makes the
  # assistant hear and what `hears` in the published privacy settings follows
  # (plan 0231, section 3). False is a supported deployment, not a broken one:
  # the voice route answers 501, a voice comment stays playable and settles
  # UNAVAILABLE, and velista hides the microphone.
  #
  # TURNING IT ON COSTS two cores and 2.5 Gi held for the pod (requests equal
  # limits, so it is Guaranteed like the stateful tier), and a download of about
  # 2 GB from Hugging Face on the first start, into the volume below. Voice
  # stays off until `/health/ready` answers, which is after both models are in
  # memory. Production is the only environment with room for it.
  #
  # TURNING IT OFF KEEPS THE VOLUME. The claim carries
  # `helm.sh/resource-policy: keep`, so the 2 GB download survives a switch off
  # and back on. Deleting it is deliberate and manual.
  # -------------------------------------------------------------------------
  transcriber:
    enabled: false
    image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-transcriber
    port: 3007
    # `small` answers a spoken turn, where somebody is waiting. `large-v3-turbo`
    # writes a voice comment down, where nobody is and accuracy matters more. A
    # small machine can name `small` for both and load one model.
    turnModel: small
    commentModel: large-v3-turbo
    storageClassName: local-path
    storageSize: 5Gi
    # Two cores because that is what the bench measured and `cpu_threads` 2 is
    # tuned for. 2,560 Mi because both models resident took 1.6 GB, a five minute
    # clip decoded is another 20 MB, and the rest is headroom against the OOM
    # killer (section 6.1).
    resources:
      requests:
        cpu: '2'
        memory: 2560Mi
      limits:
        cpu: '2'
        memory: 2560Mi
    # How long the assistant waits for a transcription, the transcriber's queue
    # included (section 6.2). A turn allows one running comment ahead of it and
    # its own clip; a comment allows a full queue of turns and ninety seconds of
    # audio. VOICE_COMMENT_TRANSCRIBE_TIMEOUT_MS on the gateway stays above the
    # second.
    turnTimeoutMs: 45000
    commentTimeoutMs: 110000

  # Each backend service: one Deployment + Service (+ PDB). `routed` services get
  # an HTTPRoute on `hostPrefix`.`baseDomain`, which is `api.` and `rt.` of
  # velista's own domain. The rest are ClusterIP only.
  # `websocket` additionally earns the one implementation specific timeout
  # policy. `role` drives which env vars (and thus which secret keys) the pod
  # receives, so only the auth pod ever sees the JWT private key. Images are the
  # tag-less repo path; the tag is `imageTag` like the apps above.
  services:
    - name: luna-shopper-backend-gateway
      role: gateway
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-gateway
      port: 3000
      routed: true
      hostPrefix: api
      websocket: false
      # Paths that need longer than the implementation's default before it gives
      # up on the request. Each one becomes its own HTTPRoute rule, ahead of the
      # catch all: Gateway API matches by specificity, so a prefix rule always
      # beats `/` and nothing else on this host is affected.
      #
      # It exists for the assistant, and the numbers here are one decision with
      # ASSISTANT_TURN_TIMEOUT_MS. A turn is a model call, then up to six rounds
      # of tools with a model call before each, so the ordinary fifteen second
      # default cut off perfectly good turns. Worse, it cut off the **caller**
      # and not the turn: the assistant went on running and wrote its lines
      # seconds after the app had said the recording did not arrive, and somebody
      # who believed that said it again and got two of everything.
      #
      # 120s is the turn budget (60s) plus one whole provider timeout (30s) plus
      # the moderation check of the reply (8s, plan 0236) plus slack, because the
      # deadline stops the loop starting new work and does not abort a provider
      # call already in flight, and the check runs after that call. 98s in all.
      # Raise the turn budget or the check's deadline and this has to move with
      # it, or the proxy starts giving up first again.
      slowPaths:
        - path: /v1/assistant
          timeout: 120s
        # A curation decisions file: up to a thousand products created and
        # bound in one all or nothing request. It ran past fifteen seconds and
        # the proxy answered 504 while the harvester went on and applied the
        # file, so the operator could not tell whether it had landed. The
        # barcode check is one query now, and this is the margin on top.
        - path: /v1/admin/harvest/entries/decisions
          timeout: 120s
    - name: luna-shopper-backend-realtime
      role: realtime
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-realtime
      port: 3001
      routed: true
      hostPrefix: rt
      websocket: true
    - name: luna-shopper-backend-auth
      role: auth
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-auth
      port: 3002
      routed: false
    - name: luna-shopper-backend-core
      role: core
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-core
      port: 3003
      routed: false
    - name: luna-shopper-backend-catalog
      role: catalog
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-catalog
      port: 3004
      routed: false
    # The harvester (plan 0038). Internal, with no route of its own: its callers
    # are the gateway and itself.
    #
    # `optional: harvester` is what decides whether it exists in a given cluster.
    # Every template that walks this list skips an entry whose `optional` names a
    # feature that is not enabled, and `harvester.enabled` above is false unless an
    # environment file says otherwise. The entry lives here rather than being added
    # by an environment values file because a Helm list is replaced wholesale, not
    # appended to: describing it once and gating it is the only way the two
    # clusters and a local deploy stay in step.
    #
    # `replicas: 1` and `strategy: Recreate` (see the deployment template): a run
    # holds an in memory work queue and an AbortController, so a second replica
    # would not share the work, it would start a second run. The database's active
    # run index refuses that, but a rolling update briefly running two pods would
    # mean the new one cannot start until the old one's run finishes.
    - name: luna-shopper-backend-harvester
      role: harvester
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-harvester
      port: 3005
      routed: false
      optional: harvester
      replicas: 1
      strategy: Recreate
    # The assistant (plan 0039). Internal, with no route of its own: the client
    # reaches it through the gateway at `/v1/assistant`.
    #
    # `routed: false` with no `hostPrefix` is the whole saving from section 3's
    # decision to go through the gateway rather than give it a `bot.` host: no new
    # DNS record, no certificate, no `hostOverrides` entry and no CORS origin, in
    # either environment. **There are no environment values file changes at all
    # for this service**, which is what that buys.
    #
    # Port 3006 rather than the 3005 the plan names: 3005 belongs to the
    # harvester, which landed first (plan 0038). Nothing else about the plan
    # depended on the number.
    #
    # No `optional:` gate, unlike the harvester. This one is meant to run, and the
    # thing that decides whether it can answer is ANTHROPIC_API_KEY: with the key
    # empty the pod boots healthy and answers 501 on its one route (plan 0026),
    # so an unconfigured cluster needs no chart change to stay up.
    - name: luna-shopper-backend-assistant
      role: assistant
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-assistant
      port: 3006
      routed: false

  # Stateful dependencies. Three Postgres instances (auth, core and catalog each
  # own one, so the no shared database rule holds) and one NATS server with
  # JetStream on a persistent volume so streams survive a restart.
  #
  # Each cluster now runs its own instances, which is what removes the hand
  # created `*_staging` databases: an instance creates exactly one database from
  # POSTGRES_DB, and with the instances no longer shared that one is the right
  # one. It is also what stops a staging request being answered by a production
  # subscriber on the shared broker, which was the serious failure (plan 0002,
  # section 1).
  #
  # The postgres password comes from each instance's pre created Secret.
  postgres:
    image: postgres:16-alpine
    storageClassName: local-path
    storageSize: 2Gi
    # Requests equal limits, which is what makes the pod Guaranteed QoS: evicted
    # last under memory pressure and given the most favourable OOM score (plan
    # 0004). With no resources at all these were BestEffort, i.e. the FIRST thing
    # the kubelet killed on a node under pressure, ahead of every stateless pod
    # that exists only to talk to them.
    #
    # A memory limit on Postgres is a decision about Postgres too: past the limit
    # it is OOM killed rather than swapped, and Postgres sizes its buffers from
    # its own configuration, not the cgroup. `sharedBuffers` and `workMem` below
    # are passed to the server so the two numbers are chosen together.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 256Mi
    # Sized against the 256Mi limit above. postgres:16-alpine would otherwise
    # default shared_buffers to 128MB and leave almost nothing for work memory
    # and connections. Raise these and the limit together, never one alone.
    sharedBuffers: 64MB
    workMem: 4MB
    # One instance can take numbers of its own, keyed by its name. Each key that
    # an entry leaves out falls back to the value above. It is a map and not a
    # field on `instances` because Helm replaces a list whole: an environment
    # file that wanted to change one instance would have to restate all four.
    #
    #   instanceOverrides:
    #     luna-shopper-backend-catalog-db:
    #       resources: { requests: {...}, limits: {...} }
    #       sharedBuffers: 256MB
    #       workMem: 8MB
    #       jit: 'off'
    #
    # `resources` is taken whole, so state requests and limits together and keep
    # them equal. That is what keeps the pod Guaranteed. `jit` has no shared
    # value: an instance that does not name it keeps the default of Postgres.
    #
    # The catalog database is the one heavy instance, in each cluster. These
    # numbers come from measurements on staging on 2026-10-07, with 22,203 items
    # and 330,733 supermarket items.
    #
    # Memory. The database is 349 MB. Of that, 189 MB is `catalog_audit`, which
    # is appended to and almost never read. All other tables and indexes are
    # 152 MB together. 256MB of shared buffers holds them with room to grow by
    # two thirds. The 1Gi limit leaves the rest for the connections of two
    # catalog replicas, autovacuum, and the page cache that a restore or a dump
    # fills. At 256Mi the cgroup reached its limit 27,394 times and the cache hit
    # rate was 68%.
    #
    # CPU. The search filter has a fuzzy branch that no index serves, so one
    # search statement reads all items. That is 0.4 s of CPU on a staging core
    # with no JIT, and 1.1 s with it: the planner prices the statement above
    # `jit_above_cost`, and the compile then costs twice what the scan does. JIT
    # helps an analytic query of many seconds, and this database runs none.
    #
    # One statement is one process, so a limit below one core only makes each
    # search slower. At 250m the 1.1 s took 4 s, and `GET /v1/catalog/suggest`
    # answered in 6 to 9 seconds. One core is the least that does not throttle a
    # single search. Production takes two in its own file.
    instanceOverrides:
      luna-shopper-backend-catalog-db:
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
        sharedBuffers: 256MB
        workMem: 8MB
        jit: 'off'
    instances:
      - name: luna-shopper-backend-auth-db
        database: luna_auth
        user: luna_auth
        secret: luna-shopper-backend-auth-db-secret
        # Staggered so no two dumps contend for the single node at once (plan
        # 0005, section 3.1). Four windows now, the harvester's last.
        backupSchedule: '17 2 * * *'
        # The key in the application Secret holding this instance's connection
        # string. The backup Job reads it rather than duplicating credentials.
        urlSecretKey: AUTH_DB_URL
      - name: luna-shopper-backend-core-db
        database: luna_core
        user: luna_core
        secret: luna-shopper-backend-core-db-secret
        backupSchedule: '37 2 * * *'
        urlSecretKey: CORE_DB_URL
      - name: luna-shopper-backend-catalog-db
        database: luna_catalog
        user: luna_catalog
        secret: luna-shopper-backend-catalog-db-secret
        backupSchedule: '57 2 * * *'
        urlSecretKey: CATALOG_DB_URL
      # The harvester's own database (plan 0038, section 4.1), the FOURTH of them
      # after auth, core and catalog, gated by the same `harvester.enabled` switch
      # as its service: with the harvester off, this StatefulSet and its 2Gi
      # volume are never created, which is most of what keeping it off a small VPS
      # is worth.
      #
      # The 2Gi claim is sized for catalog discovery's `SourceCatalogEntry` rows
      # and stays that size under store discovery, which needs a fraction of it
      # (k8s plan 0008, section 5). A PVC does not shrink, so sizing it down now
      # would only have to be undone the first time catalog discovery is wanted.
      #
      # `backupSchedule` is not optional here even though the data looks
      # regenerable. Re-running discovery brings the places back; it does not bring
      # back `DiscoveredPlaceStatus`, which records what an admin imported and what
      # they rejected, and a run deliberately does not resurrect a rejected place.
      # Losing that table replays every rejection ever made as new work.
      - name: luna-shopper-backend-harvester-db
        database: luna_harvester
        user: luna_harvester
        secret: luna-shopper-backend-harvester-db-secret
        backupSchedule: '7 3 * * *'
        urlSecretKey: HARVESTER_DB_URL
        optional: harvester

  nats:
    image: nats:2.10-alpine
    storageClassName: local-path
    storageSize: 1Gi
    # The largest message the broker will carry, in bytes (luna plan 0041,
    # section 4.2; luna plan 0045, section 3). NATS defaults to 1 MB, and a voice
    # recording base64'd for the gateway -> assistant hop does not fit in one:
    # 2 MB of audio is about 2.7 MB encoded, and the broker would refuse it at its
    # own level, which is a failure nothing in the service could report nicely.
    #
    # 16 MB, and the largest thing that crosses is what sets it. Two do: a 2 MB
    # voice recording, which is about 2.7 MB base64'd and under 3 MB with its
    # transcript and envelope, and a 10 MB `HarvestDocument`, which crosses whole
    # inside `harvest.spawn` (luna plan 0086, section 6.2). It was 8 MB, which the
    # file import would have sat against with no room for the envelope, so a
    # document the gateway accepted would have been refused a moment later by the
    # broker. `HARVESTER_FILE_IMPORT_MAX_BYTES` and this move as a pair.
    #
    # The headroom above 10 MB is deliberate, for the same reason 8 was chosen
    # over just over 3: this is a broker wide ceiling, and setting it snug against
    # an upload cap means the next change to either number has to move both.
    #
    # **A plain integer, and not "16MB".** The template renders it through `int64`
    # to dodge Sprig's float64 carrying (see `nats.yaml.tpl`), and `int64` applied
    # to a string like "16MB" would parse as 16 — a sixteen byte ceiling that
    # refuses every message the system sends.
    #
    # **It is stated here and applied in two places**: this chart's NATS ConfigMap
    # and `k8s/e2e/luna-shopper-backend/nats.conf`. Raised in one and not the
    # other is a feature that works on the development machine and fails in the
    # cluster.
    maxPayload: 16777216
    # Guaranteed QoS, for the same reason as Postgres above.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Cache, presence store and socket backplane (plan 0028). This is what makes
  # `replicaCount: 2` above honest: without it the socket fan out, presence, the
  # rate limit counters and the JetStream dedupe window are all per pod state
  # that the design assumed was per system.
  #
  # No storageClassName and no storageSize, unlike NATS and Postgres above, and
  # that absence is the decision: nothing held here needs to survive a restart.
  # See the comment in redis.yaml.tpl.
  redis:
    image: redis:7-alpine
    # Set below the memory limit so Redis evicts before the kernel OOM kills it.
    # These two numbers are one decision; move them together.
    maxmemory: 96mb
    maxmemoryPolicy: volatile-lru
    # Guaranteed QoS, for the same reason as NATS above.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # A PriorityClass for the stateful tier (plan 0004, section 2.1). QoS is
  # inferred from resource numbers; this says the intent outright, and eviction
  # and preemption consult both. Deliberately not the built in
  # `system-cluster-critical`, which is reserved for components the cluster
  # itself needs and carries scheduling behaviour intended for those.
  priorityClass:
    enabled: true
    name: luna-stateful
    value: 100000

  # Who runs this deployment, for its privacy policy and Terms (plan 0231,
  # section 5.1). Every entry is empty here, and an empty entry is read from
  # the operator Secret below, which `provision-release.sh --operator-file`
  # writes from a file outside the repository. A self hoster with a private
  # values file may set them here instead; a set entry renders as a literal.
  #
  # Never set them in values.staging.yaml or values.production.yaml: those are
  # in a public repository, and the operator's name is not a repository fact.
  # With all of them empty the gateway answers `published: false`.
  legal:
    secret: luna-shopper-backend-operator
    appName: ''
    controllerName: ''
    contactEmail: ''
    hostingProvider: ''
    emailProvider: ''
    backupProvider: ''
    termsRevision: ''
    privacyRevision: ''

  # Nightly pg_dump per Postgres instance, uploaded to object storage off the
  # node (plan 0005). Off by default. On in production, and on but suspended in
  # staging, where the only dumps are the ones a release task takes before it
  # changes anything (`k8s/release-tasks`).
  #
  # Each environment needs its own bucket. The object keys are
  # `<database>/<stamp>.dump` with no environment in them, so a shared bucket
  # would mix staging dumps into production's `latest`.
  #
  # Requires a Secret (see `secret` below) holding S3_ENDPOINT, S3_BUCKET,
  # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, created out of band exactly like
  # the others. Use a bucket scoped, ideally write only key: a backup credential
  # that can delete its own bucket turns a compromised cluster into a compromised
  # backup.
  #
  # Retention is NOT implemented here. An object storage lifecycle rule expresses
  # "expire after N days" declaratively, runs whether or not the cluster is
  # healthy, and cannot be broken by a bug in a shell script. The rule is 14
  # days on the whole bucket (2026-09-25), which is also how long a release task
  # stays reversible.
  backups:
    enabled: false
    # Renders the CronJobs suspended: no nightly run, but a release task can
    # still start a Job from one.
    suspend: false
    # Documents the bucket's lifecycle rule above, for the privacy policy (plan
    # 0231). It enforces nothing: change the rule and this together.
    retentionDays: 14
    secret: luna-shopper-backend-backup-secret
    # The same image the instance runs, which is what guarantees pg_dump matches
    # the server version. The awscli package is added at Job start.
    image: postgres:16-alpine
    # A missed window (node down at 02:17) still runs when the node returns,
    # within this many seconds.
    startingDeadlineSeconds: 3600
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5

  # Database migrations on deploy (plan 0002, section 5 and 6): a Helm pre
  # upgrade Job per stateful service runs that service's migrations before new
  # pods take traffic, never on app boot / synchronize.
  #
  # On since plan 0027, section 2: each stateful service now emits a real
  # `migrate.js` beside `main.js` from a second webpack entry, so the command
  # below exists inside the image. It used to name a file that was never built,
  # which is why the flag could not simply be flipped: nothing creates the schema
  # on a fresh cluster (every service is `synchronize: false` by design), and the
  # Job as configured would have failed rather than migrated.
  migrations:
    enabled: true
    # Command the Job runs inside the service image.
    command: ['node', 'migrate.js']
