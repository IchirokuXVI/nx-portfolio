# Staging (plan 0002).
#
#   helm upgrade nx-portfolio k8s/helm --namespace nx-portfolio \
#     --values k8s/helm/values.yaml --values k8s/helm/values.staging.yaml
#
# This is passed by .github/workflows/docker-ci.yml against the staging VPS,
# which is a different machine from production reached through
# SSH_DEPLOY_HOST_STAGING. Two clusters, two releases, one chart.
#
# Compare against values.production.yaml: same keys, staging's answers. A key in
# one and not the other should be a decision, not an accident.

baseDomain: staging.ichirokuxvi.com
environment: staging

# velista's own domain, staging half. Same four names as production, one label
# further down: `staging.velista.app` is to `velista.app` what
# `staging.ichirokuxvi.com` is to `ichirokuxvi.com`.
#
# Each is a record of its own. `api.staging.velista.app` is NOT covered by a record
# on `staging.velista.app`, and a wildcard on `*.velista.app` does not reach it
# either: a wildcard matches one label. All four have to exist and resolve to
# `ipAddress` before this deploys, or cert-manager burns Let's Encrypt's failed
# validation budget retrying names that cannot answer.
#
# **All four exist**, `admin.staging.velista.app` included, and each is a CNAME onto
# the apex rather than an A record of its own: `admin.staging.velista.app` is a
# canonical name for `staging.velista.app`, which answers `ipAddress`. That is why
# moving `ipAddress` moves all of them at once and no per name edit is needed here.
# Production is the same shape, `admin.velista.app` onto `velista.app`.
hostOverrides:
  velista: staging.velista.app
  luna-shopper-admin: admin.staging.velista.app
  luna-shopper-backend-gateway: api.staging.velista.app
  luna-shopper-backend-realtime: rt.staging.velista.app

# ---------------------------------------------------------------------------
# The staging VPS address. MUST be set to the new machine's IP before the first
# staging deploy, and the five `*.staging.ichirokuxvi.com` DNS records moved to
# it beforehand (plan 0002, section 4).
#
# Order matters: cert-manager requests a certificate per Gateway listener as soon
# as the chart applies, and Let's Encrypt rate limits FAILED validations far more
# tightly than successful issuances. Deploying before DNS moves burns that quota
# on challenges that cannot succeed. Lower the TTL on the five records a day
# ahead so the cutover is quick.
#
# Left empty rather than guessed: the chart fails the render with a message
# naming this file, which is a better failure than a LoadBalancer sitting
# <pending> forever with everything else looking healthy.
# ---------------------------------------------------------------------------
ipAddress: 152.53.50.209

# Staging tracks the mutable tag CI overwrites on every push to main. The deploy
# rolls the changed deployments so they re-pull it.
imageTag: staging

lunaShopperBackend:
  enabled: true
  config:
    logLevel: debug
    # Three origins, exactly as production, one label down: the portfolio and
    # velista while both are live, plus the back office.
    corsOrigins: https://staging.ichirokuxvi.com,https://staging.velista.app,https://admin.staging.velista.app
    authJwtKid: staging-1
    googleClientId: 256832333234-2oquv8oeb0s65lsnc2tj7u71lnr4iuss.apps.googleusercontent.com
    # Register this URI in the Google console beside the production one. Google
    # matches redirect_uri exactly, so the two are two entries, not a pattern.
    googleCallbackUrl: https://api.staging.velista.app/v1/auth/google/callback
    appBaseUrl: https://staging.velista.app/{locale}
    # Sender on the domain that has mail set up, links on the app's domain, for
    # the reasons spelled out in values.production.yaml.
    mailFrom: Luna Shopper (staging) <no-reply@staging.ichirokuxvi.com>
    smtpHost: in-v3.mailjet.com
    smtpPort: 587
    smtpUser: 497721f71489adfcbc3078d2b292aad8
    # `auth/verify`, and with no locale segment, for the reasons spelled out
    # beside the production pair. `mailResetBaseUrl` is still a placeholder for a
    # page the app does not have.
    mailVerifyBaseUrl: https://staging.velista.app/auth/verify
    mailResetBaseUrl: https://staging.velista.app/reset-password
    # Staging is the natural place to switch tracing on first, once a collector
    # lands in the cluster. Off until then, same as production.

  # The harvester (plan 0038) IS deployed to staging, for store discovery only
  # (k8s plan 0008). This file said staging is where it would go first if it ever
  # went anywhere; this is that.
  #
  # Plan 0063 puts a STORE_DISCOVERY run in the path of an ordinary user adding a
  # postal code, and a service that does not exist in a cluster cannot run there.
  # Nothing in backend plans 0060 through 0064 is observable outside a dev slot
  # until this is on, which is why staging gets it before production rather than
  # alongside it: the point of the soak is to watch real profile edits produce
  # real runs.
  #
  # `harvestEnabled` is the second switch and it has to be true too, or the pod
  # boots, passes its probes and refuses to spawn anything. The queue fills either
  # way, so this being false would simply build a backlog.
  #
  # `mercadonaEnabled` stays false, and this is the section 8.1 separation working
  # as designed rather than a leftover. Store discovery is two requests to
  # OpenStreetMap (one geocode, one Overpass query, once per postal code per
  # thirty day cooldown) and never touches a storefront. Catalog discovery is
  # 4,383 requests into somebody's shop, and it stays a decision of its own to
  # make later, on its own evidence. The double fetch objection this file used to
  # raise is about that second thing: two clusters walking one assortment is twice
  # the requests for one copy of the answer. Two OSM lookups a month for a postal
  # code a real person lives in is a different order of thing, and if the overlap
  # with production ever stops being comfortable the answer is a shared cache, not
  # switching a cluster off.
  #
  # `actorId` is deliberately left empty, which is the base file's value and not
  # an omission here. Store discovery writes `DiscoveredPlace` rows into the
  # harvester's own database and never calls catalog, so it needs no identity;
  # `CatalogClient` is the only thing that reads the uuid and it throws a named
  # error rather than writing anonymously. So a run works and an ADMIN IMPORT of a
  # discovered place into catalog does not, until somebody sets this and adds the
  # same uuid to `config.platformAdminUserIds`. That is the correct order: the
  # exit criteria for this plan want discovery observed and no catalog location
  # created.
  harvester:
    enabled: true
    harvestEnabled: true
    mercadonaEnabled: false

  # The reference catalog, on (plan 0067). This is what staging is for: a
  # deployed environment with real products and real prices to click through, and
  # the normalized groups are what search and the basket composer are exercised
  # against.
  #
  # The harvester above runs store discovery only, so it contributes no products
  # and the seed does not need one. The seed creates the 239 products the receipts
  # name, across all three chains, priced from the receipts. Should a Mercadona
  # harvest ever run here, the same seed adopts those rows by barcode instead of
  # creating a second copy.
  referenceSeed:
    enabled: true

  # No backups in staging. It is disposable by design, and a restore drill is
  # rehearsed here by restoring a PRODUCTION dump into it (plan 0005, section 6),
  # which needs no CronJob of its own.
  backups:
    enabled: false
