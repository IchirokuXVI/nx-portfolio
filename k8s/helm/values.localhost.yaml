# Zero-setup local override for Docker Desktop Kubernetes — "port" variant (default).
#
# Each app is exposed on its own LoadBalancer port, mirroring `nx serve` exactly:
# shell on 4200, remotes on 4201-4204. Docker Desktop publishes each LoadBalancer on
# localhost:<port>, so no hosts-file entries, no admin, and no reverse proxy are
# needed. Because the ports match the remotes' dev-serve ports, the shell image is
# built WITHOUT MFE_BASE_URL: a development build's string remotes already resolve to
# http://localhost:4201..4204, so it finds them with no extra configuration.
#
#   # shell built with no MFE_BASE_URL (plain `nx run shell:build:docker`)
#   helm upgrade --install nx-portfolio k8s/helm \
#     --namespace nx-portfolio --create-namespace \
#     --values k8s/helm/values.yaml --values k8s/helm/values.localhost.yaml
#   # -> open http://localhost:4200
#
# Each remote sits on a distinct origin (port), just like production's separate
# `mfe.` host, so a locale-less deep link such as http://localhost:4200/odontogram
# reaches the shell (which redirects to /en/odontogram) rather than the remote.
#
# Alternatives:
#   - values.localhost-mfe.yaml : single localhost host, remotes under /mfe/<remote>,
#     behind the reverse proxy (shell built with MFE_BASE_URL=http://localhost/mfe).
#   - values.local.yaml         : portfolio.localhost / mfe.localhost hostnames,
#     closest to production, but needs hosts-file entries (admin).

# Use the locally built dev images without reaching for a registry.
productionImageTag: dev
appImagePullPolicy: IfNotPresent

# Port mode exposes each app directly, so the reverse proxy (and its certs / MetalLB
# pool) is not needed.
reverseProxy:
  enabled: false
certbot:
  enabled: false
metallb:
  enabled: false

staging:
  enabled: false

# `lbPort` turns each app's Service into a LoadBalancer on that port (see
# templates/apps/service.yaml.tpl). The ports match each remote's dev-serve port so
# the shell's default development remotes line up.
apps:
  - name: shell
    env: production
    image: nx-portfolio/shell
    lbPort: 4200
  - name: landing
    env: production
    image: nx-portfolio/landing
    lbPort: 4201
  - name: odontogram
    env: production
    image: nx-portfolio/odontogram
    lbPort: 4202
  - name: damoclessword
    env: production
    image: nx-portfolio/damoclessword
    lbPort: 4203
  - name: landingv2
    env: production
    image: nx-portfolio/landingv2
    lbPort: 4204
