namespace: nx-portfolio

# Pull policy for the micro-frontend app images. Production/staging pull the
# freshly pushed images from the registry (Always). A local dev deploy builds the
# images straight into the Docker Desktop image store and overrides this to
# IfNotPresent (or Never) so Kubernetes uses them without a registry.
appImagePullPolicy: Always

# Image tags.
#
# Production apps are pinned to an immutable release version. The live value is
# kept on the deploy host (helm-live/prod-tag.yaml, outside the rsynced path) and
# passed with `-f`, so it survives staging deploys and can be hand-edited. A
# rollback is just re-pinning a previous version whose images still exist.
#
# Staging apps track a mutable tag that CI overwrites on every push to main; the
# staging deploy triggers a rollout restart of the changed apps to re-pull it.
productionImageTag: latest
stagingImageTag: staging

# Staging runs alongside production in the same release/namespace, routed by the
# gateway on its own hostnames. Turn it off to deploy production only.
staging:
  enabled: true

# ---------------------------------------------------------------------------
# Routing (plan 0001). The chart declares WHAT the routes are, as core Gateway
# API objects, and the implementation owns the data plane.
#
# The portability contract: swapping the implementation should mean editing this
# block, plus the one namespace in metallb.serviceNamespaces, and nothing else.
# That holds as long as the templates use only core gateway.networking.k8s.io/v1
# types and in spec `filters`. The single knowing exception is
# templates/gateway/implementation-envoy.yaml.tpl (the realtime timeouts).
#
# The cluster prerequisites (Gateway API CRDs, the implementation, cert-manager,
# the ClusterIssuer) are NOT in this chart. Install them once with
# k8s/bootstrap/install.sh (or install.ps1).
# ---------------------------------------------------------------------------
gateway:
  # The public cluster and the local "mfe-path" / hostnames modes route through
  # the gateway. The local "port" mode instead exposes each app on its own
  # LoadBalancer port (see values.localhost.yaml) and turns this off, which is
  # what keeps it the zero setup path: no bootstrap, no Gateway object.
  enabled: true

  # Read the installed class name from `kubectl get gatewayclass`; the bootstrap
  # script prints it at the end for exactly this reason.
  className: eg

  tls:
    enabled: true
    # Must match a ClusterIssuer the bootstrap created: letsencrypt-prod for the
    # public cluster, selfsigned locally.
    issuer: letsencrypt-prod
    # nginx served plain HTTP unencrypted (one server block for :80 and :443), so
    # redirecting is a behaviour change. On in production, off locally where
    # everything is plain HTTP.
    redirectHttp: true

  # Long lived connection timeout for the routed WebSocket services, carried over
  # from nginx's proxy_read_timeout / proxy_send_timeout. Applied by the one
  # implementation specific template; see implementation-envoy.yaml.tpl.
  websocketTimeout: 3600s

  # Escape hatch for implementation specific annotations on the Gateway. Empty by
  # design; anything landing here is a signal to check whether the core spec
  # covers it first.
  extraAnnotations: {}

# MetalLB IPAddressPool. The public cluster needs it to expose the gateway's data
# plane on the bare-metal IP below. Docker Desktop already surfaces LoadBalancer
# services on localhost, so a local deploy disables the pool (its public IP is not
# routable there and would leave the service pending).
metallb:
  enabled: true
  # Namespaces allowed to claim the pool. The gateway implementation provisions
  # its data plane Service in its OWN namespace, not this chart's, so that
  # namespace needs an entry here or the Service sits <pending> forever and the
  # site never comes up. The failure is silent: `kubectl get svc -n nx-portfolio`
  # looks entirely healthy while nothing is reachable. This is the one value
  # besides gateway.className that must change when swapping implementations.
  serviceNamespaces:
    - nx-portfolio
    - envoy-gateway-system

ipAddress: 46.62.204.230

# Each app is one deployment/service. `env` selects which image tag it uses
# (production -> productionImageTag, staging -> stagingImageTag) and one HTTPRoute
# routes it on `host` under `path`. Image names are the tag-less repo path.
apps:
  # Production - ichirokuxvi.com
  - name: shell
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/shell
    host: ichirokuxvi.com
    path: /
  - name: landing
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/landing
    host: mfe.ichirokuxvi.com
    path: /landing
  - name: odontogram
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/odontogram
    host: mfe.ichirokuxvi.com
    path: /odontogram
  - name: damoclessword
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/damoclessword
    host: mfe.ichirokuxvi.com
    path: /damoclesSword
  - name: landingv2
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/landingv2
    host: mfe.ichirokuxvi.com
    path: /landingV2
  - name: velista
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/velista
    host: mfe.ichirokuxvi.com
    path: /velista
  # Staging - staging.ichirokuxvi.com
  - name: shell-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/shell
    host: staging.ichirokuxvi.com
    path: /
  - name: landing-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/landing
    host: mfe.staging.ichirokuxvi.com
    path: /landing
  - name: odontogram-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/odontogram
    host: mfe.staging.ichirokuxvi.com
    path: /odontogram
  - name: damoclessword-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/damoclessword
    host: mfe.staging.ichirokuxvi.com
    path: /damoclesSword
  - name: landingv2-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/landingv2
    host: mfe.staging.ichirokuxvi.com
    path: /landingV2
  - name: velista-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/velista
    host: mfe.staging.ichirokuxvi.com
    path: /velista

# ---------------------------------------------------------------------------
# Luna Shopper backend (plan 0002).
#
# Long running Node services (gateway, realtime, auth, core), their stateful
# dependencies (two Postgres instances + NATS with JetStream) and the zero
# downtime deploy config (rolling update with a readiness gate, graceful
# shutdown, PodDisruptionBudgets). Kept out of the `apps` list above because the
# shape differs: these carry env/secrets, health probes and PDBs, and only the
# gateway and realtime are public (each gets an HTTPRoute); auth and core
# are internal (ClusterIP, reached over NATS and by the gateway).
#
# Disabled by default: turning it on requires the runtime Secrets to exist (see
# k8s/helm/luna-shopper-backend-secrets.md) and the api./rt. DNS records. Flip to true
# once those are in place. Staging entries additionally honour `staging.enabled`.
# ---------------------------------------------------------------------------
lunaShopperBackend:
  enabled: false

  imagePullPolicy: Always

  # At least two replicas per service so a rolling update (maxUnavailable 0) and a
  # PodDisruptionBudget (minAvailable 1) actually deliver zero downtime: one pod
  # keeps serving while the other is replaced or its node is drained.
  replicaCount: 2

  # Zero downtime knobs (plan 0002, section 6). maxUnavailable 0 + maxSurge 1
  # means a new pod must pass its readiness probe before an old one is removed.
  rollout:
    maxUnavailable: 0
    maxSurge: 1
  # Long enough for in flight requests to drain on SIGTERM before SIGKILL.
  terminationGracePeriodSeconds: 30
  # Node maintenance may never take the last replica of a service.
  pdb:
    minAvailable: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Non secret config, rendered into a ConfigMap per environment. Secret values
  # (DB URLs, JWT keys, OAuth secret, SMTP password) live in a separate, pre
  # created Secret per environment; see luna-shopper-backend-secrets.md.
  config:
    production:
      natsUrl: nats://luna-shopper-backend-nats:4222
      logLevel: info
      corsOrigins: https://ichirokuxvi.com
      authJwtKid: prod-1
      accessTokenTtl: 15m
      refreshTokenTtl: 30d
      googleClientId: ''
      # The path the gateway actually serves: its controllers are versioned, so
      # the callback lives under /v1. It must match a URI pre-registered with
      # Google exactly, which is why it is spelled out rather than derived.
      googleCallbackUrl: https://api.ichirokuxvi.com/v1/auth/google/callback
      # Where the Google callback hands the browser back (plan 0023, section 3.4).
      # `{locale}` is substituted with the locale the flow started in; the app is
      # mounted after the locale segment, so a plain prefix cannot express it.
      appBaseUrl: https://ichirokuxvi.com/{locale}/velista
      smtpHost: ''
      smtpPort: '587'
      smtpUser: ''
      mailFrom: Luna Shopper <no-reply@ichirokuxvi.com>
      mailVerifyBaseUrl: https://ichirokuxvi.com/verify-email
      mailResetBaseUrl: https://ichirokuxvi.com/reset-password
      # Comma-separated user ids allowed to write the catalog (plan 0012). Set to
      # the app owner's registered user id; empty means no one can write.
      platformAdminUserIds: ''
      # Telemetry (plan 0016). Tracing stays off until a collector exists in the
      # cluster (section 8): with no endpoint no exporter is constructed and no
      # network call is attempted, so the services run exactly as they do today.
      # Turning it on is a values change and a `helm upgrade`, not a new image.
      otelEnabled: false
      otelExporterEndpoint: ''
      # Full sampling is right while traffic is small; lower it if the volume
      # ever costs something. Parent based, so it only decides at a trace root.
      otelSamplerArg: 1
      # /metrics on each service's health port, reachable inside the cluster
      # only. It costs nothing until something scrapes it.
      metricsEnabled: true
    staging:
      natsUrl: nats://luna-shopper-backend-nats:4222
      logLevel: debug
      corsOrigins: https://staging.ichirokuxvi.com
      authJwtKid: staging-1
      accessTokenTtl: 15m
      refreshTokenTtl: 30d
      googleClientId: ''
      googleCallbackUrl: https://api.staging.ichirokuxvi.com/v1/auth/google/callback
      appBaseUrl: https://staging.ichirokuxvi.com/{locale}/velista
      smtpHost: ''
      smtpPort: '587'
      smtpUser: ''
      mailFrom: Luna Shopper (staging) <no-reply@staging.ichirokuxvi.com>
      mailVerifyBaseUrl: https://staging.ichirokuxvi.com/verify-email
      mailResetBaseUrl: https://staging.ichirokuxvi.com/reset-password
      platformAdminUserIds: ''
      # Telemetry (plan 0016). Same posture as production; staging is the natural
      # place to switch tracing on first once a collector lands.
      otelEnabled: false
      otelExporterEndpoint: ''
      otelSamplerArg: 1
      metricsEnabled: true

  # Each backend service: one Deployment + Service (+ PDB). `routed` services get
  # an HTTPRoute on `host`; the rest are ClusterIP only. `websocket` additionally
  # earns the one implementation specific timeout policy. `role`
  # drives which env vars (and thus which secret keys) the pod receives, so only
  # the auth pod ever sees the JWT private key. Images are the tag-less repo path;
  # the tag comes from productionImageTag/stagingImageTag like the apps above.
  services:
    # Production
    - name: luna-shopper-backend-gateway
      role: gateway
      env: production
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-gateway
      port: 3000
      routed: true
      host: api.ichirokuxvi.com
      websocket: false
    - name: luna-shopper-backend-realtime
      role: realtime
      env: production
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-realtime
      port: 3001
      routed: true
      host: rt.ichirokuxvi.com
      websocket: true
    - name: luna-shopper-backend-auth
      role: auth
      env: production
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-auth
      port: 3002
      routed: false
    - name: luna-shopper-backend-core
      role: core
      env: production
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-core
      port: 3003
      routed: false
    - name: luna-shopper-backend-catalog
      role: catalog
      env: production
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-catalog
      port: 3004
      routed: false
    # Staging
    - name: luna-shopper-backend-gateway-staging
      role: gateway
      env: staging
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-gateway
      port: 3000
      routed: true
      host: api.staging.ichirokuxvi.com
      websocket: false
    - name: luna-shopper-backend-realtime-staging
      role: realtime
      env: staging
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-realtime
      port: 3001
      routed: true
      host: rt.staging.ichirokuxvi.com
      websocket: true
    - name: luna-shopper-backend-auth-staging
      role: auth
      env: staging
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-auth
      port: 3002
      routed: false
    - name: luna-shopper-backend-core-staging
      role: core
      env: staging
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-core
      port: 3003
      routed: false
    - name: luna-shopper-backend-catalog-staging
      role: catalog
      env: staging
      image: ghcr.io/ichirokuxvi/nx-portfolio/luna-shopper-backend-catalog
      port: 3004
      routed: false

  # Stateful dependencies. Two Postgres instances (auth owns one, core the other,
  # so the no shared database rule holds) and one NATS server with JetStream on a
  # persistent volume so streams survive a restart. Production and staging share
  # these instances but use separate logical databases / stream prefixes via the
  # per environment Secret; fully separate instances per environment is a later
  # refinement. The postgres password comes from each instance's pre created
  # Secret (see luna-shopper-backend-secrets.md).
  postgres:
    image: postgres:16-alpine
    storageClassName: local-path
    storageSize: 2Gi
    instances:
      - name: luna-shopper-backend-auth-db
        database: luna_auth
        user: luna_auth
        secret: luna-shopper-backend-auth-db-secret
      - name: luna-shopper-backend-core-db
        database: luna_core
        user: luna_core
        secret: luna-shopper-backend-core-db-secret
      - name: luna-shopper-backend-catalog-db
        database: luna_catalog
        user: luna_catalog
        secret: luna-shopper-backend-catalog-db-secret

  nats:
    image: nats:2.10-alpine
    storageClassName: local-path
    storageSize: 1Gi

  # Database migrations on deploy (plan 0002, section 5 and 6): a Helm pre upgrade
  # Job per stateful service runs that service's `migration:run` before new pods
  # take traffic, never on app boot / synchronize. Disabled until the services
  # ship a migration entrypoint (TypeORM lands in plan 0005+); flip on then.
  migrations:
    enabled: false
    # Command the Job runs inside the service image once migrations exist.
    command: ['node', 'migrate.js']
