namespace: nx-portfolio
replicaCount: 1

# Pull policy for the micro-frontend app images. Production/staging pull the
# freshly pushed images from the registry (Always). A local dev deploy builds the
# images straight into the Docker Desktop image store and overrides this to
# IfNotPresent (or Never) so Kubernetes uses them without a registry.
appImagePullPolicy: Always

# Image tags.
#
# Production apps are pinned to an immutable release version. The live value is
# kept on the deploy host (helm-live/prod-tag.yaml, outside the rsynced path) and
# passed with `-f`, so it survives staging deploys and can be hand-edited. A
# rollback is just re-pinning a previous version whose images still exist.
#
# Staging apps track a mutable tag that CI overwrites on every push to main; the
# staging deploy triggers a rollout restart of the changed apps to re-pull it.
productionImageTag: latest
stagingImageTag: staging

# Staging runs alongside production in the same release/namespace, routed by the
# reverse proxy on its own hostnames. Turn it off to deploy production only.
staging:
  enabled: true

proxyImage:
  image: nginx
  pullPolicy: Always
  tag: 'latest'

certbotImage:
  image: ghcr.io/ichirokuxvi/nx-portfolio/certbot
  pullPolicy: Always
  tag: 'latest'

# Certbot sidecar (Let's Encrypt). Enabled for the public environments. A local
# deploy turns this off: the hosts have no public DNS/A record, so ACME would only
# fail and burn rate limits. The init container's self-signed dummy certs are
# enough for nginx to start and serve TLS locally.
certbot:
  enabled: true

# MetalLB IPAddressPool. The public cluster needs it to expose the reverse proxy
# on the bare-metal IP below. Docker Desktop already surfaces LoadBalancer
# services on localhost, so a local deploy disables the pool (its public IP is not
# routable there and would leave the service pending).
metallb:
  enabled: true

certsVolume:
  claimName: certs-pvc
  # StorageClass for the shared certs PVC. Defaults to the k3s dynamic provisioner
  # used in the public cluster; a local deploy overrides it to the cluster's own
  # default class (e.g. Docker Desktop's `hostpath`). Empty string uses the
  # cluster default.
  storageClassName: local-path

ipAddress: 46.62.204.230

# Each app is one deployment/service. `env` selects which image tag it uses
# (production -> productionImageTag, staging -> stagingImageTag) and the reverse
# proxy routes it on `host` under `path`. Image names are the tag-less repo path.
apps:
  # Production - ichirokuxvi.com
  - name: shell
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/shell
    host: ichirokuxvi.com
    path: /
  - name: landing
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/landing
    host: mfe.ichirokuxvi.com
    path: /landing
  - name: odontogram
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/odontogram
    host: mfe.ichirokuxvi.com
    path: /odontogram
  - name: damoclessword
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/damoclessword
    host: mfe.ichirokuxvi.com
    path: /damoclesSword
  - name: landingv2
    env: production
    image: ghcr.io/ichirokuxvi/nx-portfolio/landingv2
    host: mfe.ichirokuxvi.com
    path: /landingV2
  # Staging - staging.ichirokuxvi.com
  - name: shell-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/shell
    host: staging.ichirokuxvi.com
    path: /
  - name: landing-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/landing
    host: mfe.staging.ichirokuxvi.com
    path: /landing
  - name: odontogram-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/odontogram
    host: mfe.staging.ichirokuxvi.com
    path: /odontogram
  - name: damoclessword-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/damoclessword
    host: mfe.staging.ichirokuxvi.com
    path: /damoclesSword
  - name: landingv2-staging
    env: staging
    image: ghcr.io/ichirokuxvi/nx-portfolio/landingv2
    host: mfe.staging.ichirokuxvi.com
    path: /landingV2
