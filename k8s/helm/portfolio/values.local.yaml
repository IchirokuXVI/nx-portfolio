# Local development override for Docker Desktop Kubernetes.
#
# Deploy with:
#   helm dependency build --skip-refresh k8s/helm/portfolio
#   helm upgrade --install portfolio k8s/helm/portfolio \
#     --namespace portfolio --create-namespace \
#     --values k8s/helm/portfolio/values.yaml \
#     --values k8s/helm/portfolio/values.local.yaml
#
# Assumes the images were built locally with `--configuration=development`, so
# they carry the `dev` tag and live unprefixed in the Docker Desktop image store
# (nx-portfolio/<app>:dev). Add these hosts to your machine's hosts file, all on
# 127.0.0.1 (Docker Desktop exposes the LoadBalancer there). Editing the hosts
# file needs administrator rights:
#   127.0.0.1 portfolio.localhost mfe.localhost
#
# The shell image must be built with MFE_BASE_URL=http://mfe.localhost so it loads
# its remotes through the gateway on the local micro-frontend host.
#
# Chrome and Edge resolve *.localhost to loopback internally, so the browser may
# reach these hosts with no hosts file entry. The Windows resolver does not, so
# curl, Node and Playwright still need the entries above.
#
# If you cannot edit the hosts file, use values.localhost.yaml instead: it serves
# everything on `localhost` ports, with no admin rights and no DNS changes.

# Use the locally built dev images without reaching for a registry.
imageTag: dev
appImagePullPolicy: IfNotPresent

# Route through the gateway, with self signed certificates: the hosts have no
# public DNS, so ACME would only fail and burn rate limits. Same objects as
# production, only the issuer differs.
#
# Requires the cluster bootstrap once:
#   ./k8s/bootstrap/install.ps1 -Issuer selfsigned
gateway:
  enabled: true
  className: eg
  tls:
    enabled: true
    issuer:
      kind: ClusterIssuer
      name: selfsigned
      create: false
    # Everything here is plain HTTP; redirecting would just break it.
    redirectHttp: false

# No velista here: the local files deploy the portfolio alone, and a
# development shell answers `/velista` with its not found page.
externalRoutes: []

apps:
  - name: shell
    image: nx-portfolio/shell
    host: portfolio.localhost
    path: /
  - name: odontogram
    image: nx-portfolio/odontogram
    host: mfe.localhost
    path: /odontogram
  - name: damoclessword
    image: nx-portfolio/damoclessword
    host: mfe.localhost
    path: /damoclesSword
  - name: landingv2
    image: nx-portfolio/landingv2
    host: mfe.localhost
    path: /landingV2
