# Production served from the home machine, for the window between losing the VPS
# and the netcup box being provisioned.
#
#   ./k8s/helm/deploy-homelab.sh 0.1.1
#
# Do not run `helm upgrade` against this file by hand. The version being served
# is an argument, not a value in this file, exactly as on the VPS: the script
# passes it as `--set imageTag`, which is what makes rolling between releases one
# command. See section 7 of k8s/README-homelab.md.
#
# This is the real production domain running the SAME published images the VPS
# ran. It is NOT one of the three localhost files: those serve `localhost` with
# self signed certificates, and their `apps` lists predate both velista and the
# Luna Shopper backend, so all three would put up a site missing half the system.
#
# Read k8s/README-homelab.md before the first deploy. Two prerequisites are not
# in this file and cannot be: ports 80 and 443 have to reach this machine, and
# the ichirokuxvi.com records have to point at its public address (docker/ddns
# keeps them there as it changes).
#
# Delete this file's deploy the day netcup is ready. It is a bridge, not a fourth
# environment.

baseDomain: ichirokuxvi.com

# Production, because that is what this is serving. Telemetry only; nothing in
# the chart branches on it.
environment: production

# ---------------------------------------------------------------------------
# Images.
#
# Note what is NOT here: no `apps` list and no `lunaShopperBackend.services`
# list. Both are inherited from values.yaml, which means this deploy pulls
# ghcr.io/ichirokuxvi/nx-portfolio/* exactly as the VPS did. The images running
# at home are the identical artefacts CI built, tested and published, so this
# window is not an untested build of anything, and moving to netcup is a change
# of address rather than a change of software.
#
# That is also why nothing here is built locally. Your machine's `nx build`
# output never reaches this deploy, so ordinary development cannot alter what the
# public site serves.
#
# `latest` is only the floor. deploy-homelab.sh overrides it with the release
# version on every deploy, so a bare `helm upgrade` with this file still deploys
# something coherent rather than nothing.
# ---------------------------------------------------------------------------
imageTag: latest

# IfNotPresent, where both clusters use Always, and the difference is deliberate.
#
# Release tags are immutable: 0.1.1 is one set of digests forever, so re-checking
# the registry on every pod start buys nothing. What it costs is availability. A
# pod restarting during a network blip, an expired token or a ghcr.io incident
# cannot start under Always even though the exact image is already on disk. On a
# domestic line with no out of hours operator, degrading gracefully is worth more
# than freshness this deploy cannot use.
#
# The one thing to remember: re-deploying the SAME version after force pushing a
# different image to that tag will not pick up the change. Do not do that. Cut a
# new release instead, which is what the tag being immutable means.
appImagePullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Registry credentials.
#
# The VPS authenticated to ghcr.io at the node level, so neither cluster values
# file sets this. This machine has no such credential, and if the packages are
# private every pod fails as ImagePullBackOff with an authentication error that
# names no fix.
#
# Create the Secret once with a GitHub personal access token carrying only
# read:packages:
#
#   kubectl -n nx-portfolio create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=IchirokuXVI \
#     --docker-password=<token with read:packages>
#
# Harmless to leave set if the packages are public: Kubernetes simply does not
# need it. Cheaper than diagnosing the failure it prevents.
# ---------------------------------------------------------------------------
imagePullSecrets:
  - ghcr-pull

# ---------------------------------------------------------------------------
# Routing.
#
# The same objects production uses. The only difference from
# values.production.yaml is that MetalLB is off: it exists to advertise a VPS's
# public address on a bare metal network, and here the LoadBalancer Service is
# published on the host by Docker Desktop instead. Leaving it on would ask for an
# address this machine does not own.
# ---------------------------------------------------------------------------
gateway:
  enabled: true
  className: eg
  tls:
    enabled: true
    # letsencrypt-dns01 rather than letsencrypt-prod. A home line usually cannot
    # complete an HTTP-01 challenge: many Spanish ISPs block inbound port 80, and
    # behind CGNAT it cannot work at all. DNS-01 proves control of the domain
    # through the Cloudflare API instead, needs no inbound connection, and reuses
    # the token docker/ddns already holds.
    #
    # Create it once with k8s/bootstrap/cluster-issuer-dns01.sh. Switch this to
    # letsencrypt-prod only if you have confirmed port 80 reaches this machine
    # from the public internet.
    issuer: letsencrypt-dns01
    redirectHttp: true

metallb:
  enabled: false

# ---------------------------------------------------------------------------
# Luna Shopper backend.
#
# On, because velista is useless without it: the account pages, the lists and the
# realtime session all terminate here. Turning it on still requires the six
# Secrets, so run this first and only once:
#
#   ./k8s/bootstrap/provision-release.sh --env production
#
# The script is cluster agnostic. It needs kubectl pointed at this cluster and
# openssl on PATH, and it generates its own passwords and JWT keypair, so the
# credentials here are this machine's own and share nothing with the VPS that is
# gone.
# ---------------------------------------------------------------------------
lunaShopperBackend:
  enabled: true

  # Same reasoning as appImagePullPolicy above.
  imagePullPolicy: IfNotPresent

  config:
    logLevel: info
    corsOrigins: https://ichirokuxvi.com,https://velista.ichirokuxvi.com
    authJwtKid: prod-1
    googleCallbackUrl: https://api.ichirokuxvi.com/v1/auth/google/callback
    appBaseUrl: https://velista.ichirokuxvi.com/{locale}
    mailFrom: Luna Shopper <no-reply@ichirokuxvi.com>
    mailVerifyBaseUrl: https://ichirokuxvi.com/verify-email
    mailResetBaseUrl: https://ichirokuxvi.com/reset-password

  # Off, and this is the one real regression against the VPS deploy. The nightly
  # dump needs the S3 credentials in luna-shopper-backend-backup-secret, which
  # this machine has no reason to hold for a few days. Take a manual dump before
  # migrating to netcup rather than trusting that this window produced one; see
  # section 10 of k8s/README-homelab.md.
  backups:
    enabled: false
