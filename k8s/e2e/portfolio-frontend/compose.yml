# e2e stack that mirrors the Kubernetes reverse-proxy topology with the actual
# published images, so the exact staging shell (which bakes the staging MFE host)
# and remotes are tested unchanged. Used by .github/workflows/docker-ci.yml, and
# runnable locally too:
#
#   echo "127.0.0.1 staging.ichirokuxvi.com mfe.staging.ichirokuxvi.com" | sudo tee -a /etc/hosts
#   docker login ghcr.io   # to pull the private images
#   docker compose -f k8s/e2e/portfolio-frontend/compose.yml up -d --pull always
#   E2E_BASE_URL=https://staging.ichirokuxvi.com \
#     npx playwright test -c apps/damoclesSword-e2e/playwright.config.ts --project=chromium
#   docker compose -f k8s/e2e/portfolio-frontend/compose.yml down -v
#
# Override E2E_IMAGE_PREFIX / E2E_IMAGE_TAG to point at other images (e.g. a release
# version instead of the mutable `staging` tag).
name: nx-portfolio-e2e

services:
  # Generates self-signed certs for the two hosts (nginx needs them to start).
  certs:
    image: alpine:latest
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        for domain in staging.ichirokuxvi.com mfe.staging.ichirokuxvi.com; do
          if [ ! -f "/certs/$$domain.crt" ]; then
            openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout "/certs/$$domain.key" -out "/certs/$$domain.crt" \
              -subj "/CN=$$domain"
          fi
        done
    volumes:
      - certs:/certs

  reverse-proxy:
    image: nginx:latest
    depends_on:
      certs:
        condition: service_completed_successfully
      shell:
        condition: service_started
      landing:
        condition: service_started
      odontogram:
        condition: service_started
      damoclessword:
        condition: service_started
      landingv2:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro

  shell:
    image: ${E2E_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/shell:${E2E_IMAGE_TAG:-staging}
  landing:
    image: ${E2E_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/landing:${E2E_IMAGE_TAG:-staging}
  odontogram:
    image: ${E2E_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/odontogram:${E2E_IMAGE_TAG:-staging}
  damoclessword:
    image: ${E2E_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/damoclessword:${E2E_IMAGE_TAG:-staging}
  landingv2:
    image: ${E2E_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/landingv2:${E2E_IMAGE_TAG:-staging}

volumes:
  certs:
