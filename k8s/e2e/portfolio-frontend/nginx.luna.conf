# The two backend hosts of the browser gate (velista plan 0080). Included by
# nginx.conf from /etc/nginx/luna/*.conf, and mounted there by compose.luna.yml;
# without that overlay the include matches nothing and this file is not read.
#
# Both forward to the host machine, where `stack.sh e2e-up` has the gateway and
# realtime images published on :3000 and :3001. Those are the tier 2 defaults on
# a runner that has the machine to itself; a slotted worktree publishes other
# ports and would edit these two lines, which is why each is stated once.
#
# Both hosts are on `.app`, which is HSTS preloaded, so a browser only ever uses
# the ssl listener; the plain one is kept for curl and for symmetry with the
# base file.

# A websocket upgrade forwards its Connection header; anything else gets a plain
# keep-alive connection to the upstream. Socket.IO starts on long polling and
# upgrades from there, so both shapes reach the realtime host on one location.
map $http_upgrade $luna_connection_upgrade {
  default upgrade;
  '' '';
}

# The gateway: REST and the SSE stream. Buffering is off so an event stream
# reaches the browser as it is written rather than when nginx feels like it,
# and the read timeout is long for the same reason.
server {
  listen 80;
  listen 443 ssl;
  server_name api.staging.velista.app;

  ssl_certificate     /etc/nginx/certs/api.staging.velista.app.crt;
  ssl_certificate_key /etc/nginx/certs/api.staging.velista.app.key;

  location / {
    proxy_pass http://host.docker.internal:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $luna_connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}

# Realtime: Socket.IO, so the upgrade headers are the whole point of the block.
server {
  listen 80;
  listen 443 ssl;
  server_name rt.staging.velista.app;

  ssl_certificate     /etc/nginx/certs/rt.staging.velista.app.crt;
  ssl_certificate_key /etc/nginx/certs/rt.staging.velista.app.key;

  location / {
    proxy_pass http://host.docker.internal:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $luna_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
