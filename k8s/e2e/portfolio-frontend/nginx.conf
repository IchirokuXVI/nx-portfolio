# This stack is Docker Compose, not Kubernetes, and it keeps nginx on purpose: it
# exists to test the published IMAGES (the shell's baked MFE host, each remote's
# static server headers), not the cluster's routing layer, which moved to the
# Gateway API in k8s/plans/0001.
#
# The prefix stripping below must stay equivalent to the HTTPRoute URLRewrite
# filters in k8s/helm/templates/gateway/httproute.yaml.tpl, so a change to one is a
# prompt to check the other.

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Shell host. The staging shell image is served here unchanged.
  server {
    listen 80;
    listen 443 ssl;
    server_name staging.ichirokuxvi.com;

    ssl_certificate     /etc/nginx/certs/staging.ichirokuxvi.com.crt;
    ssl_certificate_key /etc/nginx/certs/staging.ichirokuxvi.com.key;

    location / {
      proxy_pass http://shell:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Micro-frontend host. The staging shell bakes https://mfe.staging.ichirokuxvi.com,
  # so it loads each remote from here (the CORS + content-type headers come straight
  # from each remote's own static server).
  server {
    listen 80;
    listen 443 ssl;
    server_name mfe.staging.ichirokuxvi.com;

    ssl_certificate     /etc/nginx/certs/mfe.staging.ichirokuxvi.com.crt;
    ssl_certificate_key /etc/nginx/certs/mfe.staging.ichirokuxvi.com.key;

    location /landing {
      rewrite ^/landing/?(.*)$ /$1 break;
      proxy_pass http://landing:80;
      proxy_set_header Host $host;
    }
    location /odontogram {
      rewrite ^/odontogram/?(.*)$ /$1 break;
      proxy_pass http://odontogram:80;
      proxy_set_header Host $host;
    }
    location /damoclesSword {
      rewrite ^/damoclesSword/?(.*)$ /$1 break;
      proxy_pass http://damoclessword:80;
      proxy_set_header Host $host;
    }
    location /landingV2 {
      rewrite ^/landingV2/?(.*)$ /$1 break;
      proxy_pass http://landingv2:80;
      proxy_set_header Host $host;
    }
  }

  # velista's own host. It is both a remote and a standalone app (velista plan 0013),
  # so it is served from the root of its own origin and there is no prefix to strip:
  # the shell asks this host for /remoteEntry.mjs directly. `values.yaml` gives it
  # `path: /` for the same reason.
  #
  # The host is on `.app`, which is HSTS preloaded: a browser rewrites every request
  # to https and offers no way past a certificate warning, so the plain `listen 80`
  # below is never what a browser uses here and the self signed certificate cannot be
  # clicked through by hand. The Playwright projects set `ignoreHTTPSErrors`, which is
  # what makes the suites work against it; poking at it manually needs curl -k, or the
  # certificate trusted locally.
  server {
    listen 80;
    listen 443 ssl;
    server_name staging.velista.app;

    ssl_certificate     /etc/nginx/certs/staging.velista.app.crt;
    ssl_certificate_key /etc/nginx/certs/staging.velista.app.key;

    location / {
      proxy_pass http://velista:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
