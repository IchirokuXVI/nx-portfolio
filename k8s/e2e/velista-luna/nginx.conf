# The proxy of the velista-luna gate. It keeps nginx for the reason the
# portfolio-frontend gate does: it tests the published image, not the cluster's
# routing layer. The /velista block must stay equivalent to HTTPRoute
# `velista-portfolio` (k8s/helm/common/templates/_app.tpl, externalRoutes).

user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # The backend hosts of velista-luna-e2e (velista plan 0080). compose.luna.yml
  # mounts nginx.luna.conf here. A wildcard include with no match is not an
  # error to nginx, so the base stack starts without it.
  include /etc/nginx/luna/*.conf;

  # velista's own origin, served from the root with no prefix (velista plan
  # 0165). The host is on `.app`, which is HSTS preloaded, so the Playwright
  # projects set `ignoreHTTPSErrors` and curl needs -k.
  server {
    listen 80;
    listen 443 ssl;
    server_name staging.velista.app;

    ssl_certificate     /etc/nginx/certs/staging.velista.app.crt;
    ssl_certificate_key /etc/nginx/certs/staging.velista.app.key;

    location / {
      proxy_pass http://velista:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # A portfolio shaped host that answers only /velista, with the prefix kept as
  # the HTTPRoute keeps it. velista's nginx serves the prefix and rewrites the
  # document's base (velista plan 0165 D2).
  server {
    listen 80;
    listen 443 ssl;
    server_name staging.ichirokuxvi.com;

    ssl_certificate     /etc/nginx/certs/staging.ichirokuxvi.com.crt;
    ssl_certificate_key /etc/nginx/certs/staging.ichirokuxvi.com.key;

    location = /velista {
      proxy_pass http://velista:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /velista/ {
      proxy_pass http://velista:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      return 404;
    }
  }
}
