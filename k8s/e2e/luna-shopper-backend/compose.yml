# Luna Shopper local development stack (plan 0002, section 2).
#
# Dev only. It brings up the backing services the four Luna Shopper apps need so
# they can be run locally with `nx serve luna-shopper-backend-<svc>` against real
# dependencies. It deliberately does NOT run the apps themselves: those are built
# and served by Nx, which gives fast rebuilds and debugging.
#
# Run it from this folder (or point -f at it). nx serve runs from the workspace
# root and reaches these on localhost, so the compose file's location does not
# matter to the services:
#
#   docker compose -f k8s/e2e/luna-shopper-backend/compose.yml up -d
#   cp apps/luna-shopper-backend/.env.luna-shopper-backend.example \
#      apps/luna-shopper-backend/.env.luna-shopper-backend   # then fill in the keypair
#   npx nx serve luna-shopper-backend-auth      # and gateway / core / realtime
#
# There are two separate Postgres instances on purpose: auth and core each own a
# private database and never share one, so the "no shared database" rule holds
# even locally. Redis is intentionally absent for now (plan 0001, 2.4); it joins
# this stack when the cache/backplane is introduced.

# The project name (container/network/volume namespace) is overridable so that
# several git worktrees can each run a fully isolated copy of this stack at the
# same time. Set COMPOSE_PROJECT_NAME (and the matching LUNA_*_PORT overrides)
# to a per worktree "slot"; see parallel-worktree-testing.md. Left unset, every
# default below reproduces the original single stack workflow unchanged.
name: ${COMPOSE_PROJECT_NAME:-luna-shopper-backend}

services:
  # Auth service database.
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luna_auth
      POSTGRES_PASSWORD: luna_auth
      POSTGRES_DB: luna_auth
    ports:
      - '${LUNA_AUTH_DB_PORT:-5432}:5432'
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luna_auth']
      interval: 5s
      timeout: 5s
      retries: 10

  # Core service database. A separate instance (and a separate port) from auth.
  core-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luna_core
      POSTGRES_PASSWORD: luna_core
      POSTGRES_DB: luna_core
    ports:
      - '${LUNA_CORE_DB_PORT:-5433}:5432'
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luna_core']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catalog service database. A separate instance (and port) from auth and core,
  # so the "no shared database" rule holds even locally (plan 0012).
  catalog-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luna_catalog
      POSTGRES_PASSWORD: luna_catalog
      POSTGRES_DB: luna_catalog
    ports:
      - '${LUNA_CATALOG_DB_PORT:-5434}:5432'
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luna_catalog']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Opt-in test databases (plan 0013, section 3.1) -----------------------
  # A dedicated database per service so a test run never touches the developer's
  # own dev data. They are gated behind the `test` profile, so a plain `up` never
  # starts them; bring them up with:
  #   docker compose --profile test -f k8s/e2e/luna-shopper-backend/compose.yml up -d
  # Then run any db target with LUNA_ENV=test (which loads each .env.test). A
  # separate instance and port per service keeps the "no shared database" rule.
  auth-db-test:
    image: postgres:16-alpine
    profiles: ['test']
    restart: unless-stopped
    environment:
      POSTGRES_USER: luna_auth
      POSTGRES_PASSWORD: luna_auth
      POSTGRES_DB: luna_auth_test
    ports:
      - '${LUNA_AUTH_DB_TEST_PORT:-5442}:5432'
    volumes:
      - auth-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luna_auth']
      interval: 5s
      timeout: 5s
      retries: 10

  core-db-test:
    image: postgres:16-alpine
    profiles: ['test']
    restart: unless-stopped
    environment:
      POSTGRES_USER: luna_core
      POSTGRES_PASSWORD: luna_core
      POSTGRES_DB: luna_core_test
    ports:
      - '${LUNA_CORE_DB_TEST_PORT:-5443}:5432'
    volumes:
      - core-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luna_core']
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db-test:
    image: postgres:16-alpine
    profiles: ['test']
    restart: unless-stopped
    environment:
      POSTGRES_USER: luna_catalog
      POSTGRES_PASSWORD: luna_catalog
      POSTGRES_DB: luna_catalog_test
    ports:
      - '${LUNA_CATALOG_DB_TEST_PORT:-5444}:5432'
    volumes:
      - catalog-db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luna_catalog']
      interval: 5s
      timeout: 5s
      retries: 10

  # Message broker with JetStream enabled from day one (durable streams, at least
  # once delivery, replay). The store directory is a named volume so streams
  # survive a restart, mirroring the persistent volume the cluster uses.
  #   4222 client / 8222 monitoring
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '${LUNA_NATS_PORT:-4222}:4222'
      - '${LUNA_NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    # `docker compose up --wait` blocks on healthchecks, and it is what the stack
    # targets and both CI tiers use instead of a sleep (plan 0015, section 4).
    # Without a check here compose calls NATS started the moment the container
    # runs, and a migration or a service can connect to a broker that is not
    # listening yet — exactly the intermittent flake that gets a CI suite
    # disabled. `/healthz` on the monitoring port is the broker's own answer to
    # "am I ready"; wget is BusyBox's, from the alpine base.
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:8222/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP catcher so confirmation emails are viewable without a real
  # provider. Mailpit is the maintained drop in for Mailhog.
  #   1025 SMTP / 8025 web UI (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${LUNA_SMTP_PORT:-1025}:1025'
      - '${LUNA_MAILPIT_UI_PORT:-8025}:8025'

volumes:
  auth-db-data:
  core-db-data:
  catalog-db-data:
  auth-db-test-data:
  core-db-test-data:
  catalog-db-test-data:
  nats-data:
