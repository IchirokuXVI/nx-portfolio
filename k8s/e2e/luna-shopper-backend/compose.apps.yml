# Tier 2 overlay: the Luna Shopper services as their BUILT IMAGES, on top of the
# infrastructure in compose.yml (plan 0015, section 2).
#
# Five of the six here. The harvester is absent on purpose: it is off in both
# clusters (plan 0038) and a run is eighteen minutes of fetching from a third
# party, which is not something a stack boot should be able to start.
#
# Tier 1 (the pull request gate) runs the services as plain `node dist/.../main.js`
# processes, which is fast and tests everything except the image itself. This
# overlay is the other half: it runs the image, so the things only an image can
# get wrong are covered — entrypoint, non root user, the runtime `npm install`,
# baked config, and SIGTERM reaching PID 1. `docker-ci.yml` already builds these
# images on the way to staging, so running the suite against them before the
# `helm upgrade` costs the stack boot and the suite, not a rebuild, and it turns
# the staging deploy into a gated one.
#
# It is an overlay, never a standalone file, so compose.yml stays the single
# definition of what the infrastructure IS:
#
#   docker compose -f k8s/e2e/luna-shopper-backend/compose.yml \
#                  -f k8s/e2e/luna-shopper-backend/compose.apps.yml up -d --wait
#
# Inside the compose network the services reach each other and the backing
# services by compose service name on their INTERNAL ports, so the host port
# offsets a worktree slot applies are irrelevant here. Only the published ports
# (which the Playwright suite on the host talks to) follow the slot.
#
# Migrations are NOT run by this file. They are applied from the checkout against
# the published database ports, the same way `stack.sh up` does it, because the
# migration CLI is a repo tool rather than something baked into the images.
#
# Override LUNA_IMAGE_PREFIX / LUNA_IMAGE_TAG to point at other images (a release
# version instead of the mutable `staging` tag).

services:
  gateway:
    image: ${LUNA_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/luna-shopper-backend-gateway:${LUNA_IMAGE_TAG:-staging}
    restart: 'no'
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      # Required, not optional (plan 0028, section 5): the gateway validates it at
      # boot and refuses to start without it, because a gateway that comes up with
      # no working rate limiter is worse than one that does not come up. Compose
      # service name and internal port, like NATS above, since the host port a
      # worktree slot publishes is irrelevant inside this network.
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
      # Both front end origins, as luna-slot.sh already allows: the portfolio
      # shell, which mounts velista as a remote, and velista's own origin,
      # which is where a confirmation link now lands (MAIL_VERIFY_BASE_URL
      # below) and so is an origin this stack has to answer.
      CORS_ORIGINS: http://localhost:4200,http://localhost:4205
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/luna/jwt.pub
      PORT: '3000'
      # Google sign in at the gateway (plan 0023). The credentials are fictional:
      # no suite here can complete a real consent screen, and what the stack does
      # need is for the routes to be live so the state mint and the refusal of a
      # bad state are exercised against a running gateway.
      GOOGLE_CLIENT_ID: e2e-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: e2e-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/v1/auth/google/callback
      # Where the callback sends the browser back. `{locale}` is substituted with
      # the locale the flow started in; the app lives under a path that follows
      # the locale segment, so a plain prefix could not express it.
      APP_BASE_URL: http://localhost:4200/{locale}/velista
      # The byte cap the spoken turn route's multipart interceptor enforces
      # (plan 0041). The gateway is where an upload is actually refused, so the
      # number has to be here as well as on the assistant.
      ASSISTANT_AUDIO_MAX_BYTES: '2097152'
      # Voice comments (plan 0045), which are a different route with their own
      # cap. Stated rather than left to the defaults, because this file states its
      # environment by hand and inherits nothing: the suite asserts the byte cap's
      # refusal names the limit, so the number it names has to be the number this
      # stack is running with.
      VOICE_COMMENT_MAX_BYTES: '2097152'
      # Empty falls back to the contract's list, which is what browsers produce.
      VOICE_COMMENT_CONTENT_TYPES: ''
      # Short here on purpose. The assistant in this tier has no key, so every
      # transcription settles as UNAVAILABLE without a provider call and this
      # deadline is never reached; a long one would only slow a failing suite.
      VOICE_COMMENT_TRANSCRIBE_TIMEOUT_MS: '5000'
      # Names this container on every span and metric (plan 0016, section 4.2).
      # Tracing stays off unless OTEL_ENABLED and an endpoint are supplied, so
      # this tier runs unchanged without a collector.
      OTEL_SERVICE_NAME: luna-shopper-backend-gateway
      DEPLOYMENT_ENVIRONMENT: development
    ports:
      - '${LUNA_GATEWAY_PORT:-3000}:3000'
    volumes:
      - ../../../apps/luna-shopper-backend/secrets:/run/secrets/luna:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  realtime:
    image: ${LUNA_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/luna-shopper-backend-realtime:${LUNA_IMAGE_TAG:-staging}
    restart: 'no'
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      # Realtime holds four pieces of shared state in Redis rather than in the
      # pod (the socket.io adapter, the relay channel, presence, and the throttle
      # and dedupe counters), so this is what makes more than one replica correct.
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: debug
      # Both front end origins, as luna-slot.sh already allows: the portfolio
      # shell, which mounts velista as a remote, and velista's own origin,
      # which is where a confirmation link now lands (MAIL_VERIFY_BASE_URL
      # below) and so is an origin this stack has to answer.
      CORS_ORIGINS: http://localhost:4200,http://localhost:4205
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/luna/jwt.pub
      PORT: '3001'
      OTEL_SERVICE_NAME: luna-shopper-backend-realtime
      DEPLOYMENT_ENVIRONMENT: development
    ports:
      - '${LUNA_REALTIME_PORT:-3001}:3001'
    volumes:
      - ../../../apps/luna-shopper-backend/secrets:/run/secrets/luna:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: ${LUNA_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/luna-shopper-backend-auth:${LUNA_IMAGE_TAG:-staging}
    restart: 'no'
    depends_on:
      auth-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
      # Both front end origins, as luna-slot.sh already allows: the portfolio
      # shell, which mounts velista as a remote, and velista's own origin,
      # which is where a confirmation link now lands (MAIL_VERIFY_BASE_URL
      # below) and so is an origin this stack has to answer.
      CORS_ORIGINS: http://localhost:4200,http://localhost:4205
      AUTH_DB_URL: postgres://luna_auth:luna_auth@auth-db:5432/luna_auth
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/luna/jwt.key
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/luna/jwt.pub
      AUTH_JWT_KID: dev-1
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASS: ''
      MAIL_FROM: Luna Shopper <no-reply@luna.localhost>
      # velista's own origin (4205), which is where a confirmation link points in
      # production too, and `auth/verify`, which is the route the app has. The
      # old `/verify-email` matched no route in any table. No locale segment:
      # `localeGuard` inserts one and keeps the query string, so the link opens
      # in the reader's own language.
      MAIL_VERIFY_BASE_URL: http://localhost:4205/auth/verify
      # Placeholder. Nothing in the app routes a reset token yet.
      MAIL_RESET_BASE_URL: http://localhost:4205/reset-password
      GOOGLE_CLIENT_ID: e2e-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: e2e-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      PORT: '3002'
      OTEL_SERVICE_NAME: luna-shopper-backend-auth
      DEPLOYMENT_ENVIRONMENT: development
    ports:
      - '${LUNA_AUTH_PORT:-3002}:3002'
    volumes:
      - ../../../apps/luna-shopper-backend/secrets:/run/secrets/luna:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3002/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  core:
    image: ${LUNA_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/luna-shopper-backend-core:${LUNA_IMAGE_TAG:-staging}
    restart: 'no'
    depends_on:
      core-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
      # Both front end origins, as luna-slot.sh already allows: the portfolio
      # shell, which mounts velista as a remote, and velista's own origin,
      # which is where a confirmation link now lands (MAIL_VERIFY_BASE_URL
      # below) and so is an origin this stack has to answer.
      CORS_ORIGINS: http://localhost:4200,http://localhost:4205
      CORE_DB_URL: postgres://luna_core:luna_core@core-db:5432/luna_core
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/luna/jwt.pub
      ZONE_REAPER_ENABLED: 'false'
      # The basket sweep (plan 0059) is off here for the reason the reaper is: a
      # timer that finishes baskets underneath a suite is a flake, not a test.
      # The window is stated beside it because the two share one number and the
      # claim read still uses it with the sweep off.
      GENERATED_LIST_CLAIM_WINDOW: 60h
      GENERATED_LIST_SWEEP_ENABLED: 'false'
      GENERATED_LIST_SWEEP_INTERVAL: 1h
      GENERATED_LIST_SWEEP_BATCH: '100'
      # The same two numbers the gateway above is running with (plan 0045,
      # section 6). Core checks them again on the far side of the broker, and the
      # two disagreeing is a recording the gateway accepts and core refuses.
      VOICE_COMMENT_MAX_BYTES: '2097152'
      VOICE_COMMENT_CONTENT_TYPES: ''
      PORT: '3003'
      OTEL_SERVICE_NAME: luna-shopper-backend-core
      DEPLOYMENT_ENVIRONMENT: development
    ports:
      - '${LUNA_CORE_PORT:-3003}:3003'
    volumes:
      - ../../../apps/luna-shopper-backend/secrets:/run/secrets/luna:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3003/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog:
    image: ${LUNA_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/luna-shopper-backend-catalog:${LUNA_IMAGE_TAG:-staging}
    restart: 'no'
    depends_on:
      catalog-db:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
      # Both front end origins, as luna-slot.sh already allows: the portfolio
      # shell, which mounts velista as a remote, and velista's own origin,
      # which is where a confirmation link now lands (MAIL_VERIFY_BASE_URL
      # below) and so is an origin this stack has to answer.
      CORS_ORIGINS: http://localhost:4200,http://localhost:4205
      CATALOG_DB_URL: postgres://luna_catalog:luna_catalog@catalog-db:5432/luna_catalog
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/luna/jwt.pub
      PLATFORM_ADMIN_USER_IDS: ''
      PORT: '3004'
      OTEL_SERVICE_NAME: luna-shopper-backend-catalog
      DEPLOYMENT_ENVIRONMENT: development
    ports:
      - '${LUNA_CATALOG_PORT:-3004}:3004'
    volumes:
      - ../../../apps/luna-shopper-backend/secrets:/run/secrets/luna:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3004/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # The assistant (plan 0039). The only service here with no database and no
  # database url, because rule A1 says it reaches application data only through
  # the API, carrying the caller's own token — which is why it depends on the
  # gateway rather than on a Postgres.
  #
  # This block states its environment SEPARATELY from the chart and inherits
  # nothing from it. A variable added in `_env.tpl` and not here, or the reverse,
  # produces one dead service while the gateway stays up and returns 500s, which
  # is a slow thing to diagnose from the outside. Keep the two in step by hand.
  #
  # GEMINI_API_KEY is empty on purpose and the suite needs it to stay that way:
  # rule A4 forbids any test in this repository from reaching a model provider, so
  # a stack that could answer a real turn is a stack that could spend somebody's
  # quota from CI. Empty means /v1/assistant answers 501, which is exactly what an
  # e2e suite should assert.
  assistant:
    image: ${LUNA_IMAGE_PREFIX:-ghcr.io/ichirokuxvi/nx-portfolio}/luna-shopper-backend-assistant:${LUNA_IMAGE_TAG:-staging}
    restart: 'no'
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: debug
      GATEWAY_INTERNAL_URL: http://gateway:3000
      GEMINI_API_KEY: ''
      ASSISTANT_MODEL: gemini-3.5-flash-lite
      # Voice input (plan 0041). Empty transcription model means the same model
      # answers and transcribes, which is the default everywhere.
      ASSISTANT_TRANSCRIPTION_MODEL: ''
      ASSISTANT_AUDIO_MAX_BYTES: '2097152'
      ASSISTANT_AUDIO_MIME_TYPES: 'audio/webm,audio/ogg,audio/mp4,audio/wav,audio/mpeg,audio/aac,audio/flac'
      ASSISTANT_MAX_TURNS: '20'
      ASSISTANT_MAX_CHARS: '8000'
      ASSISTANT_MAX_TOOL_CALLS: '6'
      ASSISTANT_TURNS_PER_MINUTE: '8'
      ASSISTANT_CONCURRENCY: '2'
      ASSISTANT_RETRY_AFTER_FALLBACK: '30'
      PORT: '3006'
      OTEL_SERVICE_NAME: luna-shopper-backend-assistant
      DEPLOYMENT_ENVIRONMENT: development
    ports:
      - '${LUNA_ASSISTANT_PORT:-3006}:3006'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3006/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
