# NATS server configuration for the local/e2e stack (luna plan 0041, section 4.2).
#
# This file exists for exactly one setting, and it exists because that setting has
# no other home: **`max_payload` is config-file only.** `nats-server` has no
# `--max_payload` flag, and passing one makes it print its usage and exit, so the
# container comes up unhealthy and every service behind it fails to connect. The
# plan assumed a command line argument; it is not one.
#
# Everything else the broker needs is still on the command line in `compose.yml`
# (`-js -sd /data -m 8222`), because CLI flags take precedence over this file and
# keeping them there means the compose service still says what it is at a glance.
#
# 8 MB, matching `lunaShopperBackend.nats.maxPayload` in `k8s/helm/values.yaml`,
# which carries the arithmetic: a 2 MB recording is about 2.7 MB once base64'd for
# the gateway -> assistant hop, and the headroom is deliberate so the next change
# to either number does not have to move both. **Both, together** — a raise applied
# here and not in the chart is a feature that works on the development machine and
# fails in the cluster.
max_payload: 8388608
