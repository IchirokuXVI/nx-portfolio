# The broker's configuration, which exists for exactly one setting.
#
# `max_payload` is **not a command line flag**. `nats-server` refuses to start
# with `--max_payload` ("flag provided but not defined"), and it is a
# configuration file option only, so raising it means giving the broker a config
# file and pointing `-c` at it. Plan 0041 section 4.2 says to set it "on the
# broker's command", which is the one thing about that section that is wrong; the
# number and the reasoning behind it are unchanged.
#
# Why it is raised at all: a voice comment travels gateway to core, and a
# recording travels gateway to assistant, as base64 over this broker (plan 0045,
# section 3). A two megabyte upload is about 2.7 MB encoded and under 3 MB with
# its envelope, against a default ceiling of one megabyte. Without this a
# recording of any real length cannot reach the service at all, and the failure is
# a broker level rejection rather than anything a service could report nicely.
#
# The headroom is deliberate. This is a broker wide ceiling that nothing else
# comes close to, and setting it just above the cap would mean the next change to
# either number has to move both.
#
# **This file and `k8s/helm/templates/luna-shopper-backend/nats.yaml.tpl` are one
# decision and change together.** A raise here and not there is a feature that
# works on the development machine and fails in the cluster.
max_payload: 8MB
