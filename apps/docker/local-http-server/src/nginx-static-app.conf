worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript mjs;
  }

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;

    root /var/www/html;

    # The four files that must never be cached, because each one names which hashed
    # files are current (plan 0013, section 5.4). A hashed bundle can be cached
    # forever; the document and the manifests that point at it cannot, and an app
    # frozen on an old version has no way for a user to force an update.
    #
    # **Above the static asset block on purpose.** nginx tries regex locations in the
    # order they are written and takes the first that matches, and `ngsw.json` ends in
    # `.json` while `ngsw-worker.js` ends in `.js`, so below that block neither would
    # ever reach this one.
    #
    # This config is shared by every app image. The three service worker files are
    # emitted only by velista today, and the other apps 404 on them both before this
    # block and after it, so it is harmless to them. `index.html` is every app's and
    # wants the same treatment for the same reason.
    #
    # Belt and braces rather than the only line of defence: the Angular service worker
    # already appends a cache busting parameter when it checks `ngsw.json`.
    location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Cache-Control' 'no-cache' always;
      try_files $uri =404;
    }

    # Serve static files with CORS headers
    location ~* \.(js|mjs|css|json|woff2?|ttf|png|jpg|svg)$ {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' '*' always;
      try_files $uri =404;
    }

    # Fallback for Angular routes
    location / {
      add_header 'Access-Control-Allow-Origin' '*' always;
      try_files $uri $uri/ /index.html;
    }
  }
}
