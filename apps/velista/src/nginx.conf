# velista's own copy of apps/docker/local-http-server/src/nginx-static-app.conf.
#
# velista is served at two addresses, the root of its own origin and the portfolio's
# /velista path, and under the second it rewrites its document (plan 0165 D2). The
# shared config serves every app image and cannot know a prefix, so velista carries
# this file and its Dockerfile installs it over the shared one. A change to the
# shared file should be mirrored here by hand.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript mjs;
    application/manifest+json webmanifest;
  }

  sendfile on;
  keepalive_timeout 65;

  # Which base this document is served under. $request_uri is the URI as the
  # request arrived, before any rewrite below, so a request that carried the
  # portfolio's prefix is still recognisable once the prefix is gone.
  map $request_uri $app_base {
    default "/";
    ~^/velista(/|$) "/velista/";
  }

  # The manifest is linked only on the own origin. Under the portfolio its
  # scope and start_url would resolve to the portfolio's root.
  map $app_base $manifest_link {
    default "";
    "/" '<link href="manifest.webmanifest" rel="manifest">';
  }

  server {
    listen 80;

    root /var/www/html;

    # The two literals are the spelling of the BUILT index.html, which Angular
    # re-serialises without the self closing slash the source carries.
    # velista-index-markup.spec.ts holds them to the build. The default
    # sub_filter_types is text/html, so only the document is touched.
    sub_filter '<base href="/">' '<base href="$app_base">';
    sub_filter '<link href="manifest.webmanifest" rel="manifest">' '$manifest_link';
    sub_filter_once on;

    # The portfolio mount (plan 0165 D2). The gateway forwards /velista with the
    # prefix kept, and this maps it back onto the bundle. `^~` stops the regex
    # locations below from being tried first, which would 404 /velista/main.js.
    location ^~ /velista/ {
      rewrite ^/velista/(.*)$ /$1 last;
    }
    # A relative Location, because this nginx sits behind the gateway and would
    # otherwise name its own scheme and port (http, 80) in an absolute one.
    location = /velista {
      absolute_redirect off;
      return 302 /velista/;
    }

    # The four files that must never be cached, because each one names which hashed
    # files are current (plan 0013, section 5.4). A hashed bundle can be cached
    # forever; the document and the manifests that point at it cannot, and an app
    # frozen on an old version has no way for a user to force an update. velista
    # emits no remoteEntry.mjs, so the shared config's fifth file is not listed.
    #
    # Above the static asset block on purpose: nginx takes the first regex location
    # that matches, and `ngsw.json` and `ngsw-worker.js` would otherwise land there.
    location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Cache-Control' 'no-cache' always;
      try_files $uri =404;
    }

    # A file whose name carries its content hash never changes under that name, so a
    # cache may keep it for a year (velista plan 0167). Below the no-cache block so the
    # fixed names keep winning, and above the generic block so it is reached. A
    # /velista/ request reaches it after the rewrite above. Quoted because nginx would
    # read the brace of `{16,}` as the start of the block.
    location ~* "\.[0-9a-f]{16,}\.(js|mjs|css|woff2)$" {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' '*' always;
      add_header 'Cache-Control' 'public, max-age=31536000, immutable' always;
      try_files $uri =404;
    }

    # Serve static files with CORS headers
    location ~* \.(js|mjs|css|json|woff2?|ttf|png|jpg|svg)$ {
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' '*' always;
      try_files $uri =404;
    }

    # Fallback for Angular routes
    location / {
      add_header 'Access-Control-Allow-Origin' '*' always;
      try_files $uri $uri/ /index.html;
    }
  }
}
