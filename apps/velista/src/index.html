<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>velista</title>
    <base href="/" />
    <!--
      `interactive-widget=resizes-content` is what keeps a bottom sheet's primary
      button above the on-screen keyboard (plan 0008, section 7). Without it Chrome on
      Android resizes only the visual viewport, so an element fixed to the bottom stays
      pinned under the keyboard; iOS Safari already moves fixed elements above it.

      This document is the standalone build's, and the portfolio shell's `index.html`
      carries the same attribute for the mounted one. Both are needed and neither is
      redundant: only one of the two documents ships in each mode.
    -->
    <meta
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
      name="viewport"
    />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
  </head>
  <body>
    <app-velista-entry></app-velista-entry>
  </body>
</html>
