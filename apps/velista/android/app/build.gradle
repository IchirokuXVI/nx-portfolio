apply plugin: 'com.android.application'

// The version comes from the build script's environment (velista plan 0167, D3): the
// bundle's VELISTA_APP_VERSION and this versionName are one string, so the gateway's
// client floor can retire an old APK. Nobody edits a version in this file.
def velistaVersionName = (project.findProperty('velistaVersionName') ?: '0.0.0-dev').toString()
def velistaVersionCode = (project.findProperty('velistaVersionCode') ?: '1').toString().toInteger()

// What the over the air path needs to know about this APK (velista plan 0180), all from
// build-android.mjs: the native compatibility key of native-api.json, the base URL of the
// flavor's manifest (empty turns OTA off), the flavor's public key that judges a manifest,
// and the id of the bundle built in. A plain Gradle build gets OTA off.
def velistaNativeApi = (project.findProperty('velistaNativeApi') ?: '0').toString().toInteger()
def velistaOtaBaseUrl = (project.findProperty('velistaOtaBaseUrl') ?: '').toString()
def velistaOtaPublicKey = (project.findProperty('velistaOtaPublicKey') ?: '').toString()
def velistaBuiltinBundle = (project.findProperty('velistaBuiltinBundle') ?: '').toString()
def javaString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '').replace('\n', '\\n') + '"'
}

// The keystore lives outside the repository. Its properties file is named by a Gradle
// property, else expected beside the Android project. With neither, a release build
// signs with the debug key so it still installs (D4).
def keystorePropertiesFile = file(project.findProperty('velistaKeystoreProperties') ?: rootProject.file('keystore.properties'))
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
} else {
    logger.warn("velista: no keystore properties at ${keystorePropertiesFile}, so release builds are signed with the debug key")
}

android {
    namespace = "app.velista"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "app.velista"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode velistaVersionCode
        versionName velistaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "int", "VELISTA_NATIVE_API", velistaNativeApi.toString()
        buildConfigField "String", "VELISTA_OTA_BASE_URL", javaString(velistaOtaBaseUrl)
        buildConfigField "String", "VELISTA_OTA_PUBLIC_KEY", javaString(velistaOtaPublicKey)
        buildConfigField "String", "VELISTA_BUILTIN_BUNDLE", javaString(velistaBuiltinBundle)
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Two installable apps that can sit on one phone (D2). The flavor is the only
    // environment switch in Gradle; the hosts inside the bundle come from the script.
    flavorDimensions = ["env"]
    productFlavors {
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Velista Staging"
            manifestPlaceholders = [appLinkHost: "staging.velista.app"]
        }
        production {
            dimension "env"
            resValue "string", "app_name", "Velista"
            manifestPlaceholders = [appLinkHost: "velista.app"]
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                // A relative storeFile is read against the properties file, which is
                // where the keystore sits beside it.
                def storePath = keystoreProperties.getProperty('storeFile')
                def store = new File(storePath)
                storeFile store.isAbsolute() ? store : new File(keystorePropertiesFile.parentFile, storePath)
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// An OTA test on the emulator reads its files over http from the machine through adb
// reverse (plan 0180, section 5). Android refuses cleartext by default, so only then the
// release source set gets a network security configuration that allows it to localhost
// alone. It is written under build/ and merged in, so an ordinary build carries none.
// build-android.mjs refuses --bundle with it.
if ((project.findProperty('velistaCleartextLocalhost') ?: 'false').toString() == 'true') {
    // Gradle holds the rule itself too, so a switch passed by hand never reaches Play.
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }) {
        throw new GradleException('velistaCleartextLocalhost=true refuses a bundle task: a Play build allows no cleartext')
    }
    logger.warn('velista: cleartext to localhost is allowed in this build, for an OTA test only')
    def overlay = new File(layout.buildDirectory.get().asFile, 'generated/velista-cleartext-localhost')
    def xmlDir = new File(overlay, 'res/xml')
    xmlDir.mkdirs()
    new File(xmlDir, 'velista_cleartext_localhost.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">localhost</domain>
        <domain includeSubdomains="false">127.0.0.1</domain>
    </domain-config>
</network-security-config>
'''
    new File(overlay, 'AndroidManifest.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application android:networkSecurityConfig="@xml/velista_cleartext_localhost" />
</manifest>
'''
    android.sourceSets.release.res.srcDirs += new File(overlay, 'res')
    android.sourceSets.release.manifest.srcFile new File(overlay, 'AndroidManifest.xml')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Google sign in (velista plan 0177): Credential Manager, its Play services provider,
    // and Google's ID token option types.
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
