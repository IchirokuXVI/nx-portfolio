<style>
/* Day tokens copied from libs/velista/ui/src/lib/styles, drawn to match staging on 2026-10-27. */
body { margin: 0; }
.vel {
  --ground: #f7f8fc; --raised: #ffffff; --sunken: #eef0f7; --found: #f1f3f9;
  --ink: #111420; --ink-2: #525a78; --ink-3: #616a8a;
  --line: #dde1ed; --line-strong: #6f7899;
  --amber: #ffb454; --amber-ink: #0a0c14; --amber-text: #8a5a12; --amber-edge: #e89a35;
  --mark: rgba(255, 180, 84, 0.16); --focus: #2563eb;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: var(--ink);
}
.vel button { font-family: inherit; cursor: pointer; }
.phone { position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--ground); }

.ph { flex: none; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--ground); }
.ph-title { flex: 1 1 auto; min-width: 0; margin: 0; font-family: Marcellus, Georgia, serif; font-size: 20px; line-height: 28px; font-weight: 400; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-act { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); }
.ph-lead { margin-left: -10px; color: var(--ink); }
.ph-icon { flex: none; width: 24px; height: 24px; margin-right: 8px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.ph-end { margin-right: -10px; display: flex; }

.lh { flex: none; padding: 12px 16px 14px; }
.lh p { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-3); }
.lh p + p { margin: 4px 0 8px; color: var(--ink-2); }
.track { height: 4px; border-radius: 2px; background: var(--line); }
.tb { flex: none; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tb h2 { margin: 0; font-size: 14px; font-weight: 600; }
.tx { height: 44px; padding: 0; border: 0; background: none; color: var(--amber-text); font-size: 14px; font-weight: 500; }
.bt { flex: none; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px 0 16px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink-3); }

.rows { flex: 1; min-height: 0; overflow: hidden; }
.sec { flex: none; margin: 0; padding: 14px 16px 6px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.sec span { font-weight: 400; letter-spacing: 0; }
.found { background: var(--found); border-bottom: 1px solid var(--line); }
.found .sec { border-bottom: 1px solid var(--line); margin: 0 0 0 0; }

.lb { display: flex; align-items: center; gap: 12px; height: 68px; box-sizing: border-box; padding: 0 16px; border-bottom: 1px solid var(--line); }
.lb:last-child { border-bottom: 0; }
.th { flex: none; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--sunken); display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
.th.empty { border: 1.5px dashed var(--line-strong); background: transparent; color: var(--amber-text); }
.settle { flex: none; width: 24px; height: 24px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: 999px; }
.lt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.l1 { display: flex; align-items: baseline; gap: 8px; font-size: 16px; line-height: 22px; }
.l1 .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l1 .nm.lbl { font-weight: 550; }
.l1 .np { flex: none; margin-left: auto; font-size: 13px; color: var(--ink-3); }
.l2 { font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l2.ask { color: var(--amber-text); font-weight: 550; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 1px; }
.qw { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.qty { flex: none; width: 52px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qty.took { border: 1.5px solid var(--amber-edge); color: var(--amber-text); }
.times { font-size: 11px; line-height: 12px; color: var(--ink-3); }
.plus1 { flex: none; font-size: 14px; font-weight: 650; color: var(--amber-text); font-variant-numeric: tabular-nums; }

.card { padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
.ct { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
.ct .th { width: 52px; height: 52px; border-radius: 12px; }
.round { flex: none; width: 44px; height: 44px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: 999px; background: var(--raised); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.held { margin-left: 64px; padding: 8px 0 12px; border-top: 1px solid var(--line); }
.held p { margin: 0 0 6px; font-size: 12px; color: var(--ink-3); }
.hr { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
.stp { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 12px; border: 1.5px solid var(--amber); border-radius: 999px; background: rgba(255, 180, 84, 0.1); color: var(--ink-2); }
.stp b { color: var(--amber-text); font-size: 16px; font-variant-numeric: tabular-nums; }

.composer { flex: none; display: flex; align-items: center; gap: 8px; height: 72px; box-sizing: border-box; padding: 0 12px 0 8px; border-top: 1px solid var(--line); background: var(--ground); }
.field { flex: 1; min-width: 0; height: 46px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px; border-radius: 14px; background: var(--sunken); font-size: 16px; color: var(--ink-3); }
.field.typed { color: var(--ink); outline: 2px solid var(--focus); outline-offset: 0; justify-content: space-between; }
.field .x { display: flex; color: var(--ink-2); }
/* an input keeps one line and shows the end of what was typed */
.field .ft { flex: 1; min-width: 0; display: flex; overflow: hidden; white-space: nowrap; }
.field .ft.tail { justify-content: flex-end; }
.field .ft span { flex: none; }
.hr span:first-child { min-width: 0; margin-right: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qstep { flex: none; display: flex; align-items: center; gap: 18px; height: 46px; padding: 0 16px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); font-size: 15px; }
.qstep b { color: var(--ink); font-weight: 500; }
.send { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: var(--amber); color: var(--amber-ink); }
.send.open { outline: 2px solid var(--focus); outline-offset: 2px; }
.send.idle { background: rgba(255, 180, 84, 0.45); }
.hint { flex: none; display: flex; align-items: baseline; gap: 6px; height: 30px; box-sizing: border-box; padding: 6px 16px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); background: var(--ground); }
.hint b { font-weight: 600; color: var(--ink); }
.hint .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }

.nav { flex: none; display: flex; gap: 4px; padding: 8px 10px 20px; border-top: 1px solid var(--line); background: var(--ground); }
.tab { position: relative; flex: 1; height: 60px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.tab.on { background: rgba(255, 180, 84, 0.18); color: var(--amber-text); }
.badge { position: absolute; top: 4px; left: calc(50% + 2px); min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--amber-text); color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

/* the popover, held against the plus as the basket's list picker is (anchored-popover).
   Small, but every row stays a 48 px target. Its bottom sits 8 px over the composer, which
   sits on the keyboard: 291 + 72 + 8. */
.pop { position: absolute; right: 12px; bottom: 371px; width: 276px; box-sizing: border-box; padding: 10px 0 2px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); box-shadow: 0 2px 4px rgba(17, 20, 31, 0.05), 0 12px 28px rgba(17, 20, 31, 0.14); }
.pop h3 { margin: 0; padding: 0 14px 8px; font-size: 15px; line-height: 20px; font-weight: 600; overflow-wrap: anywhere; }
.pr { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; box-sizing: border-box; padding: 4px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; color: var(--ink); }
.pr .th { width: 30px; height: 30px; border-radius: 8px; }
.pr .lt { gap: 0; }
.pr .l1 { font-size: 14.5px; line-height: 19px; }
.pr .l2 { font-size: 12px; line-height: 16px; }
.pr .to { flex: none; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pr .to b { color: var(--ink); font-weight: 650; }
.pr.new .l1 { color: var(--amber-text); font-weight: 600; }
.pr.list .l1 { font-size: 16px; line-height: 21px; }
.pr .has { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.back { display: flex; align-items: center; gap: 2px; height: 28px; margin: -4px 0 2px 8px; padding: 0 8px 0 2px; border: 0; background: none; color: var(--ink-2); font-size: 12.5px; }

/* the keyboard is not drawn, only the room it takes */
.kb { flex: none; height: 291px; box-sizing: border-box; border-top: 1px solid var(--line); background: #d9dce7; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-2); }
.field.focus { outline: 2px solid var(--focus); outline-offset: 0; }
.dim { position: absolute; inset: 0; background: rgba(17, 20, 31, 0.06); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
