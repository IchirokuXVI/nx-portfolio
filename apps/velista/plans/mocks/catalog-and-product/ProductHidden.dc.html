<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product page, one supermarket hidden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
<style>
body{margin:0}
/* Day theme of the app, copied from libs/velista/ui/src/lib/styles. Shared by every artboard. */
.app {
  --ground: #f7f8fc;
  --raised: #ffffff;
  --sunken: #eef0f7;
  --text: #11141f;
  --text2: #525a78;
  --muted: #616a8a;
  --line: #dde1ed;
  --strong: #6f7899;
  --amber: #ffb454;
  --amber-edge: #e89a35;
  --amber-fg: #8a5a12;
  --amber-bg: rgba(255, 180, 84, 0.1);
  --amber-line: rgba(255, 180, 84, 0.26);
  --ok: #047857;
  --focus: #2563eb;
  --lift: 0 2px 4px rgba(17, 20, 31, 0.05), 0 12px 28px rgba(17, 20, 31, 0.1);
  position: relative;
  width: 390px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  background: var(--ground);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}
.app *, .app *::before, .app *::after { box-sizing: border-box; }
.app button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: start; }
.app a { color: inherit; text-decoration: none; }
.app h1, .app h2, .app p, .app ul { margin: 0; padding: 0; }
.app ul { list-style: none; }
.app button:focus-visible, .app a:focus-visible, .app input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Icons: 24 grid, stroked, sized by font-size. */
.app .i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Page header (rules H1 to H6). */
.app .ph { flex: none; height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--ground); }
.app .ph-icon { font-size: 24px; margin-right: 8px; display: flex; }
.app .ph-back { width: 44px; height: 44px; margin-left: -12px; border-radius: 999px; display: grid; place-items: center; color: var(--text2); font-size: 20px; }
.app .ph-title { flex: 1; min-width: 0; font-family: 'Marcellus', Georgia, serif; font-size: 20px; font-weight: 400; line-height: 1.4; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* The scrolling page and the bar at the bottom. */
.app .page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.app .nav { flex: none; display: flex; gap: 4px; padding: 8px 8px 20px; border-top: 1px solid var(--line); background: var(--ground); }
.app .tab { flex: 1; height: 60px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text2); font-size: 12px; font-weight: 600; line-height: 1.2; }
.app .tab .i { font-size: 24px; }
.app .tab.on { background: var(--amber-bg); color: var(--amber-fg); font-weight: 700; }

/* Tools above the list. */
.app .tools { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0; }
.app .field { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid var(--strong); border-radius: 12px; background: var(--raised); }
.app .field .i { font-size: 20px; color: var(--muted); }
.app .field input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: var(--text); padding: 0; }
.app .field input::placeholder { color: var(--muted); opacity: 1; }

/* A: two selectors that share one row. */
.app .picks { display: flex; gap: 8px; }
.app .pick { flex: 1; min-width: 0; height: 44px; display: flex; align-items: stretch; border: 1px solid var(--strong); border-radius: 12px; background: var(--raised); color: var(--text); font-size: 14px; font-weight: 600; }
.app .pick-body { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; }
.app .pick:first-child { flex-grow: 1.2; }
.app .pick-body > .i { font-size: 17px; color: var(--muted); }
.app .pick-body > .i:last-child { margin-left: auto; }
.app .pick-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .pick.set { border-color: var(--amber-edge); background: var(--amber-bg); color: var(--amber-fg); font-weight: 650; }
.app .pick-clear { width: 40px; flex: none; display: grid; place-items: center; font-size: 17px; border-left: 1px solid var(--amber-line); }

/* The line that heads the list: where the prices are from, and the order. */
.app .head { display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: var(--muted); font-size: 12px; }
.app .head-order { margin-left: auto; height: 44px; display: flex; align-items: center; gap: 4px; color: var(--text2); font-size: 14px; font-weight: 600; }
.app .head-order b { color: var(--text); font-weight: 650; }
.app .head-order .i { font-size: 17px; }
.app .head-order.set b { color: var(--amber-fg); }

/* Product rows. */
.app .rows { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 16px; }
.app .row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--raised); }
.app .row.tight { padding-right: 8px; }
.app .row-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.app .thumb { flex: none; width: 52px; height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); display: grid; place-items: center; color: var(--muted); font-size: 20px; }
.app .what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.app .name { font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
.app .detail { font-size: 12px; line-height: 1.3; color: var(--muted); }
.app .price { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-variant-numeric: tabular-nums; }
.app .amount { font-size: 16px; font-weight: 650; line-height: 1.2; }
.app .caption { font-size: 11px; line-height: 1.2; color: var(--muted); }
.app .none { font-size: 14px; line-height: 1.2; color: var(--muted); }

/* Quick add on a row. */
.app .add { flex: none; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; }
.app .add-dot { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--strong); display: grid; place-items: center; color: var(--text2); font-size: 18px; }
.app .add-dot .i { stroke-width: 2.3; }
.app .add.has .add-dot { border-color: var(--amber-edge); background: var(--amber-bg); color: var(--amber-fg); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Quantity stepper, as on a list line. */
.app .step { flex: none; display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken); }
.app .step button { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; font-size: 18px; color: var(--text2); }
.app .step button .i { stroke-width: 2.3; }
.app .step output { min-width: 2ch; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.app .step.has { border-color: var(--amber-edge); background: var(--amber-bg); }
.app .step.has output { color: var(--amber-fg); font-size: 16px; font-weight: 700; }
.app .step .off { opacity: 0.35; }
.app .step.small button { width: 40px; height: 40px; }

/* Small words. */
.app .word { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; line-height: 1.2; }
.app .word.ok { color: var(--ok); }
.app .word.last { color: var(--amber-fg); }

/* Chain logo tile. */
.app .logo { flex: none; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 27%; background: var(--sunken); display: grid; place-items: center; font-size: 12px; font-weight: 750; letter-spacing: -0.02em; color: var(--text); }
.app .logo.sm { width: 20px; height: 20px; font-size: 9px; }

/* A popover anchored to a control. */
.app .pop { position: absolute; z-index: 3; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); box-shadow: var(--lift); }
.app .pop-title { font-size: 14px; font-weight: 650; padding: 0 4px 8px; }
.app .opt { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 4px; border-radius: 8px; font-size: 16px; }
.app .opt-radio { flex: none; width: 22px; height: 22px; border: 1.5px solid var(--strong); border-radius: 999px; display: grid; place-items: center; }
.app .opt.on .opt-radio { border-color: var(--amber-edge); }
.app .opt.on .opt-radio::after { content: ''; width: 12px; height: 12px; border-radius: 999px; background: var(--amber-edge); }
.app .opt.on { font-weight: 650; }
.app .opt-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.app .opt-text small { font-size: 12px; font-weight: 400; color: var(--muted); }

/* The line that says which list the plus adds to. */
.app .page { overflow: hidden; }
.app .bar { flex: none; position: relative; display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 0 16px; border-top: 1px solid var(--line); background: var(--raised); box-shadow: 0 -6px 16px rgba(17, 20, 31, 0.06); font-size: 14px; color: var(--muted); }
.app .bar-list { height: 44px; display: flex; align-items: center; gap: 2px; color: var(--text); font-size: 16px; font-weight: 650; }
.app .bar-list .i { font-size: 17px; }
.app .bar-count { margin-left: auto; height: 44px; display: flex; align-items: center; color: var(--amber-fg); font-weight: 600; }

/* A sheet: it covers the page and the tab bar. */
.app .scrim { position: absolute; inset: 0; z-index: 5; background: rgba(17, 20, 31, 0.42); }
.app .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px 20px 24px; border-radius: 22px 22px 0 0; background: var(--raised); box-shadow: 0 -12px 32px rgba(17, 20, 31, 0.16); }
.app .sheet-handle { display: block; width: 48px; height: 5px; margin: 4px auto 16px; border-radius: 999px; background: var(--strong); }
.app .sheet-title { font-size: 18px; font-weight: 650; line-height: 1.2; }
.app .sheet-note { margin-top: 4px; font-size: 14px; color: var(--muted); }
.app .sheet-group { margin: 16px 0 4px; font-size: 14px; font-weight: 600; color: var(--text2); }
.app .sheet .opt { min-height: 56px; border-bottom: 1px solid var(--line); border-radius: 0; }
.app .sheet-row { display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid var(--line); }
.app .sheet-close { width: 100%; min-height: 52px; margin-top: 20px; border: 1px solid var(--strong); border-radius: 12px; text-align: center; font-weight: 600; }
.app .sheet-quiet { min-height: 44px; margin-top: 8px; color: var(--amber-fg); font-size: 14px; font-weight: 600; }
.app .sec{padding:0 16px}
.app .h2{font-size:16px;font-weight:650;line-height:1.2;margin:28px 0 12px}
.app .card{border:1px solid var(--line);border-radius:16px;background:var(--raised)}
.app .pr{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px 0 12px;border-bottom:1px solid var(--line)}
.app .pr:last-child{border-bottom:0}
.app .pr-name{flex:1;min-width:0}
.app .pr.gone .pr-name{color:var(--muted)}
.app .seen{margin-top:12px;font-size:12px;color:var(--muted)}
.app .lg{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 8px;border-radius:8px;font-size:14px;font-weight:600}
.app .sw{flex:none;width:14px;height:4px;border-radius:999px;border:2px solid transparent;box-sizing:content-box}
.app .lg-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .lg-val{font-weight:650;font-variant-numeric:tabular-nums}
.app .lg.off .lg-name{color:var(--muted);font-weight:500;text-decoration:line-through}
.app .lg.off .sw{background:transparent !important;border-color:var(--strong);height:0}
.app .b1{background:#2a78d6}.app .b2{background:#eb6834}.app .b3{background:#1baf7a}.app .b4{background:#eda100}
.app .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.app .s1{stroke:#2a78d6}.app .s2{stroke:#eb6834}.app .s3{stroke:#1baf7a}.app .s4{stroke:#eda100}
.app .f1{fill:#2a78d6}.app .f2{fill:#eb6834}.app .f3{fill:#1baf7a}.app .f4{fill:#eda100}
.app .dot{stroke:#ffffff;stroke-width:2}
.app .grid{stroke:var(--line);stroke-width:1}
.app .cross{stroke:var(--strong);stroke-width:1;stroke-dasharray:3 3}
.app .tick{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.app .end{fill:var(--text);font-size:10px;font-weight:650;font-variant-numeric:tabular-nums}
.app .range{display:flex;border-top:1px solid var(--line);margin-top:8px}
.app .range button{flex:1;height:44px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;border-radius:0}
.app .range button.on{color:var(--text);border-bottom-color:var(--amber)}
.app .grp{font-size:14px;font-weight:600;color:var(--text2);margin:16px 0 8px}
.app .lr{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
.app .lr:last-child{border-bottom:0}
.app .lr-what{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.25}
.app .lr-sub{font-size:12px;color:var(--muted)}
</style>
</helmet>
<div class="app" style="height: 452px">
  <div class="page">
    <section class="sec" aria-labelledby="h-history">
      <h2 class="h2" id="h-history">How the price has moved</h2>
      <div class="card" style="padding: 8px 8px 0">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 8px">
          <button class="lg" type="button" aria-pressed="true"><span class="sw b3" aria-hidden="true"></span><span class="lg-name">DIA</span><span class="lg-val">3,15 €</span></button>
          <button class="lg" type="button" aria-pressed="true"><span class="sw b4" aria-hidden="true"></span><span class="lg-name">El Jamón</span><span class="lg-val">3,42 €</span></button>
          <button class="lg" type="button" aria-pressed="true"><span class="sw b1" aria-hidden="true"></span><span class="lg-name">Mercadona</span><span class="lg-val">3,45 €</span></button>
          <button class="lg off" type="button" aria-pressed="false"><span class="sw b2" aria-hidden="true"></span><span class="lg-name">Carrefour</span><span class="lg-val"></span></button>
        </div>
        <p style="padding: 4px 8px 8px; font-size: 12px; color: var(--muted)">Prices on 9 September. Press a supermarket to hide its line.</p>

        <svg viewBox="0 0 326 176" width="326" height="176" role="img" aria-label="Price of Café molido natural at four supermarkets over the last three months" style="display: block; margin: 0 8px">
          <path class="grid" d="M36 20H288M36 63.3H288M36 106.7H288M36 150H288"/>
          <text class="tick" x="0" y="23">3,90 €</text>
          <text class="tick" x="0" y="66">3,60 €</text>
          <text class="tick" x="0" y="110">3,30 €</text>
          <text class="tick" x="0" y="153">3,00 €</text>
          <path class="cross" d="M204 14V150"/>
          <path class="ln s1" d="M36 99.4H57V99.4H78V99.4H99V99.4H120V99.4H141V85H162V85H183V85H204V85H225V85H246V85H267V85H288V85"/>
          <path class="ln s2" d="M0 0"/>
          <path class="ln s3" d="M36 85H57V85H78V113.9H99V113.9H120V85H141V85H162V85H183V85H204V128.3H225V128.3H246V113.9H267V113.9H288V113.9"/>
          <path class="ln s4" d="M36 70.6H57V70.6H78V70.6H99V70.6H120V70.6H141V89.3H162V89.3H183V89.3H204V89.3H225V89.3H246V89.3H267V99.4H288V99.4"/>
          <circle class="dot f1" cx="204" cy="85" r="4"/>
          <circle class="dot f2" cx="204" cy="50.3" r="0"/>
          <circle class="dot f3" cx="204" cy="128.3" r="4"/>
          <circle class="dot f4" cx="204" cy="89.3" r="4"/>
          <text class="end" x="294" y="88.5">3,45</text>
          <text class="end" x="294" y="68.3"></text>
          <text class="end" x="294" y="117.4">3,25</text>
          <text class="end" x="294" y="102.9">3,35</text>
          <text class="tick" x="36" y="170">15 Jul</text>
          <text class="end" x="204" y="170" text-anchor="middle">9 Sep</text>
          <text class="tick" x="288" y="170" text-anchor="end">today</text>
        </svg>

        <div class="range" role="tablist" aria-label="How far back">
          <button type="button" role="tab" aria-selected="false">1 month</button>
          <button class="on" type="button" role="tab" aria-selected="true">3 months</button>
          <button type="button" role="tab" aria-selected="false">1 year</button>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>

    return {};

</body>
</html>
