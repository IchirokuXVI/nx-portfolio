<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #8a5a12; text-decoration: none; }
    a:hover { color: #6d460c; }
  </style>
</helmet>

<div style="width: 470px; height: 1010px; background: #11141f; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 12px;">

  <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #98a0bb;">DAY &middot; the basket in the bright shop where it is actually used (guest view)</span>
  <div style="width: 390px; height: 844px; background: #f7f8fc; color: #11141f; overflow: hidden; border-radius: 4px; display: flex; flex-direction: column;">

    <div style="flex: 0 0 auto; padding: 14px 8px 0 20px; display: flex; align-items: center; gap: 4px;">
      <div style="flex: 1 1 auto; min-width: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; color: #11141f;">Saturday big shop</div>
    </div>

    <div style="flex: 0 0 auto; padding: 6px 20px 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: center;">
          <span style="width: 26px; height: 26px; border-radius: 999px; background: #6d28d9; border: 2px solid #f7f8fc; color: #ffffff; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center;">A</span>
          <span style="width: 26px; height: 26px; border-radius: 999px; background: #1d4ed8; border: 2px solid #f7f8fc; color: #ffffff; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: -8px;">D</span>
          <span style="width: 26px; height: 26px; border-radius: 999px; background: #eef0f7; border: 2px dashed #6f7899; color: #525a78; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: -8px;">G</span>
        </div>
        <span style="font-size: 13px; color: #525a78; font-variant-numeric: tabular-nums;">4 of 12 got</span>
      </div>
    </div>

    <div style="flex: 1 1 auto; background: #ffffff; border-top: 1px solid #dde1ed; overflow: hidden;">

      <div style="height: 60px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7;">
        <span style="flex: 1 1 auto; font-size: 16px; color: #11141f;">Milk <span style="color: #6f7899; font-size: 14px;">&times;3</span></span>
        <span style="flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
          <span style="width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid #6f7899;"></span>
        </span>
      </div>

      <div style="min-height: 64px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7;">
        <div style="flex: 1 1 auto; min-width: 0;">
          <div style="font-size: 16px; color: #11141f;">Eggs <span style="color: #6f7899; font-size: 14px;">2 of 12 got</span></div>
          <div style="margin-top: 3px; font-size: 12px; color: #6f7899;">Marc got 2</div>
        </div>
        <span style="flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
          <span style="width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid #6f7899;"></span>
        </span>
      </div>

      <div style="min-height: 64px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7; background: #f0faf6;">
        <div style="flex: 1 1 auto; min-width: 0;">
          <div style="font-size: 16px; color: #6f7899;">Olive oil</div>
          <div style="margin-top: 3px; font-size: 12px; color: #047857;">Ana got it</div>
        </div>
        <span style="flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
          <span style="width: 30px; height: 30px; border-radius: 999px; background: #059669; display: flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </span>
      </div>

      <div style="min-height: 64px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7; background: #fdf1f3;">
        <div style="flex: 1 1 auto; min-width: 0;">
          <div style="font-size: 16px; color: #6f7899;">Sourdough loaf</div>
          <div style="margin-top: 3px; font-size: 12px; color: #be123c;">Guest 2 says they had none</div>
        </div>
        <span style="flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
          <span style="width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid #be123c; display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7" stroke="#be123c" stroke-width="2.2" stroke-linecap="round"/></svg>
          </span>
        </span>
      </div>

      <div style="height: 60px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px;">
        <span style="flex: 1 1 auto; font-size: 16px; color: #11141f;">Tomatoes <span style="color: #6f7899; font-size: 14px;">&times;6</span></span>
        <span style="flex: 0 0 auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
          <span style="width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid #6f7899;"></span>
        </span>
      </div>

    </div>

  </div>

</div>
</x-dc>
</body>
</html>
