/* Tokens copied from libs/velista/ui/src/lib/styles, Day values. */
.vel {
  --app-font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --app-text-2xs: 11px; --app-text-xs: 12px; --app-text-sm: 14px; --app-text-base: 16px; --app-text-lg: 18px;

}
.phone { position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--app-surface-ground); }
.phone.tall { height: auto; }
/* plan 0130: the one page header. 64px, one title style, always a bottom border. */
.ph { flex: none; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--app-border-subtle); background: var(--app-surface-ground); }
.ph-lead { flex: none; width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--app-text-secondary); cursor: pointer; }
.ph-icon { flex: none; width: 24px; height: 24px; margin-right: 8px; display: flex; align-items: center; justify-content: center; color: var(--app-text-primary); }

.ph-text { flex: none; height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: transparent; color: var(--app-action-quiet-fg); font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }

.ph-badge { position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 999px; background: var(--app-action-quiet-fg); color: #ffffff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

.ph-pill { flex: none; height: 24px; padding: 0 9px; margin-right: 2px; display: flex; align-items: center; border: 1px solid var(--app-border-subtle); border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--app-text-secondary); white-space: nowrap; }

.mrow + .mrow { border-top: 1px solid var(--app-border-subtle); border-radius: 0; }
