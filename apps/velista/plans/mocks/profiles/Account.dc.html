<x-dc>

<div style="width: 470px; height: 1010px; background: #11141f; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 12px;">

  <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #98a0bb;">THE WAY IN &middot; 0015&rsquo;s account page gains one row</span>

    <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6f7899; margin: 26px 0 2px;">You</div>

    </div>
    <div style="padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.07);">

      <span style="display: block; font-size: 17px; color: #f7f8fc;">marta@example.com</span>
    </div>

    <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6f7899; margin: 26px 0 2px;">Shopping</div>
    <!-- the new row -->
    <div style="padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px;">

        <span style="display: block; font-size: 17px; color: #f7f8fc;">Shopping profiles</span>
        <span style="display: block; margin-top: 3px; font-size: 12.5px; color: #6f7899; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Home &middot; 14013 &middot; 2 supermarkets</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#525a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </div>
    <div style="padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 12px;">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#525a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </div>

    <div style="flex: 1;"></div>

    <div style="padding-bottom: 26px;">
      <button type="button" style="width: 100%; height: 48px; border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; background: transparent; color: #c2c8db; font-family: inherit; font-size: 15px; font-weight: 550;">Sign out</button>

  </div>

</div>
