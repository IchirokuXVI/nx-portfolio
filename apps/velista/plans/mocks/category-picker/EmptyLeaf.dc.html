<style>
body { margin: 0; }
/* Tokens copied from libs/velista/ui/src/lib/styles, Day values, as one-field/ does. */
.vel {
  --app-font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --app-surface-ground: #f7f8fc; --app-surface-raised: #ffffff; --app-surface-sunken: #eef0f7;
  --app-text-primary: #111420; --app-text-secondary: #525a78; --app-text-muted: #616a8a; --app-text-on-action: #0a0c14;
  --app-border-subtle: #dde1ed; --app-border-strong: #6f7899;
  --app-action-bg: #ffb454; --app-action-quiet-fg: #8a5a12;
  --app-action-quiet-bg: rgba(255, 180, 84, 0.14); --app-action-quiet-border: rgba(255, 180, 84, 0.45);
  --app-focus-ring: #2f6fed;
  font-family: var(--app-font-sans); color: var(--app-text-primary);
}
.phone { position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--app-surface-ground); }
.ico { flex: none; display: block; }
/* the catalog tab, as CatalogPage draws it */
.cathead { flex: none; display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 0; }
.cathead h1 { margin: 0; font-family: Marcellus, Georgia, serif; font-weight: 400; font-size: 27px; line-height: 1.2; letter-spacing: 0.05em; }
.near { font-size: 12px; color: var(--app-text-muted); }
.tools { flex: none; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 8px; background: var(--app-surface-ground); }
.field { box-sizing: border-box; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid var(--app-border-strong); border-radius: 12px; background: var(--app-surface-raised); color: var(--app-text-muted); }
.field .ph { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chiprow { display: flex; align-items: center; gap: 8px; margin: 0 -16px; padding: 0 16px; overflow: hidden; }
.chip { flex: none; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--app-border-strong); border-radius: 999px; background: var(--app-surface-raised); color: var(--app-text-secondary); font-size: 14px; font-weight: 600; white-space: nowrap; text-decoration: none; }
.chip.on { border-color: var(--app-action-bg); background: var(--app-action-bg); color: var(--app-text-on-action); font-weight: 650; }
/* the way in: a link, so it wears the chevron the rows wear */
.chip.cats { gap: 6px; padding: 0 8px 0 11px; color: var(--app-text-primary); }
.chip.cats .lead { color: var(--app-action-quiet-fg); }
.chip.cats .chev { color: var(--app-text-muted); }
.sep { flex: none; width: 1px; height: 24px; background: var(--app-border-subtle); }
/* the chosen category: body link plus clear button, one pill */
.catchip { flex: none; box-sizing: border-box; display: inline-flex; align-items: stretch; height: 44px; max-width: 320px; border-radius: 999px; background: var(--app-action-bg); color: var(--app-text-on-action); overflow: hidden; }
.catchip .body { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 5px; padding: 0 10px 0 14px; color: inherit; font-size: 14px; text-decoration: none; }
.catchip .root { flex: 0 1 auto; min-width: 0; max-width: 7em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.catchip .mid { flex: none; font-weight: 500; }
.catchip .leaf { flex: none; white-space: nowrap; font-weight: 700; }
.catchip .x { flex: none; width: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-left: 1px solid rgba(10, 12, 20, 0.22); padding: 0; background: transparent; color: inherit; cursor: pointer; }
.pills { display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; border: 0; }
.legend { margin-right: 4px; font-size: 12px; color: var(--app-text-muted); }
.pill { box-sizing: border-box; height: 44px; padding: 0 12px; display: flex; align-items: center; border: 1px solid var(--app-border-strong); border-radius: 999px; color: var(--app-text-secondary); font-size: 14px; font-weight: 600; }
.pill.on { border-color: var(--app-action-quiet-border); background: var(--app-action-quiet-bg); color: var(--app-action-quiet-fg); font-weight: 650; }
.tnote { margin: 0; font-size: 12px; color: var(--app-text-muted); }
.list { flex: 1; min-height: 0; overflow: hidden; margin: 0; padding: 8px 16px 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.prow { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--app-border-subtle); border-radius: 16px; background: var(--app-surface-raised); }
.thumb { flex: none; box-sizing: border-box; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--app-border-subtle); border-radius: 12px; background: var(--app-surface-sunken); color: var(--app-text-muted); }
.what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pname { font-size: 16px; line-height: 1.2; }
.detail { font-size: 12px; color: var(--app-text-muted); }
.price { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
.amount { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.cap { font-size: 11px; color: var(--app-text-muted); }
.empty { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 16px; border: 1px solid var(--app-border-subtle); border-radius: 16px; text-align: center; }
.empty .et { margin: 0; font-size: 16px; font-weight: 650; }
.empty .eb { margin: 0; max-width: 34ch; font-size: 14px; line-height: 1.45; color: var(--app-text-secondary); }
.secondary { box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; height: 52px; margin-top: 8px; padding: 0 16px; border: 1px solid var(--app-border-strong); border-radius: 12px; background: transparent; color: var(--app-text-primary); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
/* the two picker pages: the page head, then one card of rows */
.page { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 8px 16px 0; }
.back { flex: none; width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; border-radius: 999px; background: transparent; color: var(--app-text-secondary); cursor: pointer; }
.ptitle { margin: 4px 0 0; font-family: Marcellus, Georgia, serif; font-weight: 400; font-size: 27px; line-height: 1.2; }
.group { flex: none; margin: 16px 0 0; padding: 0; list-style: none; border: 1px solid var(--app-border-subtle); border-radius: 16px; background: var(--app-surface-raised); overflow: hidden; }
.group li { border-top: 1px solid var(--app-border-subtle); }
.group li:first-child { border-top: 0; }
.crow { box-sizing: border-box; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 10px 8px 16px; color: var(--app-text-primary); text-decoration: none; }
.cname { flex: 1; min-width: 0; font-size: 16px; line-height: 1.25; }
.count { flex: none; font-size: 14px; color: var(--app-text-muted); font-variant-numeric: tabular-nums; }
.crow .chev { color: var(--app-text-muted); }
.crow.all .cname { font-weight: 600; }
.crow.current .cname { color: var(--app-action-quiet-fg); font-weight: 650; }
.crow .tick { color: var(--app-action-quiet-fg); margin-left: -4px; }
/* the nav (0097) */
.nav { flex: none; display: flex; gap: 4px; padding: 8px 10px 20px; border-top: 1px solid var(--app-border-subtle); background: var(--app-surface-ground); }
.tab { position: relative; flex: 1; height: 60px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--app-text-secondary); font-size: 12.5px; font-weight: 600; text-decoration: none; }
.tab.on { background: rgba(255, 180, 84, 0.18); color: var(--app-action-quiet-fg); }
.badge { position: absolute; top: 4px; left: calc(50% + 2px); min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--app-action-quiet-fg); color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
/* the anatomy board */
.spec { width: 860px; height: 1010px; box-sizing: border-box; padding: 32px 36px; background: var(--app-surface-ground); display: grid; grid-template-columns: 380px 1fr; column-gap: 40px; row-gap: 26px; align-content: start; }
.spec h2 { grid-column: 1 / -1; margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--app-text-muted); }
.spec .specimen { display: flex; align-items: center; gap: 8px; min-width: 0; }
.spec .specimen.col { flex-direction: column; align-items: stretch; gap: 0; }
.spec .say { font-size: 13px; line-height: 1.5; color: var(--app-text-secondary); }
.spec .say b { color: var(--app-text-primary); font-weight: 600; }
.spec code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 1px 5px; border-radius: 6px; background: var(--app-surface-sunken); color: var(--app-text-primary); }
.spec .group { margin: 0; }
</style>
</helmet>
