<style>
/* Day tokens copied from libs/velista/ui/src/lib/styles. Shared by every artboard of this canvas. */
body { margin: 0; }
.vel {
  --ground: #f7f8fc; --raised: #ffffff; --sunken: #eef0f7;
  --ink: #111420; --ink-2: #525a78; --ink-3: #616a8a;
  --line: #dde1ed; --line-strong: #6f7899;
  --amber: #ffb454; --amber-ink: #0a0c14; --amber-text: #8a5a12;
  --danger: #b3261e;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: var(--ink);
}
.vel button { font-family: inherit; cursor: pointer; }
.phone { position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--ground); }

/* page header, as plan 0130 */
.ph { flex: none; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--ground); }
.ph-icon { flex: none; width: 24px; height: 24px; margin-right: 8px; display: flex; align-items: center; justify-content: center; }
.ph-title { flex: 1 1 auto; min-width: 0; margin: 0; font-family: Marcellus, Georgia, serif; font-size: 20px; line-height: 28px; font-weight: 400; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-actions { flex: none; display: flex; align-items: center; margin-right: -10px; }
.ph-act { position: relative; flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); }
.ph-lead { margin-left: -10px; color: var(--ink); }
.ph-badge { position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 999px; background: var(--amber-text); color: #ffffff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

/* tools row, shop chip, total bar */
.tools { flex: none; display: flex; align-items: center; height: 48px; padding: 0 6px 0 16px; }
.tools .count { flex: 1; font-size: 15px; color: var(--ink-3); }

.est b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips { flex: none; display: flex; gap: 8px; padding: 0 16px 10px; }
.fchip { height: 32px; box-sizing: border-box; padding: 0 4px 0 12px; display: inline-flex; align-items: center; gap: 2px; border: 1px solid rgba(255, 180, 84, 0.45); border-radius: 999px; background: rgba(255, 180, 84, 0.14); color: var(--amber-text); font-size: 13px; font-weight: 600; white-space: nowrap; }
.fchip button { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; }
.ends { flex: none; padding: 0 16px 10px; }

.track i { display: block; height: 100%; background: var(--amber); }
.ends .cap { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* the list */
.rows { flex: 1; min-height: 0; overflow: hidden; border-top: 1px solid var(--line); }
.gh { display: flex; align-items: baseline; justify-content: space-between; height: 36px; box-sizing: border-box; margin: 0; padding: 14px 16px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 16px; font-weight: 600; color: var(--ink-2); }
.gh span { font-size: 12px; font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.band { display: flex; align-items: center; height: 44px; box-sizing: border-box; padding: 0 2px 0 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.band span { flex: 1; }
.row { display: flex; align-items: center; gap: 12px; height: 60px; box-sizing: border-box; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.settle { width: 26px; height: 26px; flex: none; box-sizing: border-box; border-radius: 999px; border: 1.5px solid var(--line-strong); margin: 0 2px; display: flex; align-items: center; justify-content: center; }
.settle.got { border: 0; background: var(--amber-text); color: #ffffff; }
.text { flex: 1; min-width: 0; }
.text b { display: block; font-size: 16px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.text span { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.text em { font-style: normal; font-weight: 600; color: var(--ink-2); }
.text em.na { color: var(--danger); }
.text em.ch { color: var(--amber-text); }
.row.done .text b { color: var(--ink-3); }
.qty { flex: none; width: 52px; height: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row.done .qty { border-color: transparent; background: transparent; color: var(--ink-3); font-weight: 400; }

/* composer and tab bar */
.composer { flex: none; display: flex; align-items: center; gap: 8px; height: 64px; box-sizing: border-box; padding: 8px 16px; border-top: 1px solid var(--line); background: var(--ground); }
.field { flex: 1; min-width: 0; height: 46px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 14px; background: var(--sunken); font-size: 17px; color: var(--ink-3); }
.field.typed { color: var(--ink); }
.send { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--amber); color: var(--amber-ink); }
.nav { flex: none; display: flex; gap: 4px; padding: 8px 10px 20px; border-top: 1px solid var(--line); background: var(--ground); }
.tab { position: relative; flex: 1; height: 60px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.tab.on { background: rgba(255, 180, 84, 0.18); color: var(--amber-text); }
.badge { position: absolute; top: 4px; left: calc(50% + 2px); min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--amber-text); color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

/* sheets */
.scrim { position: absolute; inset: 0; background: rgba(17, 20, 31, 0.42); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 8px 16px 20px; border-radius: 22px 22px 0 0; background: var(--raised); }
.sheet.tall { top: 72px; }
.grab { flex: none; width: 36px; height: 4px; margin: 0 auto 14px; border-radius: 2px; background: var(--line); }
.sh-title { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; }
.sh-sub { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-2); }
.lab { margin: 20px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 16px; font-weight: 600; color: var(--ink-2); }
.ln { display: flex; align-items: center; gap: 12px; min-height: 60px; box-sizing: border-box; border-bottom: 1px solid var(--line); }
.ask { flex: none; min-width: 20px; text-align: right; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chg { flex: none; height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); color: var(--ink); font-size: 14px; font-weight: 600; }
.chg[disabled] { border-color: transparent; color: var(--ink-3); font-weight: 400; cursor: default; }
.opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; box-sizing: border-box; border-bottom: 1px solid var(--line); cursor: pointer; }
.vel input[type='radio'] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.dot { flex: none; width: 24px; height: 24px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: 999px; }
.vel input[type='radio']:checked + .dot { border: 7px solid var(--amber-text); }
.vel input[type='radio']:focus-visible + .dot { outline: 2px solid #2563eb; outline-offset: 2px; }
.price { flex: none; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lr { display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 16px; text-decoration: none; }
.lr span { flex: 1; }
.lr svg { flex: none; color: var(--ink-2); }
.grow { flex: 1; min-height: 0; overflow: hidden; }
.fine { margin: 14px 0 12px; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.btn { flex: none; display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; box-sizing: border-box; border: 0; border-radius: 12px; background: var(--amber); color: var(--amber-ink); font-size: 16px; font-weight: 600; }
.btn.quiet { margin-top: 16px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink); }
.btn.plain { height: 44px; margin-top: 4px; background: transparent; color: var(--ink-2); font-weight: 400; }
.stack { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

/* the row sheet: a quantity that is a button, and the lists that do not ask yet */
.ln button.qty { height: 44px; color: var(--ink); }
.ln button.qty.zero { color: var(--ink-3); font-weight: 400; }
.disc { flex: none; display: flex; align-items: center; width: 100%; height: 56px; padding: 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 16px; text-align: left; }
.disc span { flex: 1; }
.disc svg { flex: none; color: var(--ink-2); }
.chk { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 4px 0 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.chk input { flex: none; appearance: none; -webkit-appearance: none; width: 18px; height: 18px; box-sizing: border-box; margin: 0; display: grid; place-content: center; border: 1.5px solid var(--line-strong); border-radius: 6px; background: var(--raised); cursor: pointer; }
.chk input:checked { border-color: var(--amber-text); background: var(--amber-text); }
.chk input:checked::after { content: ''; width: 9px; height: 5px; border-left: 2px solid #ffffff; border-bottom: 2px solid #ffffff; transform: translateY(-1px) rotate(-45deg); }
.chk input:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.labrow { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: 10px; border-bottom: 1px solid var(--line); }

.tbtn { flex: none; height: 44px; padding: 0 0 0 12px; border: 0; background: transparent; display: flex; align-items: center; color: var(--amber-text); font-size: 14px; font-weight: 600; text-decoration: none; }

/* the shop picker sheet, as plan 0124 draws it */
.sheet.shops { top: 44px; padding: 0; background: var(--ground); overflow: hidden; }
.sheet.shops .grab { margin: 10px auto 8px; }
.stitle { flex: none; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 6px 0 16px; }
.stitle h2 { flex: 1; margin: 0; font-size: 21px; font-weight: 650; }
.pbody { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 14px 16px 0; }
.sect { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px 2px; font-size: 13px; font-weight: 600; color: var(--ink-2); }

.pcard { flex: none; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--raised); overflow: hidden; }
.srow { display: grid; grid-template-columns: auto 1fr auto; column-gap: 12px; align-items: start; padding: 11px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.srow:first-child { border-top: 0; }

.srow.mid .dot { margin-top: 0; }
.logo { flex: none; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 750; color: #ffffff; }
.logo.plain { box-sizing: border-box; border: 1px solid var(--line); background: var(--sunken); color: var(--ink-2); }
.secs { display: flex; gap: 5px; margin-top: 7px; overflow: hidden; }
.sec { flex: none; height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.pfoot p { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-2); text-align: center; }
.pfoot { flex: none; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--ground); }

/* the catalog page, as plan 0134 draws it */
.cat-tools { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0; }
.cfield { height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--raised); color: var(--ink-3); }

.pick span { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick svg { flex: none; }
.pick.set { border-color: #e89a35; background: rgba(255, 180, 84, 0.1); color: var(--amber-text); }
.chead { flex: none; display: flex; align-items: center; min-height: 44px; padding: 0 16px; color: var(--ink-3); font-size: 12px; }
.chead button { margin-left: auto; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 14px; font-weight: 600; }
.chead button b { color: var(--ink); }
.cards { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
.card { position: relative; flex: none; display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--raised); cursor: pointer; }

.cprice b { font-size: 16px; line-height: 1.2; font-weight: 650; }

.usebar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px 24px; border-top: 1px solid var(--line); background: var(--raised); box-shadow: 0 -6px 16px rgba(17, 20, 31, 0.06); }
.usebar .btn { width: auto; padding: 0 22px; }

/* the catalog opened to choose */
.ctx { flex: none; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ctx b { display: block; font-size: 16px; line-height: 22px; font-weight: 600; }
