<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #8a5a12; text-decoration: none; }
    a:hover { color: #6d460c; }
    /* plan 0130: the one page header. 64px, one title style, always a bottom border. */
    .ph { flex: none; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #dde1ed; background: #f7f8fc; }
    .ph-lead { flex: none; width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 999px; background: transparent; color: #525a78; cursor: pointer; }
    .ph-icon { flex: none; width: 24px; height: 24px; margin-right: 8px; display: flex; align-items: center; justify-content: center; color: #111420; }
    .ph-title { flex: 1 1 auto; min-width: 0; margin: 0; font-family: Marcellus, Georgia, serif; font-size: 20px; line-height: 28px; font-weight: 400; letter-spacing: 0.05em; color: #111420; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ph-actions { flex: none; display: flex; align-items: center; margin-right: -10px; }
    .ph-act { position: relative; flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 999px; background: transparent; color: #525a78; cursor: pointer; }
    .ph-text { flex: none; height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: transparent; color: #8a5a12; font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  </style>
</helmet>

<div style="width: 470px; height: 1010px; background: #11141f; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 12px;">

  <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #98a0bb;">DAY &middot; the three indicators where they are actually read: a bright shop</span>
  <div style="width: 390px; height: 844px; background: #f7f8fc; color: #11141f; overflow: hidden; border-radius: 4px; display: flex; flex-direction: column;">

    <header class="ph">
      <button class="ph-lead" type="button" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg></button>
      <h1 class="ph-title">Weekly shop</h1>
      <div class="ph-actions">
        <button class="ph-act" type="button" aria-label="Filter and order"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"></path><circle cx="14.5" cy="7" r="2.3"></circle><circle cx="9.5" cy="17" r="2.3"></circle></svg></button>
        <button class="ph-act" type="button" aria-label="List settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
      </div>
    </header>

    <div style="flex: 0 0 auto; padding: 12px 20px 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <span style="font-size: 13.5px; color: #6f7899;">in Flat 3B</span>
        <span style="font-size: 13px; color: #8a5a12; font-variant-numeric: tabular-nums;">5 things needed</span>
      </div>
    </div>

    <div style="flex: 1 1 auto; background: #ffffff; border-top: 1px solid #dde1ed; overflow: hidden;">

      <div style="height: 56px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7;">
        <span style="flex: 1 1 auto; font-size: 16px; color: #11141f;">Milk</span>
        <span style="flex: 0 0 auto; min-width: 52px; height: 40px; border-radius: 12px; background: #eef0f7; border: 1px solid #dde1ed; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #11141f;">2</span>
      </div>

      <div style="min-height: 64px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7;">
        <div style="flex: 1 1 auto;">
          <div style="font-size: 16px; color: #6f7899;">Olive oil</div>
          <div style="margin-top: 3px; display: flex; align-items: center; gap: 5px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span style="font-size: 12.5px; color: #047857;">Bought</span>
          </div>
        </div>
        <span style="flex: 0 0 auto; min-width: 52px; height: 40px; border-radius: 12px; border: 1px solid #eef0f7; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #c2c8db;">0</span>
      </div>

      <div style="min-height: 64px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7;">
        <div style="flex: 1 1 auto;">
          <div style="font-size: 16px; color: #11141f;">Sourdough loaf</div>
          <div style="margin-top: 3px; display: flex; align-items: center; gap: 5px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M7 7l10 10" stroke="#be123c" stroke-width="2.4" stroke-linecap="round"/></svg>
            <span style="font-size: 12.5px; color: #be123c;">Not in the shop last time</span>
          </div>
        </div>
        <span style="flex: 0 0 auto; min-width: 52px; height: 40px; border-radius: 12px; background: #eef0f7; border: 1px solid #dde1ed; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #11141f;">1</span>
      </div>

      <div style="min-height: 64px; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7;">
        <div style="flex: 1 1 auto;">
          <div style="font-size: 16px; color: #11141f;">Eggs</div>
          <div style="margin-top: 3px; display: flex; align-items: center; gap: 6px;">
            <span style="width: 6px; height: 6px; border-radius: 999px; background: #1d4ed8;"></span>
            <span style="font-size: 12.5px; color: #1d4ed8;">Ana is buying this</span>
          </div>
        </div>
        <span style="flex: 0 0 auto; min-width: 52px; height: 40px; border-radius: 12px; background: #eef0f7; border: 1px solid #dde1ed; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #11141f;">12</span>
      </div>

      <div style="height: 56px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7;">
        <span style="flex: 1 1 auto; font-size: 16px; color: #6f7899;">Fairy liquid</span>
        <span style="flex: 0 0 auto; min-width: 52px; height: 40px; border-radius: 12px; border: 1px solid #eef0f7; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #c2c8db;">0</span>
      </div>

      <div style="position: relative; min-height: 72px; padding: 11px 8px 11px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eef0f7; background: #f3efff;">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #6d28d9;"></span>
        <div style="flex: 1 1 auto; min-width: 0;">
          <div style="font-size: 16px; color: #11141f;">Coffee beans</div>
          <div style="margin-top: 3px; font-size: 12.5px; color: #6d28d9;">Waiting for approval &middot; Marc</div>
        </div>
        <span style="flex: 0 0 auto; min-width: 52px; height: 40px; border-radius: 12px; background: #ffffff; border: 1px solid #ddd2fb; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #11141f;">1</span>
      </div>

    </div>

    <div style="flex: 0 0 auto; background: #ffffff; border-top: 1px solid #dde1ed; padding: 10px 12px 26px; display: flex; align-items: center; gap: 10px;">
      <div style="flex: 1 1 auto; height: 46px; border-radius: 14px; background: #f7f8fc; border: 1px solid #dde1ed; display: flex; align-items: center; padding: 0 14px;">
        <span style="font-size: 15.5px; color: #6f7899;">Add something</span>
      </div>
      <div style="flex: 0 0 auto; height: 46px; border-radius: 14px; background: #f7f8fc; border: 1px solid #dde1ed; display: flex; align-items: center;">
        <span style="width: 34px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #c2c8db;">&minus;</span>
        <span style="min-width: 16px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; color: #525a78;">1</span>
        <span style="width: 34px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #525a78;">+</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
