<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #ffb454; text-decoration: none; }
    a:hover { color: #ffc271; }
  </style>
</helmet>

<div style="width: 470px; height: 1010px; background: #11141f; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 12px;">

  <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #98a0bb;">DELETE &middot; the only gesture that discards the history</span>
  <div style="width: 390px; height: 844px; background: #0a0c14; color: #f7f8fc; overflow: hidden; border-radius: 4px; position: relative;">

    <div style="position: absolute; inset: 0; background: #161a28; opacity: 0.4;"></div>
    <div style="position: absolute; inset: 0; background: rgba(6, 8, 14, 0.74);"></div>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #161a28; border-top-left-radius: 22px; border-top-right-radius: 22px; padding: 10px 20px 28px; box-shadow: 0 -18px 40px rgba(0,0,0,0.42);">
      <div style="width: 38px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); margin: 0 auto 18px;"></div>

      <div style="font-size: 21px; font-weight: 650; letter-spacing: -0.01em; margin-bottom: 6px;">Delete &ldquo;Milk&rdquo;?</div>
      <div style="font-size: 13.5px; line-height: 1.5; color: #98a0bb; margin-bottom: 4px;">Its buy history goes with it. A line at zero keeps its history and costs nothing; deleting is for things this list should not know about any more.</div>

      <button type="button" style="width: 100%; height: 52px; margin-top: 18px; border: 0; border-radius: 14px; background: #fb7185; color: #0a0c14; font-family: inherit; font-size: 16px; font-weight: 650;">Delete the line</button>
      <div style="display: flex; align-items: center; justify-content: center; height: 44px; margin-top: 2px;">
        <span style="font-size: 14.5px; font-weight: 500; color: #98a0bb;">Keep it</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
