<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #8a5a12; text-decoration: none; }
    a:hover { color: #6d460c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f7f8fc; color: #11141f; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px; background: #ffffff; border-bottom: 1px solid #dde1ed;">
    <div style="display: flex; align-items: center;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-label="App mark, placeholder until the product is named">
        <rect x="2.5" y="2.5" width="19" height="19" rx="6" fill="#ffb454"/>
        <path d="m7.8 12.4 2.9 2.9 5.5-6.2" stroke="#0a0c14" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div style="display: flex; align-items: center; gap: 2px;">
      <button type="button" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer;" aria-label="Search">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#525a78" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.6"/>
          <path d="m16 16 4 4"/>
        </svg>
      </button>
      <button type="button" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; cursor: pointer;" aria-label="Your account">
        <span style="width: 30px; height: 30px; border-radius: 999px; background: #eef0f7; border: 1px solid #dde1ed; color: #11141f; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">D</span>
      </button>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 18px 20px 0;">

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.07em; color: #6f7899;">PICK UP WHERE YOU LEFT OFF</span>
      <div style="background: #ffffff; border: 1px solid #dde1ed; border-radius: 18px; padding: 15px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(17,20,31,0.04), 0 2px 6px rgba(17,20,31,0.05);">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <span style="font-size: 18px; font-weight: 600; color: #11141f;">Weekly shop</span>
            <span style="font-size: 12.5px; color: #6f7899;">Home &middot; 12 items</span>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98a0bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 6 6 6-6 6"/>
          </svg>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="height: 6px; border-radius: 999px; background: #eef0f7; overflow: hidden;">
            <div style="width: 58%; height: 100%; border-radius: 999px; background: #059669;"></div>
          </div>
          <span style="font-size: 12px; color: #047857;">7 of 12 ready</span>
        </div>

        <div style="display: flex; align-items: center; gap: 9px; padding-top: 2px; border-top: 1px solid #eef0f7;">
          <div style="display: flex; align-items: center; padding-top: 10px;">
            <span style="width: 24px; height: 24px; border-radius: 999px; background: #6d28d9; border: 2px solid #ffffff; color: #ffffff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center;">A</span>
            <span style="width: 24px; height: 24px; border-radius: 999px; background: #1d4ed8; border: 2px solid #ffffff; color: #ffffff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: -8px;">M</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; padding-top: 10px;">
            <span style="width: 6px; height: 6px; border-radius: 999px; background: #059669;"></span>
            <span style="font-size: 12px; color: #525a78;">Ana and Marc are shopping now</span>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.07em; color: #6f7899;">YOUR GROUPS</span>
        <button type="button" style="height: 30px; padding: 0 4px; display: flex; align-items: center; gap: 6px; background: transparent; border: none; color: #8a5a12; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a5a12" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          New group
        </button>
      </div>

      <div style="background: #ffffff; border: 1px solid #dde1ed; border-radius: 18px; padding: 14px 15px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 1px 2px rgba(17,20,31,0.04), 0 2px 6px rgba(17,20,31,0.05);">
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="width: 38px; height: 38px; border-radius: 12px; background: #fdf1dd; color: #8a5a12; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">H</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 7px;">
              <span style="font-size: 16px; font-weight: 600; color: #11141f;">Home</span>
              <span style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; color: #8a5a12; background: #fdf1dd; border: 1px solid #f2d8a8; border-radius: 999px; padding: 2px 7px;">OWNER</span>
            </div>
            <span style="font-size: 12.5px; color: #6f7899;">3 members &middot; 2 lists</span>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98a0bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 6 6 6-6 6"/>
          </svg>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 11px; background: #f3efff; border: 1px solid #ddd2fb; border-radius: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 19v-1.6a3.4 3.4 0 0 0-3.4-3.4H6.4A3.4 3.4 0 0 0 3 17.4V19"/>
            <circle cx="9.5" cy="7.4" r="3.4"/>
            <path d="M19 8.4v4M21 10.4h-4"/>
          </svg>
          <span style="flex: 1; font-size: 13px; font-weight: 500; color: #3b2a63;">Ines and 2 more want to join</span>
          <span style="font-size: 12.5px; font-weight: 600; color: #6d28d9;">Review</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="display: flex; align-items: center; gap: 10px; height: 40px; border-top: 1px solid #eef0f7;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#98a0bb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 6h11M8 12h11M8 18h11M4 6h.01M4 12h.01M4 18h.01"/>
            </svg>
            <span style="flex: 1; font-size: 14.5px; color: #11141f;">Weekly shop</span>
            <span style="font-size: 12px; color: #047857;">7 of 12 ready</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; height: 40px; border-top: 1px solid #eef0f7;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#98a0bb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 6h11M8 12h11M8 18h11M4 6h.01M4 12h.01M4 18h.01"/>
            </svg>
            <span style="flex: 1; font-size: 14.5px; color: #11141f;">Costco run</span>
            <span style="font-size: 12px; color: #6f7899;">4 items</span>
          </div>
        </div>
      </div>

      <div style="background: #ffffff; border: 1px solid #dde1ed; border-radius: 18px; padding: 14px 15px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 1px 2px rgba(17,20,31,0.04), 0 2px 6px rgba(17,20,31,0.05);">
        <div style="display: flex; align-items: center; gap: 11px;">
          <span style="width: 38px; height: 38px; border-radius: 12px; background: #eef0f7; color: #525a78; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">F</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 7px;">
              <span style="font-size: 16px; font-weight: 600; color: #11141f;">Flat 3B</span>
              <span style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; color: #525a78; background: #eef0f7; border: 1px solid #dde1ed; border-radius: 999px; padding: 2px 7px;">MEMBER</span>
            </div>
            <span style="font-size: 12.5px; color: #6f7899;">5 members &middot; 1 list</span>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#98a0bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 6 6 6-6 6"/>
          </svg>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; height: 40px; border-top: 1px solid #eef0f7;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#98a0bb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 6h11M8 12h11M8 18h11M4 6h.01M4 12h.01M4 18h.01"/>
          </svg>
          <span style="flex: 1; font-size: 14.5px; color: #11141f;">Party supplies</span>
          <span style="font-size: 12px; color: #6f7899;">8 items</span>
        </div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 20px 22px; background: #ffffff; border-top: 1px solid #dde1ed;">
    <button type="button" style="flex: 1; height: 52px; border: none; border-radius: 14px; background: #ffb454; color: #0a0c14; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0a0c14" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      New list
    </button>
    <button type="button" style="width: 52px; height: 52px; border: 1px solid #c2c8db; border-radius: 14px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="Join a group with a code">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#525a78" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.2" y="6.2" width="17.6" height="11.6" rx="2.6"/>
        <path d="M7.6 12h1.6M11.2 12h1.6M14.8 12h1.6"/>
      </svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
