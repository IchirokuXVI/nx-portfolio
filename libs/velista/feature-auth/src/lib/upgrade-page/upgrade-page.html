<lib-auth-screen
  (back)="back()"
  [backLabel]="'auth.upgrade.later' | rokuT"
  [lede]="'auth.upgrade.body' | rokuT"
  [title]="'auth.upgrade.title' | rokuT"
>
  <!-- Above the fields, because it is the reason to fill them in. It names their own
       number of groups, which is what turns a general promise into a specific one. -->
  <lib-success-note [message]="keepsafe()" class="keepsafe" />

  <!-- The one form register and upgrade share (velista 0173). Google is offered here
       too: the state carries this guest's bearer, so the guest is linked in place and
       keeps every group (backend 0230). -->
  <lib-account-form
    (continueWithGoogle)="continueWithGoogle()"
    (submitted)="submit($event)"
    [error]="error()"
    [googleBusy]="googleStarting()"
    [googleError]="googleError()"
    [googleOffered]="terms.googleOffered()"
    [privacyUrl]="terms.privacyUrl()"
    [submitting]="submitting()"
    [termsUrl]="terms.termsUrl()"
    mode="upgrade"
  />

  <!-- Not now, and nothing else: register is barred to a guest by rule C2. -->
  <p authFooter class="footer">
    <button (click)="back()" class="footer-link quiet" type="button">
      {{ 'auth.upgrade.later' | rokuT }}
    </button>
  </p>
  <!-- The privacy policy and the terms (velista 0172), projected as a second footer
       so they sit where the front door keeps its version: last on the screen. -->
  <lib-legal-links
    [privacyUrl]="legalUrls().privacy"
    [termsUrl]="legalUrls().terms"
    authFooter
  />
</lib-auth-screen>

<!-- The terms and the privacy policy as sheets over this form (velista 0173, D5). -->
<router-outlet />
