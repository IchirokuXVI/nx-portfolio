@if (askedFor(); as address) {
  <!-- Says what we did, never what arrived: the server answers the same for every
       address, so the page cannot know whether a mail went out (velista 0148). -->
  <lib-auth-screen
    (back)="back()"
    [backLabel]="'auth.back' | rokuT"
    [lede]="'auth.forgot.sentBody' | rokuT: { email: address }"
    [title]="'auth.forgot.sentTitle' | rokuT"
  >
    <p class="rule-line">{{ 'auth.forgot.sentRule' | rokuT }}</p>

    <lib-resend-sentence
      (resend)="sendAgain()"
      [state]="resendState()"
      [waitSeconds]="resendWaitSeconds()"
      actionKey="auth.forgot.again"
      promptKey="auth.forgot.prompt"
      sentKey="auth.forgot.waiting"
      sentNoWaitKey="auth.forgot.waitingNoWait"
    />

    <p authFooter class="footer">
      {{ 'auth.forgot.wrongEmail' | rokuT }}
      <button (click)="changeEmail()" class="footer-link" type="button">
        {{ 'auth.forgot.change' | rokuT }}
      </button>
    </p>
  </lib-auth-screen>
} @else {
  <lib-auth-screen
    (back)="back()"
    [backLabel]="'auth.back' | rokuT"
    [lede]="'auth.forgot.body' | rokuT"
    [title]="'auth.forgot.title' | rokuT"
  >
    <form (submit)="onSubmit($event)" class="form">
      <lib-email-field
        [(value)]="email"
        [describedBy]="error() === null ? null : errorId"
        [invalid]="error() !== null"
        [label]="'auth.field.email' | rokuT"
        [placeholder]="'auth.field.emailPlaceholder' | rokuT"
        [readOnly]="submitting()"
        fieldId="forgot-email"
      />

      @if (error(); as rejection) {
        <lib-form-error
          [message]="rejection.copy.key | rokuT: { wait: rejection.wait }"
          [messageId]="errorId"
        />
      }

      <button
        [attr.aria-busy]="submitting()"
        [disabled]="!canSubmit()"
        class="primary"
        type="submit"
      >
        @if (submitting()) {
          <lib-spinner-icon class="glyph" />
        }
        {{ 'auth.forgot.submit' | rokuT }}
      </button>
    </form>

    <p authFooter class="footer">
      {{ 'auth.forgot.remembered' | rokuT }}
      <button (click)="signIn()" class="footer-link" type="button">
        {{ 'auth.forgot.signIn' | rokuT }}
      </button>
    </p>
  </lib-auth-screen>
}
