<lib-auth-screen
  (back)="back()"
  [backLabel]="'auth.back' | rokuT"
  [lede]="'auth.register.body' | rokuT"
  [title]="'auth.register.title' | rokuT"
>
  <!-- The one form register and upgrade share (velista 0173): the fields, the
       checkbox for the terms, the privacy line, the error, the submit, and Google with
       its line. What is register's own stays here: the call, the conflict's route to
       sign in, and the footer. -->
  <lib-account-form
    (continueWithGoogle)="continueWithGoogle()"
    (errorAction)="signIn()"
    (submitted)="submit($event)"
    [error]="error()"
    [googleBusy]="googleStarting()"
    [googleError]="googleError()"
    [googleOffered]="terms.googleOffered()"
    [privacyUrl]="terms.privacyUrl()"
    [submitting]="submitting()"
    [termsUrl]="terms.termsUrl()"
    mode="register"
  />

  <p authFooter class="footer">
    {{ 'auth.register.haveOne' | rokuT }}
    <button (click)="signIn()" class="footer-link" type="button">
      {{ 'auth.signIn.submit' | rokuT }}
    </button>
  </p>
  <!-- The privacy policy and the terms (velista 0172), projected as a second footer
       so they sit where the front door keeps its version: last on the screen. -->
  <lib-legal-links
    [privacyUrl]="legalUrls().privacy"
    [termsUrl]="legalUrls().terms"
    authFooter
  />
</lib-auth-screen>

<!-- The terms and the privacy policy as sheets over this form (velista 0173, D5). -->
<router-outlet />
