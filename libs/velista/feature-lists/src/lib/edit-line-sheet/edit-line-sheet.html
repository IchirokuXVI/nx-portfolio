<lib-sheet-shell
  (dismiss)="dismiss()"
  [dismissible]="!submitting()"
  #shell
  labelledBy="edit-line-title"
>
  <h2 class="title" id="edit-line-title">{{ 'list.edit.title' | rokuT }}</h2>

  <!-- The content is live in both modes: fixing what a line says is what the sheet is
  for, and plan 0066 opened it to the writer whose line was approved before they read it
  back. -->
  <label class="label" for="edit-line-content">
    {{ 'list.edit.content' | rokuT }}
  </label>
  <input
    (input)="onContentInput($event)"
    [attr.maxlength]="maxLength"
    [value]="content()"
    autocomplete="off"
    class="field"
    id="edit-line-content"
    type="text"
  />

  <!--
    Two modes of one sheet (plan 0030, section 4; plan 0066, section 2.1). In `content`
    mode the quantity is **shown and not editable** rather than hidden: the words being
    changed are the words for a number of something, and a sheet that dropped the count
    is one you have to remember the row for. A paragraph and not a disabled stepper,
    because a greyed out control invites a tap that does nothing, and nothing here is
    going to become editable later.
  -->
  <div class="quantity-row">
    <span class="label">{{ 'list.add.quantity' | rokuT }}</span>
    @if (scope() === 'full') {
      <lib-quantity-stepper [(value)]="quantity" [disabled]="submitting()" />
    } @else {
      <p class="shown">{{ quantity() }}</p>
    }
  </div>

  <!--
    Before the save, not after it (plan 0066, section 3). A row that quietly went back to
    awaiting approval under somebody who was fixing a typo is confusing exactly once per
    person, which is once too many for a sentence this cheap.

    `role="status"` rather than `alert`: this is what is about to happen, not a failure.
  -->
  @if (warnsAboutUnapproval()) {
    <p class="notice" role="status">{{ 'list.edit.unapproves' | rokuT }}</p>
  }

  @if (errorKey(); as key) {
    <p class="error" role="alert">{{ key | rokuT }}</p>
  }

  <button
    (click)="submit()"
    [attr.aria-busy]="submitting()"
    [disabled]="!canSubmit()"
    class="primary"
    type="button"
  >
    @if (submitting()) {
      <lib-spinner-icon class="spinning" />
    }
    <span>{{ 'list.edit.save' | rokuT }}</span>
  </button>

  @if (!submitting()) {
    <button (click)="shell.requestDismiss()" class="cancel" type="button">
      {{ 'entry.cancel' | rokuT }}
    </button>
  }
</lib-sheet-shell>
