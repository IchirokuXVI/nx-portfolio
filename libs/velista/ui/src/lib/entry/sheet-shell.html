<!--
  The scrim is a real button rather than a div with a click handler, so tapping it is
  a control the platform understands and the template needs no keyboard handler bolted
  onto a non interactive element. It is deliberately out of the tab order: Escape and
  the sheet's own Cancel are the keyboard paths out, and a focusable scrim would put
  an unnamed stop between the two ends of the trap. Hidden from assistive technology
  for the same reason: `aria-modal` on the panel already says everything outside it is
  unavailable, and a second way to say "close" would just be one more thing to hear.
-->
<button
  (click)="requestDismiss()"
  [disabled]="!dismissible() || closing()"
  aria-hidden="true"
  class="scrim"
  tabindex="-1"
  type="button"
></button>

<div
  [attr.aria-labelledby]="labelledBy()"
  [class.closing]="closing()"
  [class.dragging]="dragging()"
  [class.has-footer]="hasFooter()"
  [class.settling]="settling()"
  [style.transform]="
    dragOffset() === null ? null : 'translateY(' + dragOffset() + 'px)'
  "
  aria-modal="true"
  class="panel"
  role="dialog"
>
  <!--
    The handle, and the strip of panel it is centred in.

    Two elements because the bar is a hint and the target is not: the bar stays small
    enough to read as a hint and the strip around it is the full width of the panel and
    tall enough to catch a thumb. `touch-action: none` on the strip is what makes the
    drag possible at all, and it is the fix for the worse half of the old behaviour:
    without it the browser claimed the downward gesture, and at the top of the document
    that gesture is pull to refresh, so trying to drag the sheet closed reloaded the
    page instead.

    Still hidden from assistive technology and still not focusable. Dragging is a
    convenience on top of Escape, Cancel and the back button, all of which already close
    the sheet and are all already announced; a fourth control in the trap, first in
    document order, would take the focus that belongs to the field.
  -->
  <div
    (pointercancel)="endDrag($event)"
    (pointerdown)="startDrag($event)"
    (pointermove)="onDrag($event)"
    (pointerup)="endDrag($event)"
    aria-hidden="true"
    class="grabber"
  >
    <span class="handle"></span>
  </div>

  <!--
    The body, which is the thing that scrolls. It used to be the panel itself, and a
    sheet that wanted a bar along its bottom had to make one sticky, which reserves its
    space at the end of the document and paints its pixels at the bottom of the window:
    the two are the same place only at the last scroll position (plan 0040, section 1).
    A column with the scroll on the middle child has no such gap.
  -->
  <div (scroll)="bodyScroll.emit()" #body class="sheet-body">
    <ng-content />
  </div>

  <!--
    Nothing is drawn here unless a caller says there is something to draw, so the nine
    sheets with no footer keep no border, no background and no height they did not have
    before. Angular offers no signal for an empty named slot, so the caller states it.
  -->
  @if (hasFooter()) {
    <div class="sheet-footer">
      <ng-content select="[sheetFooter]" />
    </div>
  }
</div>
