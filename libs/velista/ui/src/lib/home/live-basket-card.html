@let vm = summary();

<!--
  One tap target for the whole strip, with the chevron as decoration inside it
  rather than a control of its own, exactly as the card below it is.

  The accessible name is stated rather than read off the parts, and it carries
  what is **left**: somebody deciding whether to open this wants to know what is
  still to buy, not what has been got. Before the numbers land the name is the
  title alone, because a count nobody has read yet is not a fact.
-->
<button
  (click)="open.emit()"
  [attr.aria-label]="
    vm === null
      ? ('basket.live.title' | rokuT)
      : ('home.liveBasket.open' | rokuT: { pending: vm.pending })
  "
  class="card"
  type="button"
>
  <span class="titles">
    <span class="name">{{ 'basket.live.title' | rokuT }}</span>

    @if (vm !== null) {
      <!--
        What is left, then what this trip got (velista `0091`, section 4). The
        sentence is chosen by the model and drawn here, so the card and the page
        it opens cannot say two different things about one basket.
      -->
      <span class="meta">
        {{ vm.sentence.key | rokuT: vm.sentence.args }}
        @if (vm.sentence.unavailable > 0) {
          <span class="unavailable">
            {{
              'basket.progressUnavailable'
                | rokuT: { count: vm.sentence.unavailable }
            }}
          </span>
        }
      </span>
    } @else if (loading()) {
      <!--
        The height the sentence will take, so the dock does not grow under a
        thumb already on its way to the card. Hidden from the reader: the row
        announces nothing until there is something to announce.
      -->
      <span aria-hidden="true" class="meta-skeleton"></span>
    }
  </span>

  <lib-chevron-right-icon class="chevron" />
</button>
