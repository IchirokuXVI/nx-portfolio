<header class="bar">
  <!--
    Plain, and not a link: this bar is drawn on the front door alone, where the
    lockup's destination would be the page being looked at, and a control that leads
    nowhere is worse than no control. It carries no `aria-label` of its own, because
    the wordmark already names it.
  -->
  <div class="lockup">
    <lib-brand-wordmark class="wordmark" />
  </div>

  <div class="locale-menu">
    <button
      (click)="toggleMenu()"
      [attr.aria-expanded]="hasMenu() ? menuOpen() : null"
      [attr.aria-haspopup]="hasMenu() ? 'menu' : null"
      [attr.aria-label]="'home.action.changeLocale' | rokuT"
      #localeTrigger
      class="locale"
      type="button"
    >
      <span aria-hidden="true">{{ locale() }}</span>
      @if (hasMenu()) {
        <lib-chevron-down-icon [class.open]="menuOpen()" class="chevron" />
      }
    </button>

    @if (menuOpen()) {
      <div class="menu" role="menu">
        @for (option of locales(); track option) {
          <button
            (click)="pick(option)"
            [attr.aria-current]="isCurrent(option) ? 'true' : null"
            class="menu-item"
            role="menuitem"
            type="button"
          >
            {{ option.toLocaleUpperCase() }}
          </button>
        }
      </div>
    }
  </div>
</header>
