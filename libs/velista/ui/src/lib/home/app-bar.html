<header [class.bordered]="bordered()" class="bar">
  <div class="lockup">
    <lib-brand-wordmark class="wordmark" />
  </div>

  @if (signedIn()) {
    <div class="actions">
      <!--
        The socket is down, said from every screen rather than only from a list
        (plan 0035, section 5.3). Only in this branch, because R1 opens no socket at all
        while anonymous, so a mark on the landing page would be permanently on and would
        mean nothing.

        A `span` and not a `button`: it reports a state and leads nowhere, and a control
        that leads nowhere is worse than no control. Its accessible name sits on the
        element rather than on the glyph, which is hidden like every other icon here.
      -->
      @if (!connected()) {
        <span
          [attr.aria-label]="'connection.notLive' | rokuT"
          class="offline-mark"
          role="img"
        >
          <lib-offline-icon aria-hidden="true" class="offline-glyph" />
        </span>
      }

      <button
        (click)="openAssistant.emit()"
        [attr.aria-label]="'home.action.assistant' | rokuT"
        class="icon-button assistant"
        type="button"
      >
        <lib-comment-icon class="glyph" />
      </button>

      <button
        (click)="account.emit()"
        [attr.aria-label]="'home.action.account' | rokuT"
        class="icon-button"
        type="button"
      >
        <span aria-hidden="true" class="avatar">{{
          accountInitial() ?? '·'
        }}</span>
      </button>
    </div>
  } @else {
    <div class="locale-menu">
      <button
        (click)="toggleMenu()"
        [attr.aria-expanded]="hasMenu() ? menuOpen() : null"
        [attr.aria-haspopup]="hasMenu() ? 'menu' : null"
        [attr.aria-label]="'home.action.changeLocale' | rokuT"
        #localeTrigger
        class="locale"
        type="button"
      >
        <span aria-hidden="true">{{ locale() }}</span>
        @if (hasMenu()) {
          <lib-chevron-down-icon [class.open]="menuOpen()" class="chevron" />
        }
      </button>

      @if (menuOpen()) {
        <div class="menu" role="menu">
          @for (option of locales(); track option) {
            <button
              (click)="pick(option)"
              [attr.aria-current]="isCurrent(option) ? 'true' : null"
              class="menu-item"
              role="menuitem"
              type="button"
            >
              {{ option.toLocaleUpperCase() }}
            </button>
          }
        </div>
      }
    </div>
  }
</header>
