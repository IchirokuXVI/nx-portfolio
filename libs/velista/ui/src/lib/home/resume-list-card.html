<section class="wrapper">
  <h2 class="section-label">{{ 'home.section.resume' | rokuT }}</h2>

  <!--
    A button rather than a link, and deliberately: the list detail route does not
    exist yet (plan 0003 defers it to its own plan), and a link to `#` is a dead
    control that still reads as a link to a screen reader. The container owns where
    this goes, so when the route lands only it changes.

    One tap target for the whole card, with the chevron as decoration inside it rather
    than a control of its own (plan 0003, section 7).
  -->
  <button (click)="open.emit({ zoneId: list().zoneId, listId: list().listId })" class="card" type="button">
    <div class="head">
      <div class="titles">
        <span class="list-name">{{ list().listName }}</span>
        <span class="meta">
          {{ list().zoneName }}
          @if (list().lineCount !== undefined) {
            <span aria-hidden="true"> &middot; </span>
            {{ 'home.list.items' | rokuT: { count: list().lineCount } }}
          }
        </span>
      </div>
      <lib-chevron-right-icon class="chevron" />
    </div>

    @if (progress(); as percent) {
      <div class="progress">
        <div
          [attr.aria-valuenow]="percent"
          aria-valuemax="100"
          aria-valuemin="0"
          class="track"
          role="progressbar"
        >
          <div [style.width.%]="percent" class="fill"></div>
        </div>
        <span class="progress-label">{{
          'home.progress.ready'
            | rokuT: { ready: list().readyCount, total: list().lineCount }
        }}</span>
      </div>
    }

    @if (list().shoppers.length > 0) {
      <div class="presence">
        <div aria-hidden="true" class="avatars">
          @for (initial of initials(); track $index) {
            <span class="avatar">{{ initial }}</span>
          }
        </div>
        <!--
          Presence changes without the user doing anything, so it is announced
          politely rather than silently updated (plan 0003, section 7).
        -->
        <div aria-live="polite" class="presence-text">
          <span aria-hidden="true" class="dot"></span>
          <span>{{
            'home.presence.shopping' | rokuT: { names: shopperNames() }
          }}</span>
        </div>
      </div>
    }
  </button>
</section>
