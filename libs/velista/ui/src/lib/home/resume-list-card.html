<section class="wrapper">
  <h2 class="section-label">{{ 'home.section.resume' | rokuT }}</h2>

  <!--
    A button rather than a link, and deliberately: the list detail route does not
    exist yet (plan 0003 defers it to its own plan), and a link to `#` is a dead
    control that still reads as a link to a screen reader. The container owns where
    this goes, so when the route lands only it changes.

    One tap target for the whole card, with the chevron as decoration inside it rather
    than a control of its own (plan 0003, section 7).
  -->
  <button
    (click)="open.emit({ zoneId: list().zoneId, listId: list().listId })"
    class="card"
    type="button"
  >
    <div class="head">
      <div class="titles">
        <span class="list-name">{{ list().listName }}</span>
        <span class="meta">
          {{ list().zoneName }}
          @if (list().lineCount !== undefined) {
            <span aria-hidden="true"> &middot; </span>
            {{ 'home.list.items' | rokuT: { count: list().lineCount } }}
          }
        </span>
      </div>
      <lib-chevron-right-icon class="chevron" />
    </div>

    @if (progress(); as percent) {
      <div class="progress">
        <div
          [attr.aria-valuenow]="percent"
          aria-valuemax="100"
          aria-valuemin="0"
          class="track"
          role="progressbar"
        >
          <div [style.width.%]="percent" class="fill"></div>
        </div>
        <span class="progress-label">{{
          'home.progress.ready'
            | rokuT: { ready: list().wantedCount, total: list().lineCount }
        }}</span>
      </div>
    }

    <!--
      Who is here, drawn by the component that draws the same fact on a group card and
      on a group's own page, in the same words: "here now" says the one thing every one
      of these surfaces actually knows, and it reads the same whether the room is a
      group or a list (plan 0022). It renders nothing when nobody is there, which is
      also the answer before the first broadcast and the instant the socket drops.
    -->
    <lib-presence-row
      [names]="list().shoppers"
      class="presence"
      messageKey="home.presence.here"
    />
  </button>
</section>
