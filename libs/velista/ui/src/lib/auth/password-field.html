<label [attr.for]="fieldId()" class="label">{{ label() }}</label>

<div [class.invalid]="invalid()" class="box">
  <!--
    `autocomplete` stays on the input whichever way the toggle is pointing. Swapping
    the type is the whole of revealing a password; dropping the attribute as well is
    what stops a password manager ever offering to save it.
  -->
  <input
    (input)="onInput($event)"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="invalid()"
    [attr.autocomplete]="autocomplete()"
    [attr.maxlength]="maxLength"
    [id]="fieldId()"
    [placeholder]="placeholder()"
    [readOnly]="readOnly()"
    [type]="revealed() ? 'text' : 'password'"
    [value]="value()"
    autocapitalize="off"
    autocorrect="off"
    class="field"
    spellcheck="false"
  />

  <button
    (click)="toggleReveal()"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="revealed()"
    [disabled]="readOnly()"
    class="reveal"
    type="button"
  >
    @if (revealed()) {
      <lib-eye-off-icon class="reveal-glyph" />
    } @else {
      <lib-eye-icon class="reveal-glyph" />
    }
  </button>
</div>

@if (rule(); as sentence) {
  <!-- Not an error and not `role="alert"`: it is the rule, on screen from the start,
       and it turns from muted to met as the person types past eight characters. -->
  <p [class.met]="ruleMet()" class="password-rule">
    @if (ruleMet()) {
      <lib-check-outline-icon aria-hidden="true" class="password-rule-glyph" />
    }
    {{ sentence }}
  </p>
}
