<!-- A `div`, and no heading: the page header above holds the name (velista `0130`). -->
<div class="summary">
  <!--
    The first line of the content. The role leads it and is always there; the presence
    row after it is absent when the caller is the only one here, and absent for
    everybody the moment the socket drops, which the stale notice below explains once
    for the whole screen (plan 0022, 3.2).
  -->
  <div class="here">
    <lib-role-chip [role]="group().role" />

    <lib-presence-row
      [names]="group().online"
      countKey="home.presence.hereCount"
      messageKey="home.presence.here"
    />
  </div>

  <!--
    The group is not live: its realtime room was refused, so what is on screen is
    correct and will not update itself. `0003` already renders this treatment on the
    dashboard, and the wording is the same because the situation is.
  -->
  @if (group().stale) {
    <p class="stale">
      <lib-offline-icon class="stale-glyph" />
      <span>{{ 'zone.detail.stale' | rokuT }}</span>
    </p>
  }

  <nav class="actions">
    <!--
      Members is a route and not a sheet: it has its own scroll, its own paging and
      its own deep link, which is what makes it a destination (section 4.2).
    -->
    <button (click)="openMembers.emit()" class="action" type="button">
      <lib-person-icon class="action-glyph" />
      <span class="action-label">{{ 'zone.detail.members' | rokuT }}</span>

      <!-- How many are in the group, as the row's value: the row leads to them. -->
      <span class="action-value">{{ group().memberCount }}</span>

      <!--
        The number waiting, and the **only** thing on this screen a non-null count
        decides. Which controls exist is decided by `isStaff` below, from `myRole`,
        because the two facts arrive on different events and a stale count must never
        leave an action on screen for somebody who may no longer take it (rule G2).
      -->
      @if (group().pendingRequestCount; as waiting) {
        <span class="pip">{{ waiting }}</span>
      }

      <lib-chevron-right-icon class="action-chevron" />
    </button>

    @if (group().isStaff) {
      <button (click)="openSettings.emit()" class="action" type="button">
        <span class="action-label">{{ 'zone.detail.settings' | rokuT }}</span>
        <lib-chevron-right-icon class="action-chevron" />
      </button>
    }
  </nav>
</div>
