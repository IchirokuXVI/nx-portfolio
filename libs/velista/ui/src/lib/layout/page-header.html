<header class="header">
  <!--
    H4: a back control or an icon, never neither and never both. The label is the
    switch, because a back control with no name is a control nobody can be told about.
  -->
  @if (backLabel(); as label) {
    <button
      (click)="back.emit()"
      [attr.aria-label]="label"
      class="lead"
      type="button"
    >
      @if (leading() === 'close') {
        <lib-close-icon class="lead-glyph" />
      } @else {
        <lib-chevron-left-icon class="lead-glyph" />
      }
    </button>
  } @else {
    <!-- Decoration: the title beside it already names the page. -->
    <span aria-hidden="true" class="icon">
      <ng-content select="[pageHeaderIcon]" />
    </span>
  }

  <h1 class="title">{{ title() }}</h1>

  <div class="actions">
    <!--
      The socket has been down for more than two seconds (plan 0168). A `span` and not
      a `button`: it reports a state and leads nowhere. Its accessible name sits on the
      element, and the glyph is hidden like every other icon here. First in the row, so
      it sits immediately before whatever actions the page projects.
    -->
    @if (attention()) {
      <span
        [attr.aria-label]="'connection.reconnecting' | rokuT"
        class="live-mark"
        role="img"
      >
        <lib-offline-icon aria-hidden="true" />
      </span>
    }
    <ng-content select="[pageHeaderActions]" />
  </div>
</header>
