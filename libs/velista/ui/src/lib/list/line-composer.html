<!--
  While it listens, the whole row is replaced (plan 0038, section 4.1): the stop
  square, and a level meter that moves with the voice.

  The meter is not decoration. The single most common failure of a voice control
  is that the microphone was not picking anything up, and a still meter says that
  before the transcript does. There is no clock and no waveform: the assistant
  panel's clock earns its place at five minutes, and a thirty second cap does not.
-->
@if (listening()) {
  <div class="listening">
    <!--
      Stop at the leading end and the bin at the trailing one, with the meter taking
      every pixel between them (plan 0042, section 6). They are the only two controls
      on screen and confusing them costs the whole recording, so the distance is the
      safeguard.

      DOM order is the visual order, so nothing is moved with `order` and the reading
      order agrees with what is on screen.
    -->
    <button
      (click)="stop()"
      [attr.aria-label]="'list.add.stopListening' | rokuT"
      class="stop"
      type="button"
    >
      <lib-stop-icon class="send-glyph" />
    </button>

    <div aria-hidden="true" class="meter">
      <div [style.inline-size.%]="levelPercent()" class="meter-fill"></div>
    </div>

    <!--
      The meter stays whatever else is happening, because the microphone is still
      open: the previous sentence being on its way to the server is not a reason to
      stop showing that this one is being heard.

      Only the words under it change. A pause sends what was said and reopens the
      microphone at once, so there is a stretch where both are true, and saying so is
      the difference between a system that is working and one that looks stuck.
    -->
    @if (busy()) {
      <p aria-live="polite" class="hint">
        <lib-spinner-icon class="hint-spinner" />
        <span>{{ 'list.add.sending' | rokuT }}</span>
      </p>
    } @else {
      <p class="hint">{{ 'list.add.listening' | rokuT }}</p>
    }

    <!--
      Last, and pushed to the far end of the row. It is the exit that always exits:
      without it a recording had one way out, which was to be sent, so somebody who
      pressed the microphone by accident had to say something to the whole list before
      they could withdraw it.

      It gets the deliberate reach rather than stop, and section 6.3 is why: stop is
      pressed once at the end of a sentence, while somebody is looking at the screen,
      and the bin is the one that gets pressed by accident. The control that costs a
      recording is the one that should be hard to hit.

      Coral, because it is the control that destroys something, and never colour alone
      since it is also the only bin glyph here.
    -->
    <button
      (click)="discard()"
      [attr.aria-label]="'list.add.discard' | rokuT"
      class="discard"
      type="button"
    >
      <lib-trash-icon class="send-glyph" />
    </button>
  </div>
} @else {
  <!--
    The suggestions, above the field and below nothing (plan 0043, section 6).

    Above, because the keyboard is under the field and a list drawn beneath it would be
    behind the keys on every phone. Nearest the field first would be the reverse of the
    server's ranking, so the order is kept and the whole block sits above: a group is
    the top row and it is the row closest to what somebody typed.

    **No empty state, ever.** An absent list is the ordinary case for two characters, a
    rare word, or a shop the catalog has not been taught, and "no matches" would be a
    screen telling somebody their shopping list is wrong. The free text row below is
    always the last one, so there is always something to press.
  -->
  @if (suggestions().length > 0) {
    <ul
      [attr.aria-label]="'list.add.suggestions' | rokuT"
      class="suggestions"
      role="listbox"
    >
      @for (suggestion of suggestions(); track $index) {
        <li role="none">
          <button
            (click)="choose(suggestion)"
            [class.group]="suggestion.kind === 'group'"
            class="suggestion"
            role="option"
            type="button"
          >
            <span aria-hidden="true" class="suggestion-glyph">
              @if (suggestion.kind === 'group') {
                <lib-basket-icon />
              } @else {
                <lib-product-icon />
              }
            </span>

            <span class="suggestion-body">
              <span class="suggestion-name">{{ nameOf(suggestion) }}</span>

              @if (suggestion.kind === 'group') {
                <!--
                  What choosing it will do, said before it is pressed. A group adds
                  several products at once, and a row that quietly did that would be a
                  surprise the first three times.
                -->
                <span class="suggestion-note">{{
                  'list.add.groupAdds' | rokuT: groupSummaryArgs(suggestion)
                }}</span>
              } @else if (suggestion.item.brand) {
                <span class="suggestion-note">{{ suggestion.item.brand }}</span>
              }
            </span>

            <!--
              The word as well as the glyph and the tint. A group and an item are the
              one distinction this list has to make, and it is made three ways because
              nobody has been taught what a basket outline means here.
            -->
            @if (suggestion.kind === 'group') {
              <span class="suggestion-badge">{{
                'list.add.groupBadge' | rokuT
              }}</span>
            }
          </button>
        </li>
      }

      <!--
        Free text, always reachable and never nagged. It is the last row rather than a
        hint under the field, so choosing to ignore the catalog is the same kind of
        gesture as choosing something from it.
      -->
      <li role="none">
        <button
          (click)="submit()"
          class="suggestion plain"
          role="option"
          type="button"
        >
          <span aria-hidden="true" class="suggestion-glyph">
            <lib-plus-icon />
          </span>
          <span class="suggestion-body">
            <span class="suggestion-name">{{
              'list.add.asWritten' | rokuT: { text: content() }
            }}</span>
          </span>
        </button>
      </li>
    </ul>
  }

  <!--
  A form, so Enter on the field submits without a keydown handler and the phone's
  keyboard offers a Go key rather than a newline.
-->
  <form (submit)="onSubmit($event)" class="composer">
    <div class="field-wrap">
      <input
        (input)="onInput($event)"
        [attr.aria-label]="'list.add.placeholder' | rokuT"
        [attr.maxlength]="maxLength"
        [placeholder]="'list.add.placeholder' | rokuT"
        [value]="content()"
        #field
        autocomplete="off"
        class="field"
        enterkeyhint="send"
        name="content"
        type="text"
      />

      <!--
      Only past 350. A live region so the number is announced as it approaches, and
      `polite` so it never interrupts the character being typed.
    -->
      @if (showCounter()) {
        <span aria-live="polite" class="counter">
          {{ content().length }}/{{ maxLength }}
        </span>
      }
    </div>

    <lib-quantity-stepper [(value)]="quantity" [disabled]="busy()" />

    <!--
    One slot, two jobs, and the empty field decides (plan 0038, section 2). A
    plus when there is something typed, a microphone when there is not.

    **The field's emptiness is the switch**, not a mode somebody selects. Two
    buttons side by side, one of them always inert, is a row of controls that has
    to be read before either can be used, and this row already carries a stepper.

    It also keeps the property the composer exists for: adding happens in runs.
    Somebody typing never sees the microphone and somebody speaking never has the
    keyboard open, so neither mode interrupts the other.
  -->
    <button
      (click)="press()"
      [attr.aria-label]="buttonLabel() | rokuT"
      [disabled]="busy() || (button() === 'add' && !canSubmit())"
      [type]="button() === 'add' ? 'submit' : 'button'"
      class="send"
    >
      @if (button() === 'add') {
        <lib-plus-icon class="send-glyph" />
      } @else {
        <lib-mic-icon class="send-glyph" />
      }
    </button>
  </form>
}
