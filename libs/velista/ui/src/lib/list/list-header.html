<!--
  Which group the list belongs to. The list's own name is not here: it is the title of
  the page header above this block, with the settings button beside it (velista 0130).
-->
@if (header().zoneName !== null) {
  <p class="in-group">
    {{ 'list.header.inGroup' | rokuT: { name: header().zoneName } }}
  </p>
}

<!--
  Who else has this list open. Its own component rather than the `PresenceRow` the
  cards use, because this one opens: the screen somebody stands in a shop looking at is
  the one place worth answering who they are and since when, and a card read in passing
  is not.

  It says nothing rather than zero, and it empties with everything else the moment the
  socket drops, which the notice below explains once for the whole screen.
-->
<lib-list-viewers [viewers]="header().viewers" class="viewers" />

<!--
  The list is not live: its zone room was refused, so what is on screen is correct and
  will not update itself. Drawn exactly as `0010` draws it on a group, because the
  situation is the same one. A plain disconnect draws nothing here: the page header's
  mark says that on every page (plan 0168, D7).
-->
@if (!header().live) {
  <p class="stale">
    <lib-offline-icon class="stale-glyph" />
    <span>{{ 'list.header.notLive' | rokuT }}</span>
  </p>
}
