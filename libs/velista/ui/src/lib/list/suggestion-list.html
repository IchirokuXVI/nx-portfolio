<!--
  The cards (velista 0101), in a page's own results since velista 0117, each drawn
  as the one product card (velista 0162). The page scrolls them with everything
  else.

  `mousedown` is cancelled on the whole list, once, which is rule 2: nothing in here
  may take the focus from the field, so the keyboard stays up whatever was pressed.
  See `holdFocus`.
-->
@if (cards().length > 0) {
  <!--
    A grid and not a listbox (rule 8): a card holds a link, a plus, a chain line and
    steppers, and `role="option"` may not contain focusable children. The composer's
    field is the combobox that owns it, and each card is a row of it.
  -->
  <div
    (mousedown)="holdFocus($event)"
    [attr.aria-label]="label() | rokuT"
    [id]="panelId()"
    class="cards"
    role="grid"
  >
    @for (card of cards(); track card.key) {
      <lib-product-row
        (added)="choose(card, $event)"
        (expandToggled)="toggle(card, $event)"
        (lineStepped)="stepHolding(card, $event)"
        [add]="adds().get(card.key) ?? null"
        [alsoCalled]="card.alsoCalled"
        [attr.data-card]="card.key"
        [expanded]="expandedOf(card)"
        [grid]="true"
        [group]="card.group"
        [link]="linkFor(card)"
        [openable]="linkFor(card) !== null"
        [row]="card.row"
        [shops]="card.shops"
      />
    }
  </div>
} @else if (skeletonShown()) {
  <div
    (mousedown)="holdFocus($event)"
    [attr.aria-label]="'list.add.card.loading' | rokuT"
    aria-busy="true"
    class="cards"
    role="status"
  >
    @for (bone of skeleton; track bone) {
      <lib-product-row-skeleton />
    }
  </div>
}
<!--
  The no results row, and the status line that says it once (0108, target 1). A
  component of its own for its stylesheet; see `SuggestionNoMatch`.
-->
<lib-suggestion-no-match [freeText]="freeText()" [words]="emptyFor()" />
