@for (group of groups(); track group.key) {
  <section class="group">
    @if (grouped()) {
      <!--
        A real heading, so the postal code structure is navigable rather than only
        visible (section 7). `h3`, because the page's title is `h1` and the franchise
        section it sits inside is `h2`.
      -->
      <h3 class="heading">
        <span>{{ group.heading }}</span>
        @if (group.code !== null) {
          <span class="code">{{ group.code }}</span>
        }
      </h3>
    }

    <div class="card">
      @for (shop of group.shops; track shop.id) {
        <label
          [class.excluded]="
            mode() === 'exclude' && (shop.excluded || shop.excludedChain)
          "
          class="row"
        >
          <!--
            One control, and the mode decides what kind (velista `0078`, section 4).
            A checkbox answers "do I go to this shop"; a radio answers "which shop am
            I in", and only one shop at a time can be the second.

            One element rather than two branches, because a `<label>` must wrap a
            control the template can be read to contain, and a control inside an
            `@if` is one nothing can promise is there. The class stays `checkbox` for
            both: what it styles is the box's size and the ring the row draws around
            it, and both need the same.
          -->
          <input
            (change)="choose(shop.id)"
            [attr.name]="mode() === 'pick' ? 'shop-pick' : null"
            [checked]="isChecked(shop)"
            [disabled]="mode() === 'exclude' && shop.excludedChain"
            [type]="mode() === 'pick' ? 'radio' : 'checkbox'"
            class="checkbox"
          />

          <span class="what">
            <span class="chain">{{ shop.chain }}</span>
            @if (shop.name !== null) {
              <span class="name">{{ shop.name }}</span>
            }
            @if (shop.where !== null) {
              <span class="where">{{ shop.where }}</span>
            }
          </span>

          <!--
            The word, beside the dimming and the unticked box. Three signals, and none of
            them is the colour.
          -->
          @if (mode() === 'exclude') {
            @if (shop.excludedChain) {
              <span class="mark">{{ 'shops.row.chainExcluded' | rokuT }}</span>
            } @else if (shop.excluded) {
              <span class="mark">{{ 'shops.row.excluded' | rokuT }}</span>
            }
          }
        </label>

        @if (mode() === 'exclude' && shop.failed) {
          <p class="error" role="alert">{{ 'shops.error.save' | rokuT }}</p>
        }
      }
    </div>
  </section>
}
