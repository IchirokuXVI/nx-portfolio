@let page = state();

<div class="page">
  <!-- Always the signed-in header here, and `bordered` is left at its default true
       for the same reason: authenticatedGuard is what says so. -->
  <lib-app-bar
    (account)="account()"
    (openSearch)="search()"
    [accountInitial]="accountInitial()"
    [signedIn]="true"
  />

  @switch (page.kind) {
    @case ('loading') {
      <div class="content">
        <lib-zone-skeleton [count]="2" />
      </div>
    }

    @case ('error') {
      <div class="content">
        <lib-error-state
          (copyReference)="copyReference($event)"
          (retry)="retry()"
          [body]="'home.error.body' | rokuT"
          [correlationId]="page.correlationId"
          [title]="'home.error.title' | rokuT"
        />
      </div>
    }

    @case ('empty') {
      <div class="content">
        @if (page.guest) {
          <lib-guest-upgrade-banner
            (dismiss)="dismissGuestBanner()"
            (secure)="secureAccount()"
          />
        }

        <lib-empty-state
          [body]="'home.empty.body' | rokuT"
          [title]="'home.empty.title' | rokuT"
        >
          <button (click)="createZone()" class="empty-primary" type="button">
            {{ 'home.action.createZone' | rokuT }}
          </button>
          <button (click)="joinZone()" class="empty-secondary" type="button">
            {{ 'home.action.joinCode' | rokuT }}
          </button>
        </lib-empty-state>
      </div>
    }

    @case ('populated') {
      <div class="content">
        @if (page.guest) {
          <lib-guest-upgrade-banner
            (dismiss)="dismissGuestBanner()"
            (secure)="secureAccount()"
          />
        }

        @if (page.resume; as resume) {
          <lib-resume-list-card (open)="openList($event)" [list]="resume" />
        }

        <section class="zones">
          <div class="zones-head">
            <h2 class="section-label">{{ 'home.section.zones' | rokuT }}</h2>
            <button (click)="createZone()" class="new-zone" type="button">
              {{ 'home.action.newZone' | rokuT }}
            </button>
          </div>

          @for (zone of page.zones; track zone.id) {
            <lib-zone-card
              (open)="openZone($event)"
              (openList)="openList($event)"
              (reviewRequests)="reviewRequests($event)"
              [zone]="zone"
            />
          }
        </section>
      </div>

      <lib-bottom-action-bar (joinZone)="joinZone()" (newList)="newList()" />
    }
  }
</div>
