<lib-sheet-shell
  (dismiss)="dismiss()"
  [dismissible]="!submitting()"
  #shell
  labelledBy="create-list-title"
>
  <h2 class="title" id="create-list-title">
    {{ 'zone.newList.title' | rokuT }}
  </h2>
  <p class="body">{{ 'zone.newList.body' | rokuT }}</p>

  <label class="label" for="create-list-name">
    {{ 'zone.newList.label' | rokuT }}
  </label>
  <input
    (input)="onNameInput($event)"
    [attr.maxlength]="maxLength"
    [placeholder]="'zone.newList.placeholder' | rokuT"
    [value]="name()"
    autocomplete="off"
    class="field"
    id="create-list-name"
    type="text"
  />

  <!--
    A real checkbox, labelled by wrapping it, and described by the sentence under it.
    Ticked by default because sharing is what a group is for, and it is a checkbox
    rather than two segments because there is a plain default and a deliberate
    exception, not two equal choices.
  -->
  <div class="choice">
    <label class="choice-label" for="create-list-share">
      <input
        (change)="onShareChange($event)"
        [checked]="shareWithZone()"
        [disabled]="submitting()"
        aria-describedby="create-list-share-hint"
        class="checkbox"
        id="create-list-share"
        type="checkbox"
      />
      <span>{{ 'zone.newList.shareLabel' | rokuT }}</span>
    </label>
    <p class="choice-hint" id="create-list-share-hint">
      {{ 'zone.newList.shareHint' | rokuT }}
    </p>
  </div>

  @if (errorKey(); as key) {
    <p class="error" role="alert">{{ key | rokuT }}</p>
  }

  <button
    (click)="submit()"
    [attr.aria-busy]="submitting()"
    [disabled]="!canSubmit()"
    class="primary"
    type="button"
  >
    @if (submitting()) {
      <lib-spinner-icon class="spinning" />
    }
    <span>{{ 'zone.newList.submit' | rokuT }}</span>
  </button>

  @if (!submitting()) {
    <button (click)="shell.requestDismiss()" class="cancel" type="button">
      {{ 'entry.cancel' | rokuT }}
    </button>
  }
</lib-sheet-shell>
