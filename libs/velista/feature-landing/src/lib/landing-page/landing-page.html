<div class="page">
  <lib-app-bar
    (localeChange)="switchLocale($event)"
    [locale]="localeLabel()"
    [locales]="locales"
  />

  <!--
    Said once, and only after a delete (plan 0015, section 5.7). It is not a success
    note and must not be toned as one: nothing good just happened, something asked for
    did. Cleared as it is read, so a reload of this URL does not repeat it.
  -->
  @if (accountDeleted) {
    <p class="notice" role="status">{{ 'account.delete.done' | rokuT }}</p>
  }

  <lib-home-hero />

  <lib-list-preview-card
    [lines]="previewLines()"
    [listName]="'home.preview.listName' | rokuT"
    [shoppingNow]="2"
    [zoneName]="'home.preview.zoneName' | rokuT"
  />

  <div class="spacer"></div>

  <!--
    Held while the app cannot reach the backend (plan 0071, section 5.1). This is the
    one screen that draws before the startup probe has answered, so it is also the one
    place where a control could act on a backend nobody has heard from yet, and the
    first of these four creates an account.
  -->
  <lib-auth-actions
    (continueWithGoogle)="continueWithGoogle()"
    (createZone)="createZone()"
    (joinZone)="joinZone()"
    (signInWithEmail)="signInWithEmail()"
    [connectingMessage]="'startup.actions.connecting' | rokuT"
    [failureMessage]="googleError() === null ? '' : (googleError()! | rokuT)"
    [googleBusy]="googleStarting()"
    [googleOffered]="googleOffered"
    [held]="actionsHeld()"
    [slow]="startupSlow()"
    [slowMessage]="'startup.actions.slow' | rokuT"
  />

  <!--
    The foot: the privacy policy, the terms and the version on one line (velista 0172).
    The front door is the home page Google's consent screen names, so the policy link
    belongs here, signed out. On one line rather than a row of their own because at
    360 by 640 the ways in already reach below the fold, and a second row would push
    them further. Last on the page, and the only thing here whose loss on a very short
    phone costs nothing, which is why it is at the end rather than in the header.
  -->
  <div class="foot">
    <lib-legal-links
      [privacyUrl]="legalUrls().privacy"
      [termsUrl]="legalUrls().terms"
    />
    <lib-app-version />
  </div>
</div>

<!--
  Where a sheet renders (plan 0008, rule E1). Outside `.page` on purpose: a sheet is
  fixed to the viewport and covers this screen, so nesting it inside the layout that
  pushes the entry actions into thumb reach would make it part of that layout.
-->
<router-outlet></router-outlet>
