@let vm = row();

<button
  (click)="open.emit(vm.id)"
  [class.is-active]="vm.active"
  class="row"
  type="button"
>
  <span class="text">
    <span class="head">
      <span class="name">{{ vm.name }}</span>

      <!--
        The word, never colour alone (section 7). The green border beside it is a second
        signal for people who read at a glance, and it says nothing this does not.
      -->
      @if (vm.active) {
        <span class="badge">{{ 'history.status.active' | rokuT }}</span>
      } @else if (vm.finished) {
        <!--
          A trip that is over, marked and never hidden (velista 0057, section 9). The
          same slot as the badge above, because a row says one thing about where a
          trip has got to, and quieter than it: "Shopping now" is a way back into
          something, and this is a fact about something that has stopped.
        -->
        <span class="badge is-finished">
          {{ 'history.status.finished' | rokuT }}
        </span>
      }
    </span>

    <span class="meta">
      {{ generatedOn() }}
      <span aria-hidden="true"> &middot; </span>
      <!--
        What actually came home, once the summary can say it (plan 0049, section 2).
        `breakdown` is null on a server that does not carry the two outcome counts, and
        on any trip whose finished lines they do not account for, and the row then says
        "finished" exactly as it did before: that word is the honest one for a number
        merging a purchase with a shop that had none, and it is not to be improved into
        a guess. The unavailable half is dropped at zero rather than saying "0 not
        available", which is the ordinary trip.
      -->
      @if (vm.breakdown; as outcome) {
        {{
          'history.row.got'
            | rokuT: { bought: outcome.bought, total: vm.lineCount }
        }}
        @if (outcome.notAvailable > 0) {
          {{
            'history.row.unavailable' | rokuT: { count: outcome.notAvailable }
          }}
        }
      } @else {
        {{
          'history.row.progress'
            | rokuT: { settled: vm.settledLineCount, total: vm.lineCount }
        }}
      }
    </span>
  </span>

  <lib-chevron-right-icon class="chevron" />
</button>
