<lib-sheet-shell (dismiss)="back()" labelledBy="shop-picker-title">
  <!--
    The chevron beside the title, which is this sheet's own way back. It is a
    dismissal rather than a navigation: the filter sheet pushed this one, so popping
    lands there and nothing is pushed (`0031`).
  -->
  <div class="head">
    <button
      (click)="back()"
      [attr.aria-label]="'basket.view.shop.back' | rokuT"
      class="back"
      type="button"
    >
      <lib-chevron-left-icon class="back-glyph" />
    </button>
    <h2 class="title" id="shop-picker-title">
      {{ 'basket.view.shop.title' | rokuT }}
    </h2>
  </div>

  <!--
    The body the get a list sheet draws too (velista `0102`): the search, the chain
    buttons, and the open chain's shops or the flat matches, one radio each.
  -->
  <lib-shop-picker
    (chosen)="select($event)"
    (picked)="pickShop($event)"
    (queried)="onQuery($event)"
    [chains]="chains()"
    [groups]="groups()"
    [matchCount]="matches()"
    [matches]="flat()"
    [openKey]="openChain()"
    [openName]="openName()"
    [pickedId]="pickedId()"
    [query]="typed()"
    fieldId="basket-shop-search"
  />
</lib-sheet-shell>
