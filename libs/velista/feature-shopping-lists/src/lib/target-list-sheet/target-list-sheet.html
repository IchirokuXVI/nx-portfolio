<lib-sheet-shell (dismiss)="close()" labelledBy="target-title">
  <h2 class="title" id="target-title" tabindex="-1">
    {{ 'basket.add.sheetTitle' | rokuT }}
  </h2>

  <!--
    **One radio group and not one per household** (velista 0092, section 7.3).

    There is one question here — which list — so a reader moving by arrow key
    travels the whole set, which is what somebody choosing between seven lists
    would expect. The headings are the group's option groups, which is what the
    `name` shared across every input makes them.

    Real radios in a real fieldset, never a segmented control: `0030` section 6.1
    made that call for independent options and `0024` for a choice that is not a
    decision, and this is the second kind. The label is the tap target.
  -->
  <fieldset class="group">
    <legend class="visually-hidden">{{ 'basket.add.choose' | rokuT }}</legend>

    @for (group of groups(); track group.zoneId) {
      <!--
        The household's name, once, above its lists. Two households both keep one
        called "Groceries", and a suffix on every row would say the same words
        four times where a heading says them once.
      -->
      <p [attr.id]="'zone-' + group.zoneId" class="zone">
        {{ group.zoneName }}
      </p>

      <ul [attr.aria-labelledby]="'zone-' + group.zoneId" class="lists">
        @for (list of group.lists; track list.listId) {
          <li>
            <label [class.picked]="chosenId() === list.listId" class="choice">
              <input
                (change)="choose(list)"
                [checked]="chosenId() === list.listId"
                class="control"
                name="basket-target"
                type="radio"
              />
              <span class="choice-title">{{ list.name }}</span>
            </label>
          </li>
        }
      </ul>
    }
  </fieldset>
</lib-sheet-shell>
