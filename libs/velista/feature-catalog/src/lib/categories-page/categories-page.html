<lib-page-header
  (back)="back()"
  [backLabel]="'catalog.categories.back' | rokuT"
  [title]="'catalog.categories.title' | rokuT"
/>

<main class="page">
  @switch (state()) {
    @case ('loaded') {
      @if (rows().length > 0) {
        <lib-category-rows [rows]="rows()" />
      } @else {
        <p class="failed">{{ 'catalog.categories.none' | rokuT }}</p>
      }
    }
    @case ('failed') {
      <div class="failed" role="alert">
        <p class="failed-text">{{ 'catalog.categories.failed' | rokuT }}</p>
        <button (click)="retry()" class="secondary" type="button">
          {{ 'catalog.error.retry' | rokuT }}
        </button>
      </div>
    }
    @default {
      <div aria-live="polite" role="status">
        <span class="visually-hidden">
          {{ 'catalog.categories.loading' | rokuT }}
        </span>
        <div aria-hidden="true" class="skeleton">
          @for (bone of skeletonRows; track bone) {
            <span class="bone"></span>
          }
        </div>
      </div>
    }
  }
</main>
