<!--
  The one page header (velista 0130). At the root the title is the page's, and Near
  me is its one quick action. On a chain's screen the title is the chain's name, or
  the page's word until the chains arrive, and there is no action: a chain's screen
  lists its shops and nothing else.
-->
<lib-page-header
  (back)="back()"
  [backLabel]="
    (openKey === null
      ? 'catalog.supermarket.back'
      : 'catalog.supermarket.backToChains'
    ) | rokuT
  "
  [title]="title() ?? ('catalog.supermarket.title' | rokuT)"
>
  <ng-container pageHeaderActions>
    @if (openKey === null) {
      <!--
        Near me (velista 0103) as a header's text action. The name, the busy state
        and the glyphs are `lib-near-me-button`'s, which is a bordered pill and so
        cannot be the quiet word a header holds. Never `disabled`, as there: a
        second press is swallowed by `ShopFinder` and focus stays on the button.
      -->
      <button
        (click)="findNear()"
        [attr.aria-busy]="finding()"
        [attr.aria-label]="
          finding()
            ? ('basket.view.shop.near.finding' | rokuT)
            : ('basket.view.shop.near.buttonLabel' | rokuT)
        "
        [class.is-busy]="finding()"
        class="near"
        kind="text"
        libPageHeaderAction
        type="button"
      >
        @if (finding()) {
          <lib-spinner-icon class="near-glyph" />
          {{ 'basket.view.shop.near.finding' | rokuT }}
        } @else {
          <lib-locate-icon class="near-glyph" />
          {{ 'basket.view.shop.near.button' | rokuT }}
        }
      </button>
    }
  </ng-container>
</lib-page-header>

<main class="page">
  <!--
    One chain: its logo and how many of its shops are in the person's areas, as the
    first line of the content. A header holds only a title (velista 0130).
  -->
  @if (head(); as chain) {
    <div class="chain-line">
      <lib-chain-logo [logo]="chain.logo" size="sm" />
      <span>{{ 'shops.chain.inAreas' | rokuT: { count: chain.count } }}</span>
    </div>
  }

  <lib-shop-picker
    (about)="openShop($event)"
    (anyChosen)="chooseAny()"
    (chosen)="openChain($event)"
    (picked)="pick($event)"
    (queried)="onQuery($event)"
    [anyRow]="anyRow()"
    [chains]="chains()"
    [groups]="groups()"
    [matchCount]="matchCount()"
    [matches]="matches()"
    [near]="near()"
    [openKey]="openKey"
    [pickedChain]="pickedChain"
    [pickedId]="pickedId"
    [query]="query()"
    [recent]="recent()"
    [searchPending]="searchPending()"
    [state]="state()"
    fieldId="catalog-shop-search"
  />
</main>
