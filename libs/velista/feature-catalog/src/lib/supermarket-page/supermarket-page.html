<!--
  The one page header (velista 0130): the page's title and the way back, and no
  action. One press on this page is the whole answer.
-->
<lib-page-header
  (back)="back()"
  [backLabel]="'catalog.supermarket.back' | rokuT"
  [title]="'catalog.supermarket.title' | rokuT"
/>

<main class="page">
  <!-- All supermarkets: the catalog with no chain, checked while none is chosen. -->
  <div class="card">
    <label class="any">
      <lib-chain-logo [logo]="everyChain" class="any-logo" />
      <span class="any-text">
        <span class="any-title">{{ 'catalog.supermarket.all' | rokuT }}</span>
        <span class="any-detail">
          {{ 'catalog.supermarket.allDetail' | rokuT }}
        </span>
      </span>
      <input
        (change)="chooseAll()"
        [checked]="pickedChain === null"
        class="any-radio"
        name="catalog-supermarket-all"
        type="radio"
      />
    </label>
  </div>

  @switch (state()) {
    @case ('loading') {
      <p aria-live="polite" class="note" role="status">
        <lib-spinner-icon class="spinner" />
        {{ 'shops.loading' | rokuT }}
      </p>
    }
    @case ('failed') {
      <p class="note" role="alert">{{ 'shops.error.load' | rokuT }}</p>
    }
    @default {
      <!--
        One big button per chain, two to a row, with its logo and its count. A
        press is the answer, and the chosen chain wears the tick.
      -->
      <lib-franchise-buttons
        (chosen)="chooseChain($event)"
        [chains]="chains()"
        [openKey]="pickedChain"
      />
    }
  }
</main>
