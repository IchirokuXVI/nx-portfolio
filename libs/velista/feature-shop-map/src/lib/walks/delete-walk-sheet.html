<lib-sheet-shell
  (dismiss)="dismiss()"
  [dismissible]="!busy()"
  #shell
  labelledBy="delete-walk-title"
>
  <h2 class="title" id="delete-walk-title">
    {{ 'shopWalks.delete.title' | rokuT: { name: walk()?.name ?? '' } }}
  </h2>
  <p class="body">
    {{
      (walk()?.shown ? 'shopWalks.delete.bodyShown' : 'shopWalks.delete.body')
        | rokuT
    }}
  </p>

  @if (failed()) {
    <p class="error" role="alert">{{ 'shopWalks.delete.failed' | rokuT }}</p>
  }

  <div class="actions">
    <button
      (click)="confirm()"
      [attr.aria-busy]="busy()"
      class="primary destructive"
      type="button"
    >
      @if (busy()) {
        <lib-spinner-icon class="spinning" />
      }
      <span>{{ 'shopWalks.delete.confirm' | rokuT }}</span>
    </button>
    @if (!busy()) {
      <button (click)="shell.requestDismiss()" class="cancel" type="button">
        {{ 'shopWalks.cancel' | rokuT }}
      </button>
    }
  </div>
</lib-sheet-shell>
