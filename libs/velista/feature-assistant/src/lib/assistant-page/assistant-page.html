<!--
  The one header (velista `0130`), which every page draws and which sits outside the
  column that scrolls.
-->
<lib-page-header
  (back)="back()"
  [backLabel]="'assistant.back' | rokuT"
  [title]="'assistant.title' | rokuT"
/>

<main #column class="column">
  @if (messages().length === 0) {
    <lib-assistant-intro />
  } @else {
    <!--
      `chose` goes to the same `send` the composer calls (plan 0042, section 4.2).
      Tapping an answer is typing it: the caller's own bubble shows the text that was
      sent, the transcript records it, and the store's cap counts it. There is no
      second request shape and nothing new for the store to remember.
    -->
    @for (message of messages(); track $index) {
      <lib-assistant-message (chose)="send($event)" [message]="message" />
    }
  }
</main>

<!--
  The composer holds the recorder as well as the field, so this is one element and not
  two branches of a template: the button that records and the button that sends are the
  same button, and splitting them here is what would let them move (section 4.1).
-->
<lib-assistant-composer
  (send)="send($event)"
  (spoke)="spoke($event)"
  [disabled]="composerDisabled()"
/>
