<div class="section-vision-container">
  <div class="section-title">
    <lib-damoclesSword-double-bordered-title
      [borderAlignment]="BorderAlignment.RIGHT"
    >
      {{ 'section-vision.main-title' | rokuT }}
    </lib-damoclesSword-double-bordered-title>
  </div>
  <div class="section-content">
    <div class="content-text">
      <span>
        {{ 'section-vision.business-talk' | rokuT }}
      </span>
      <lib-damoclesSword-call-to-action-button
        [link]="[]"
        class="know-more-button"
      >
        {{ 'section-vision.know-more' | rokuT }}
      </lib-damoclesSword-call-to-action-button>
    </div>
    <div class="content-img">
      <img [src]="sectionVisionAddon" alt="Vision" />
    </div>
  </div>
</div>
