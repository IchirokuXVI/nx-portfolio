<lib-damocles-sword-section-layout
  [borderAlignment]="BorderAlignment.LEFT"
  [title]="'section-projects-detailed.main-title' | rokuT"
>
  <div class="section-content">
    @for (project of projects(); track project.label) {
      <article class="detailed-project-card">
        <div class="card-title">{{ project.label }}</div>
        <div class="card-body">
          <div class="card-media">
            @let trailerSrc = project.trailer | async;
            @if (trailerSrc) {
              <video autoplay loop playsinline [muted]="true">
                <source [src]="trailerSrc" type="video/mp4" />
              </video>
            }
          </div>
          <div class="card-info">
            <p class="card-description">{{ project.description }}</p>
            <div class="card-tags">
              @for (tag of project.tags; track tag.label) {
                <span class="tag-chip">
                  <span class="tag-label">{{ tag.label }}</span>
                  <span class="tag-value">{{ tag.value }}</span>
                </span>
              }
            </div>
          </div>
        </div>
      </article>
    }
  </div>
</lib-damocles-sword-section-layout>
