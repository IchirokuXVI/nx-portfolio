<lib-damocles-sword-section-layout
  [borderAlignment]="BorderAlignment.RIGHT"
  [title]="'section-where-we-fit.main-title' | rokuT"
>
  <div class="section-content">
    <p class="intro">{{ 'section-where-we-fit.intro' | rokuT }}</p>

    <div class="cards-row">
      <lib-damocles-sword-info-card
        [description]="'section-where-we-fit.fit-1-description' | rokuT"
        [title]="'section-where-we-fit.fit-1-title' | rokuT"
      />
      <lib-damocles-sword-info-card
        [description]="'section-where-we-fit.fit-2-description' | rokuT"
        [title]="'section-where-we-fit.fit-2-title' | rokuT"
      />
      <lib-damocles-sword-info-card
        [description]="'section-where-we-fit.fit-3-description' | rokuT"
        [title]="'section-where-we-fit.fit-3-title' | rokuT"
      />
      <lib-damocles-sword-info-card
        [description]="'section-where-we-fit.fit-4-description' | rokuT"
        [title]="'section-where-we-fit.fit-4-title' | rokuT"
      />
    </div>

    <p class="closing">{{ 'section-where-we-fit.closing' | rokuT }}</p>
  </div>
</lib-damocles-sword-section-layout>
