<lib-damocles-sword-section-layout
  [borderAlignment]="BorderAlignment.LEFT"
  [title]="'section-news.main-title' | rokuT"
>
  <div class="section-content">
    @for (item of news(); track item.newsId) {
      <lib-damocles-sword-news-card [news]="item" />
    }
  </div>
  <lib-damocles-sword-call-to-action-button [link]="[]" class="see-more-button">
    {{ 'section-news.see-more' | rokuT }}
  </lib-damocles-sword-call-to-action-button>
</lib-damocles-sword-section-layout>
