<div class="section-news-container">
  <div class="section-title">
    <lib-damocles-sword-double-bordered-title
      [borderAlignment]="BorderAlignment.LEFT"
    >
      {{ 'section-news.main-title' | rokuT }}
    </lib-damocles-sword-double-bordered-title>
  </div>
  <div class="section-content">
    @for (item of news(); track item.newsId) {
      <lib-damocles-sword-news-card [news]="item" />
    }
  </div>
  <lib-damocles-sword-call-to-action-button
    class="see-more-button"
    [link]="[]"
  >
    {{ 'section-news.see-more' | rokuT }}
  </lib-damocles-sword-call-to-action-button>
</div>
