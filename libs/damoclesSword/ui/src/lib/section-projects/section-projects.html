<lib-damocles-sword-section-layout
  [borderAlignment]="BorderAlignment.CENTER"
  [title]="'section-projects.main-title' | rokuT"
>
  <div class="subsection subsection-client-projects">
    <div class="subsection-title">
      {{ 'section-projects.client-projects-title' | rokuT }}
    </div>
    <div class="subsection-description">
      {{ 'section-projects.client-projects-description' | rokuT }}
    </div>
    <div class="subsection-content">
      @for (project of clientProjects(); track $index) {
        <lib-damocles-sword-project-card [project]="project" />
      }
    </div>
  </div>
  <div class="subsection subsection-games">
    <div class="subsection-title">
      {{ 'section-projects.games-title' | rokuT }}
    </div>
    <div class="subsection-content">
      @for (project of games(); track $index) {
        <lib-damocles-sword-project-card [project]="project" />
      }
    </div>
  </div>
</lib-damocles-sword-section-layout>
