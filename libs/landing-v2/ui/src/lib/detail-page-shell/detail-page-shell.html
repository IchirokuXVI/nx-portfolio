<article class="detail-page">
  <div class="detail-page__inner">
    <header class="detail-page__header">
      <div class="detail-page__header-main">
        <h1 class="detail-page__title">{{ title() }}</h1>
        @if (tagline()) {
          <p class="detail-page__tagline">{{ tagline() }}</p>
        }
        <div class="detail-page__links">
          @if (repoLink()) {
            <a
              [href]="repoLink()"
              class="detail-page__link"
              rel="noopener"
              target="_blank"
            >
              <lib-github-icon class="detail-page__link-icon" />
              {{ 'landingV2.detail.view_repo' | rokuT }}
            </a>
          }
          @if (appLink()) {
            <a
              [routerLink]="[appLink()]"
              class="detail-page__link detail-page__link--primary"
            >
              {{ 'landingV2.detail.visit_live' | rokuT }}
              <lib-arrow-icon class="detail-page__link-icon" />
            </a>
          }
        </div>
      </div>

      <!-- Optional header-side content (the portfolio puts its tech chips here
           on desktop; empty and inert on pages that do not project it). -->
      <div class="detail-page__header-aside">
        <ng-content select="[header-aside]" />
      </div>
    </header>

    @if (heroImage()) {
      <div class="detail-page__hero-media">
        <img [alt]="title()" [src]="resolvedHeroImage() | async" />
      </div>
    }

    <div class="detail-page__layout">
      <div class="detail-page__body">
        <ng-content select="[body]" />
      </div>
      <aside class="detail-page__side">
        <ng-content select="[side]" />
      </aside>
    </div>
  </div>
</article>
