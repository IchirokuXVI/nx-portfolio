<lib-landing-v2-detail-page-shell
  [appLink]="project().appLink"
  [heroImage]="project().image"
  [repoLink]="project().repoLink"
  [tagline]="project().tagline"
  [title]="project().name"
>
  <div body>
    <div class="portfolio-sections" id="portfolio-sections">
      @for (id of sectionIds; track id) {
        <lib-landing-v2-detail-section
          [heading]="key + '.sections.' + id + '.title' | rokuT"
          [open]="deepDive()"
          [sectionId]="id"
        >
          <p lead>{{ key + '.sections.' + id + '.lead' | rokuT }}</p>
          <p deep>{{ key + '.sections.' + id + '.detail' | rokuT }}</p>
        </lib-landing-v2-detail-section>
      }
    </div>

    <div class="portfolio-reveal">
      <button
        class="portfolio-reveal__button"
        [attr.aria-expanded]="deepDive()"
        (click)="toggleDeepDive()"
        aria-controls="portfolio-sections"
        type="button"
      >
        <span>
          {{
            (deepDive()
              ? key + '.reveal_less'
              : key + '.reveal_more'
            ) | rokuT
          }}
        </span>
        <span
          class="portfolio-reveal__caret"
          [class.portfolio-reveal__caret--up]="deepDive()"
          aria-hidden="true"
        ></span>
      </button>
    </div>
  </div>

  <div meta>
    <div class="portfolio-meta">
      <lib-landing-v2-detail-toc class="portfolio-meta__toc" [items]="tocItems" />

      <div class="portfolio-meta__chips">
        @for (group of chipGroups; track group.headingKey) {
          <lib-landing-v2-tech-chip-group
            [chips]="group.chips"
            [heading]="group.headingKey | rokuT"
          />
        }
      </div>

      <lib-landing-v2-facts-table [facts]="facts" />
    </div>
  </div>
</lib-landing-v2-detail-page-shell>
