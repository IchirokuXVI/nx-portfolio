<lib-landing-v2-detail-page-shell
  [appLink]="project().appLink"
  [heroImage]="project().image"
  [repoLink]="project().repoLink"
  [tagline]="project().tagline"
  [title]="project().name"
>
  <div class="portfolio-chips" header-aside>
    <lib-landing-v2-tech-chip-group [chips]="chips" />
  </div>

  <div
    class="portfolio-swap"
    [class.portfolio-swap--collapsed]="collapsed()"
    body
  >
    <div class="portfolio-swap__inner">
      @if (deepDive()) {
        <div class="portfolio-reveal portfolio-reveal--top">
          <ng-container [ngTemplateOutlet]="revealButton" />
        </div>
      }

      <div class="portfolio-sections" id="portfolio-sections">
        @for (section of visibleSections(); track section.id) {
          <lib-landing-v2-detail-section
            [heading]="headingKey(section) | rokuT"
            [paragraphKeys]="paragraphKeys(section)"
            [sectionId]="section.id"
          />
        }
      </div>

      @if (deepDive()) {
        <p class="portfolio-closing">{{ key + '.closing_note' | rokuT }}</p>
      } @else {
        <div class="portfolio-reveal portfolio-reveal--bottom">
          <ng-container [ngTemplateOutlet]="revealButton" />
        </div>
      }
    </div>
  </div>

  <nav class="portfolio-meta" meta>
    <lib-landing-v2-detail-toc [items]="tocItems()" />
  </nav>
</lib-landing-v2-detail-page-shell>

<ng-template #revealButton>
  <button
    class="portfolio-reveal__button"
    [attr.aria-expanded]="deepDive()"
    (click)="toggleDeepDive()"
    aria-controls="portfolio-sections"
    type="button"
  >
    <span>
      {{ (deepDive() ? key + '.reveal_less' : key + '.reveal_more') | rokuT }}
    </span>
    <span
      class="portfolio-reveal__caret"
      [class.portfolio-reveal__caret--up]="deepDive()"
      aria-hidden="true"
    ></span>
  </button>
</ng-template>
